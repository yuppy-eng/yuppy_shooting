  ctx.translate(bossDeath.x + Math.sin(frameCount * 0.07) * (6 + t * 18), bossDeath.y + fall + Math.sin(frameCount * 0.21) * (3 + t * 12));
  ctx.rotate(Math.sin(frameCount * 0.11) * (0.04 + t * 0.15) + t * 0.2);
  ctx.scale(scaleX, scaleY);
  ctx.shadowColor = 'rgba(155,134,217,0.75)';
  ctx.shadowBlur = 28 + Math.sin(frameCount * 0.11) * 8;
  const img = imgs[bossDeath.imgKey];
  if (img) drawImageCoverOutlined(img, -bossDeath.w/2, -bossDeath.h/2, bossDeath.w, bossDeath.h, 3);
  ctx.restore();

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = Math.max(0, 0.55 - t * 0.25);
  const r = 58 + t * 360;
  const grd = ctx.createRadialGradient(bossDeath.x, bossDeath.y + fall, 10, bossDeath.x, bossDeath.y + fall, r);
  grd.addColorStop(0, 'rgba(255,248,237,0.16)');
  grd.addColorStop(0.38, 'rgba(155,134,217,0.22)');
  grd.addColorStop(0.7, 'rgba(239,91,143,0.12)');
  grd.addColorStop(1, 'transparent');
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.arc(bossDeath.x, bossDeath.y + fall, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawImageCover(img, dx, dy, dw, dh) {
  const scale = Math.min(img.width / dw, img.height / dh);
  const sw = dw * scale;
  const sh = dh * scale;
  const sx = (img.width - sw) / 2;
  const sy = (img.height - sh) / 2;
  ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
}

function drawImagePartOutlined(img, sx, sy, sw, sh, dx, dy, dw, dh, outline = 4) {
  const offsets = Array.from({ length: 12 }, (_, i) => {
    const a = (i / 12) * Math.PI * 2;
    return [Math.cos(a) * outline, Math.sin(a) * outline];
  });
  ctx.save();
  ctx.globalAlpha = 0.86;
  ctx.filter = 'brightness(0) blur(0.35px)';
  offsets.forEach(([ox, oy]) => ctx.drawImage(img, sx, sy, sw, sh, dx + ox, dy + oy, dw, dh));
  ctx.restore();
  ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
}

function drawImageCoverOutlined(img, dx, dy, dw, dh, outline = 4) {
  const scale = Math.min(img.width / dw, img.height / dh);
  const sw = dw * scale;
  const sh = dh * scale;
  const sx = (img.width - sw) / 2;
  const sy = (img.height - sh) / 2;
  drawImagePartOutlined(img, sx, sy, sw, sh, dx, dy, dw, dh, outline);
}

function drawImageContainOutlined(img, dx, dy, dw, dh, outline = 4) {
  const scale = Math.min(dw / img.width, dh / img.height);
  const w = img.width * scale;
  const h = img.height * scale;
  drawImagePartOutlined(img, 0, 0, img.width, img.height, dx + (dw - w) / 2, dy + (dh - h) / 2, w, h, outline);
}

// ===== DRAW: BEAM =====
function drawBeam(b) {
  if (b.stage === 3) { drawBoss3Special(b); return; }
  if (b.stage === 2) { drawGorillaShockwave(b); return; }
  const bx = b.beamX, startY = b.y + b.h/2;
  if (b.beamPhase === 'charging') {
    const progress = 1 - b.beamTimer/90, r = 18 + progress*76;
    ctx.save();
    const grd = ctx.createRadialGradient(bx, startY, 0, bx, startY, r);
    grd.addColorStop(0,    `rgba(255,248,237,${progress})`);
    grd.addColorStop(0.24, `rgba(226,177,111,${progress*0.9})`);
    grd.addColorStop(0.58, `rgba(122,74,43,${progress*0.58})`);
    grd.addColorStop(1,    'transparent');
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(bx, startY, r, 0, Math.PI*2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    for (let i = 0; i < 4; i++) {
      const x = bx + Math.sin(frameCount * 0.045 + i * 1.7) * 23 * progress;
      ctx.strokeStyle = `rgba(${i % 2 ? '255,248,237' : '122,74,43'},${0.42 * progress})`;
      ctx.lineWidth = 2 + i;
      ctx.beginPath();
      ctx.moveTo(x, startY + 10);
      ctx.bezierCurveTo(x - 22, startY + 110, x + 25, startY + 190, x, H);
      ctx.stroke();
    }
    for (let i = 0; i < 8; i++) {
      const ox = Math.sin(frameCount * 0.08 + i) * 26 * progress;
      ctx.fillStyle = i % 3 === 0 ? `rgba(255,248,237,${0.55 * progress})` : `rgba(185,121,71,${0.55 * progress})`;
      ctx.beginPath();
      ctx.ellipse(bx + ox, startY + 18 + i * 14, 3 + i * 0.25, 5 + i * 0.3, 0.3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  } else if (b.beamPhase === 'firing') {
    const pulse = 0.5 + Math.sin(frameCount * 0.34) * 0.5;
    const ripple = Math.sin(frameCount * 0.11) * 7;
    const flicker = 0.9 + pulse * 0.1, beamW = 118;
    ctx.save();

    const beamTop = startY - 8;
    const beamBottom = H + 38;
    const edgePoints = [];
    for (let y = beamTop; y <= beamBottom; y += 28) {
      const t = (y - beamTop) / Math.max(1, beamBottom - beamTop);
      const width = beamW * (0.36 + 0.08 * Math.sin(t * Math.PI * 2 + frameCount * 0.04));
      const wobble = Math.sin(t * 10 + frameCount * 0.075) * 10 + Math.sin(t * 23 - frameCount * 0.035) * 4;
      edgePoints.push({ y, left: bx - width + wobble, right: bx + width + wobble });
    }

    ctx.globalCompositeOperation = 'lighter';
    const aura = ctx.createRadialGradient(bx, startY + 22, 8, bx, startY + 210, beamW * 1.55);
    aura.addColorStop(0, 'rgba(255,248,237,0.32)');
    aura.addColorStop(0.36, 'rgba(226,177,111,0.18)');
    aura.addColorStop(0.72, 'rgba(122,74,43,0.08)');
    aura.addColorStop(1, 'transparent');
    ctx.fillStyle = aura;
    ctx.beginPath();
    ctx.ellipse(bx, startY + 220, beamW * 1.45, H - startY + 90, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';

    ctx.beginPath();
    edgePoints.forEach((pt, i) => {
      if (i === 0) ctx.moveTo(pt.left, pt.y);
      else ctx.lineTo(pt.left, pt.y);
    });
    for (let i = edgePoints.length - 1; i >= 0; i--) {
      const pt = edgePoints[i];
      ctx.lineTo(pt.right, pt.y);
    }
    ctx.closePath();
    ctx.save();
    ctx.clip();

    const cg = ctx.createLinearGradient(bx-beamW/2, 0, bx+beamW/2, 0);
    cg.addColorStop(0,    'transparent');
    cg.addColorStop(0.1,  `rgba(54,27,14,${flicker*0.84})`);
    cg.addColorStop(0.24, `rgba(104,58,31,${flicker})`);
    cg.addColorStop(0.42, `rgba(185,121,71,${flicker})`);
    cg.addColorStop(0.5,  `rgba(255,240,204,${flicker*0.92})`);
    cg.addColorStop(0.58, `rgba(185,121,71,${flicker})`);
    cg.addColorStop(0.76, `rgba(104,58,31,${flicker})`);
    cg.addColorStop(0.9,  `rgba(54,27,14,${flicker*0.84})`);
    cg.addColorStop(1,    'transparent');
    ctx.fillStyle = cg;
    ctx.fillRect(bx - beamW * 0.62, beamTop, beamW * 1.24, beamBottom - beamTop);

    const shine = ctx.createLinearGradient(bx - 11, 0, bx + 11, 0);
    shine.addColorStop(0, 'rgba(255,248,237,0)');
    shine.addColorStop(0.48, `rgba(255,248,237,${0.7 + pulse * 0.18})`);
    shine.addColorStop(1, 'rgba(255,248,237,0)');
    ctx.fillStyle = shine;
    ctx.fillRect(bx - 13 + ripple * 0.2, beamTop, 26, beamBottom - beamTop);

    ctx.restore();

    ctx.strokeStyle = 'rgba(255,248,237,0.28)';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    edgePoints.forEach((pt, i) => {
      const x = pt.left + 4;
      if (i === 0) ctx.moveTo(x, pt.y); else ctx.lineTo(x, pt.y);
    });
    ctx.stroke();
    ctx.beginPath();
    edgePoints.forEach((pt, i) => {
      const x = pt.right - 4;
      if (i === 0) ctx.moveTo(x, pt.y); else ctx.lineTo(x, pt.y);
    });
    ctx.stroke();

    for (let i = 0; i < 5; i++) {
      const offset = (i - 2) * 15 + Math.sin(frameCount * 0.08 + i) * 9;
      ctx.strokeStyle = i === 2 ? 'rgba(255,248,237,0.54)' : 'rgba(226,177,111,0.38)';
      ctx.lineWidth = i === 2 ? 5 : 3;
      ctx.beginPath();
      ctx.moveTo(bx + offset, beamTop + 6);
      ctx.bezierCurveTo(bx + offset + 18 + ripple, startY + 150, bx + offset - 22 - ripple, startY + 320, bx + offset + ripple, H + 20);
      ctx.stroke();
    }

    for (let i = 0; i < 30; i++) {
      const y = startY + ((frameCount * (6 + i % 4) + i * 37) % (H - startY + 76));
      const drift = Math.sin(frameCount * 0.055 + i * 1.37);
      const x = bx + drift * beamW * (0.16 + (i % 5) * 0.045);
      ctx.fillStyle = i % 4 === 0 ? 'rgba(255,248,237,0.78)' : i % 3 === 0 ? 'rgba(226,177,111,0.66)' : 'rgba(92,48,25,0.58)';
      ctx.beginPath();
      ctx.ellipse(x, y, 2.2 + (i % 4), 4.5 + (i % 5), drift * 0.55, 0, Math.PI * 2);
      ctx.fill();
    }

    const cap = ctx.createRadialGradient(bx, startY + 9, 4, bx, startY + 9, beamW * 0.72);
    cap.addColorStop(0, 'rgba(255,248,237,0.9)');
    cap.addColorStop(0.22, 'rgba(226,177,111,0.54)');
    cap.addColorStop(0.52, 'rgba(122,74,43,0.22)');
    cap.addColorStop(1, 'transparent');
    ctx.fillStyle = cap;
    ctx.beginPath();
    ctx.ellipse(bx, startY + 10, beamW * 0.54 + pulse * 11, 22 + pulse * 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,248,237,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(bx, startY + 10, beamW * 0.45 + pulse * 9, 17 + pulse * 5, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
}

function getBoss2ShockGapX(b) {
  const base = b.beamX || b.x;
  return Math.max(82, Math.min(W - 82, base));
}

function traceBoss2WavePath(y, waveIndex, width, gapX, gapHalf, upper) {
  const step = 24;
  const points = [];
  for (let x = 0; x <= W; x += step) {
    const waveY = y + Math.sin(x * 0.035 + frameCount * 0.18 + waveIndex) * (18 + waveIndex * 2);
    points.push({ x, y: waveY + (upper ? -width : width) });
  }
  const drawSegment = (from, to) => {
    ctx.beginPath();
    const pts = upper ? points.slice(from, to + 1) : points.slice(from, to + 1).reverse();
    pts.forEach((pt, idx) => idx === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y));
    const edgeA = upper ? points[to] : points[from];
    const edgeB = upper ? points[from] : points[to];
    ctx.lineTo(edgeA.x, edgeA.y + (upper ? width * 2 : -width * 2));
    for (let i = to; i >= from; i--) {
      const pt = points[i];
      ctx.lineTo(pt.x, pt.y + (upper ? width * 2 : -width * 2));
    }
    ctx.lineTo(edgeB.x, edgeB.y);
    ctx.closePath();
    ctx.fill();
  };
  let start = 0;
  for (let i = 0; i < points.length; i++) {
    if (Math.abs(points[i].x - gapX) < gapHalf) {
      if (i - 1 > start) drawSegment(start, i - 1);
      start = i + 1;
    }
  }
  if (start < points.length - 1) drawSegment(start, points.length - 1);
}

function drawGorillaShockwave(b) {
  const startY = b.y + b.h * 0.38;
  ctx.save();
  if (b.beamPhase === 'charging') {
    const progress = 1 - b.beamTimer / 90;
    const pulse = 0.5 + Math.sin(frameCount * 0.35) * 0.5;
    const gapX = getBoss2ShockGapX(b, 0, 0);
    ctx.fillStyle = `rgba(8,16,58,${0.18 + progress * 0.18})`;
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 4; i++) {
      const r = 34 + progress * (64 + i * 35) + pulse * 10;
      const grd = ctx.createRadialGradient(b.x, startY, r * 0.25, b.x, startY, r);
      grd.addColorStop(0, `rgba(255,248,237,${0.02})`);
      grd.addColorStop(0.58, `rgba(99,199,186,${0.06 + progress * 0.13})`);
      grd.addColorStop(0.82, `rgba(155,134,217,${0.22 + progress * 0.28})`);
      grd.addColorStop(1, 'transparent');
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(b.x, startY, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = `rgba(255,248,237,${0.18 + progress * 0.18})`;
    ctx.fillRect(gapX - 68, startY + 26, 136, H - startY - 44);
    ctx.strokeStyle = `rgba(255,248,237,${0.72 * progress})`;
    ctx.lineWidth = 3;
    ctx.setLineDash([12, 8]);
    ctx.beginPath();
    ctx.moveTo(gapX - 68, startY + 32);
    ctx.lineTo(gapX - 68, H - 40);
    ctx.moveTo(gapX + 68, startY + 32);
    ctx.lineTo(gapX + 68, H - 40);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = `rgba(99,199,186,${0.78 * progress})`;
    ctx.font = 'bold 14px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('SAFE GAP', gapX, startY + 56);
    ctx.restore();
    return;
  }

  const elapsed = 150 - b.beamTimer;
  const baseAlpha = Math.max(0.24, b.beamTimer / 150);
  ctx.fillStyle = `rgba(8,16,58,${0.1 * baseAlpha})`;
  ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 4; i++) {
    const y = startY + elapsed * 4.4 - i * 150;
    if (y < startY - 70 || y > H + 80) continue;
    const width = 30 + i * 3 + Math.sin(frameCount * 0.2 + i) * 3;
    const gapX = getBoss2ShockGapX(b, i, elapsed);
    const gapHalf = 72;
    const grd = ctx.createLinearGradient(0, y - width, 0, y + width);
    grd.addColorStop(0, 'transparent');
    grd.addColorStop(0.24, `rgba(99,199,186,${0.18 * baseAlpha})`);
    grd.addColorStop(0.46, `rgba(255,248,237,${0.82 * baseAlpha})`);
    grd.addColorStop(0.54, `rgba(155,134,217,${0.86 * baseAlpha})`);
    grd.addColorStop(0.78, `rgba(239,91,143,${0.28 * baseAlpha})`);
    grd.addColorStop(1, 'transparent');
    ctx.fillStyle = grd;
    traceBoss2WavePath(y, i, width, gapX, gapHalf, true);
    ctx.strokeStyle = `rgba(255,248,237,${0.72 * baseAlpha})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    let drawing = false;
    for (let x = 0; x <= W; x += 24) {
      const waveY = y + Math.sin(x * 0.035 + frameCount * 0.18 + i) * (18 + i * 2);
      if (Math.abs(x - gapX) < gapHalf) { drawing = false; continue; }
      if (!drawing) { ctx.moveTo(x, waveY); drawing = true; }
      else ctx.lineTo(x, waveY);
    }
    ctx.stroke();
    ctx.fillStyle = `rgba(255,248,237,${0.28 * baseAlpha})`;
    ctx.fillRect(gapX - gapHalf, y - width - 5, gapHalf * 2, width * 2 + 10);
  }
  ctx.restore();
}

function drawBoss3Special(b) {
  ctx.save();
  const chargingElapsed = frameCount - (b.chargingStartFrame || frameCount);
  const chargeTotal = b.beamKind === 'darkBurning' ? 150 : 110;
  const chargeProgress = b.beamPhase === 'charging' ? 1 - b.beamTimer / chargeTotal : 1;
  const fireDuration = b.phase === 1 ? 150 : 170;
  const fireElapsed = b.beamPhase === 'firing' ? fireDuration - b.beamTimer : 0;
  const fireProgress = fireElapsed / fireDuration;
  const pulse = 0.5 + Math.sin(frameCount * 0.22) * 0.5;

  // 暗幕：発射中は濃く
  ctx.fillStyle = `rgba(6,3,18,${b.beamPhase === 'charging' ? 0.22 + chargeProgress * 0.3 : 0.58})`;
  ctx.fillRect(0, 0, W, H);

  if (b.beamKind === 'darkBurning') {
    const zones = b.darkBurnSafeZones || [];
    const darkBurnFireElapsed = b.beamPhase === 'firing' ? 250 - b.beamTimer : 0;
    const darkBurnActive = b.beamPhase === 'firing' && darkBurnFireElapsed >= 60;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const preHeat = b.beamPhase === 'charging' || !darkBurnActive;
    const flameAlpha = preHeat ? 0.14 + chargeProgress * 0.22 + Math.min(0.18, darkBurnFireElapsed / 60 * 0.18) : 0.78 + pulse * 0.18;
    const flameCount = preHeat ? 46 : 76;
    for (let i = 0; i < flameCount; i++) {
      const x = (i * 43 + frameCount * (preHeat ? 1.05 : 3.1) + (i % 4) * 19) % (W + 90) - 45;
      const y = H - ((i * 71 + frameCount * (preHeat ? 2.1 : 5.2) + (i % 5) * 33) % (H + 150)) + 75;
      const h = (preHeat ? 58 : 98) + (i % 5) * (preHeat ? 18 : 30) + Math.sin(frameCount * 0.08 + i) * (preHeat ? 14 : 28);
      const w = (preHeat ? 12 : 20) + (i % 4) * (preHeat ? 6 : 10);
      const grd = ctx.createLinearGradient(x, y + h * 0.55, x, y - h);
      grd.addColorStop(0, 'transparent');
      grd.addColorStop(0.24, `rgba(40,27,77,${flameAlpha})`);
      grd.addColorStop(0.56, `rgba(239,91,143,${flameAlpha * (preHeat ? 0.48 : 0.75)})`);
      grd.addColorStop(0.82, `rgba(255,212,90,${darkBurnActive ? flameAlpha * 0.22 : 0})`);
      grd.addColorStop(1, 'transparent');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.moveTo(x, y + h * 0.5);
      ctx.bezierCurveTo(x - w * 2, y, x - w, y - h * 0.52, x, y - h);
      ctx.bezierCurveTo(x + w, y - h * 0.45, x + w * 2.4, y, x, y + h * 0.5);
      ctx.fill();
    }
    zones.forEach(z => {
      const zx = z.x;
      const zy = z.y;
      const r = z.r + (preHeat ? 10 : 3);
      const grd = ctx.createRadialGradient(zx, zy, 5, zx, zy, r);
      grd.addColorStop(0, preHeat ? 'rgba(255,248,237,0.9)' : 'rgba(255,248,237,0.72)');
      grd.addColorStop(0.36, preHeat ? 'rgba(255,212,90,0.34)' : 'rgba(255,212,90,0.24)');
      grd.addColorStop(0.72, 'rgba(99,199,186,0.14)');
      grd.addColorStop(1, 'transparent');
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(zx, zy, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = `rgba(255,248,237,${preHeat ? 0.9 : 0.68})`;
      ctx.lineWidth = preHeat ? 4 : 2.5;
      ctx.beginPath(); ctx.arc(zx, zy, r * 0.82, 0, Math.PI * 2); ctx.stroke();
    });
    ctx.restore();
    ctx.fillStyle = C.white;
    ctx.font = 'bold 18px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(darkBurnActive ? 'DARK BURNING' : 'DARK BURNING  SAFE LIGHTS', W / 2, 92);
    ctx.restore();
    return;
  }

  if (b.phase === 1) {
    // ===== SOUL RING RELEASE =====
    const safeAngle = b.beamSafeAngle || 0, safeHalf = 0.58;
    const img = imgs['b3p1special'];

    if (b.beamPhase === 'charging') {
      const orbitR = 60 + chargeProgress * 60;
      // 軌道リング（glowあり）
      ctx.save();
      ctx.strokeStyle = `rgba(160,90,255,${0.5 + chargeProgress * 0.45})`;
      ctx.lineWidth = 4 + chargeProgress * 10;
      ctx.shadowColor = '#A050FF';
      ctx.shadowBlur = 22 + chargeProgress * 22;
      ctx.beginPath(); ctx.arc(b.x, b.y + 20, orbitR + 16, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
      // 公転スプライト
      if (img) {
        (b.ringSprites || []).forEach(sprite => {
          const a = sprite.baseAngle + chargingElapsed * 0.055;
          const sx = b.x + Math.cos(a) * orbitR;
          const sy = (b.y + 20) + Math.sin(a) * orbitR;
          const size = 44 + chargeProgress * 30;
          // glow
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = 0.55 + chargeProgress * 0.3;
          ctx.fillStyle = '#7030C8';
          ctx.beginPath(); ctx.arc(sx, sy, size * 0.62, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
          // sprite本体
          ctx.save();
          ctx.globalAlpha = 0.88 + chargeProgress * 0.12;
          ctx.shadowColor = '#D090FF';
          ctx.shadowBlur = 14 + chargeProgress * 18;
          ctx.translate(sx, sy);
          ctx.rotate(a + Math.PI / 2 + frameCount * 0.04);
          ctx.drawImage(img, -size / 2, -size / 2, size, size);
          ctx.restore();
        });
      }
      // パーティクル渦
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 16; i++) {
        const a = i / 16 * Math.PI * 2 + frameCount * 0.03;
        const r = 48 + chargeProgress * 170 + (i % 3) * 18;
        ctx.fillStyle = i % 2 ? `rgba(190,110,255,${0.55 * chargeProgress})` : `rgba(255,80,160,${0.45 * chargeProgress})`;
        ctx.beginPath();
        ctx.ellipse(b.x + Math.cos(a) * r, b.y + 20 + Math.sin(a) * r, 3 + pulse * 3, 10 + pulse * 5, a, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

    } else {
      // 発射：リング + スプライト拡散
      const safeStart = ((safeAngle - safeHalf) + Math.PI * 2) % (Math.PI * 2);
      const safeEnd   = ((safeAngle + safeHalf) + Math.PI * 2) % (Math.PI * 2);
      // 危険リング（鮮やかな紫）
      ctx.save();
      for (let i = 0; i < 3; i++) {
        const r = fireProgress * 460 - i * 90;
        if (r < 20 || r > 520) continue;
        const a = (0.9 - i * 0.22) * (1 - fireProgress * 0.28);
        ctx.strokeStyle = `rgba(150,60,255,${a})`;
        ctx.lineWidth = 20 - i * 4;
        ctx.shadowColor = '#9B3FFF';
        ctx.shadowBlur = 24 - i * 4;
        ctx.beginPath();
        if (safeStart < safeEnd) ctx.arc(b.x, b.y + 20, r, safeEnd, safeStart + Math.PI * 2);
        else ctx.arc(b.x, b.y + 20, r, safeEnd, safeStart);
        ctx.stroke();
        // 内縁ハイライト
        ctx.strokeStyle = `rgba(230,180,255,${a * 0.65})`;
        ctx.lineWidth = 4;
        ctx.shadowBlur = 8;
        ctx.stroke();
      }
      ctx.restore();
      // 飛翔スプライト
      if (img) {
        (b.ringSprites || []).forEach(sprite => {
          if (sprite.launchAngle == null) return;
          const r = 80 + fireProgress * 360;
          const sx = b.x + Math.cos(sprite.launchAngle) * r;
          const sy = (b.y + 20) + Math.sin(sprite.launchAngle) * r;
          if (sx < -120 || sx > W + 120 || sy < -120 || sy > H + 120) return;
          const size = 78 - fireProgress * 18;
          const alpha = Math.max(0.65, 1 - fireProgress * 0.45);
          // トレイル glow
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          for (let k = 1; k <= 5; k++) {
            const tr = r - k * 30;
            if (tr < 0) continue;
            const tx = b.x + Math.cos(sprite.launchAngle) * tr;
            const ty = (b.y + 20) + Math.sin(sprite.launchAngle) * tr;
            ctx.globalAlpha = 0.4 / k;
            const r1 = (6 - k) * 6, r2 = (4 - k) * 4;
            if (r1 > 0) { ctx.fillStyle = '#8830FF'; ctx.beginPath(); ctx.arc(tx, ty, r1, 0, Math.PI * 2); ctx.fill(); }
            if (r2 > 0) { ctx.fillStyle = '#FF50C8'; ctx.beginPath(); ctx.arc(tx, ty, r2, 0, Math.PI * 2); ctx.fill(); }
          }
          ctx.restore();
          // sprite本体
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.shadowColor = '#C870FF';
          ctx.shadowBlur = 26;
          ctx.translate(sx, sy);
          ctx.rotate(sprite.launchAngle + Math.PI / 2 + fireElapsed * 0.07);
          ctx.drawImage(img, -size / 2, -size / 2, size, size);
          ctx.restore();
        });
      }
      // パーティクル（危険ゾーンのみ）
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 20; i++) {
        const a = i / 20 * Math.PI * 2 + frameCount * 0.024;
        const angDiff = Math.abs(Math.atan2(Math.sin(a - safeAngle), Math.cos(a - safeAngle)));
        if (angDiff < safeHalf + 0.06) continue;
        const r = 52 + fireProgress * 230 + (i % 3) * 22;
        ctx.fillStyle = i % 2 ? 'rgba(190,100,255,0.62)' : 'rgba(255,80,155,0.50)';
        ctx.beginPath();
        ctx.ellipse(b.x + Math.cos(a) * r, b.y + 20 + Math.sin(a) * r, 3 + pulse * 3, 11 + pulse * 5, a, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

  } else {
    // ===== BLADE STORM =====
    const img = imgs['b3p2special'];

    if (b.beamPhase === 'charging') {
      const orbitR = 44 + chargeProgress * 62;
      const orbitSpeed = 0.04 + chargeProgress * 0.1;
      // 暗黒エネルギーリング
      ctx.save();
      ctx.strokeStyle = `rgba(230,40,90,${0.55 + chargeProgress * 0.4})`;
      ctx.lineWidth = 6 + chargeProgress * 14;
      ctx.shadowColor = '#EF2060';
      ctx.shadowBlur = 26 + chargeProgress * 22;
      ctx.beginPath(); ctx.arc(b.x, b.y + 20, orbitR + 20, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
      // 公転スプライト
      if (img) {
        (b.swordBlades || []).forEach(blade => {
          const a = blade.orbitOffset + chargingElapsed * orbitSpeed;
          const sx = b.x + Math.cos(a) * orbitR;
          const sy = (b.y + 20) + Math.sin(a) * orbitR;
          const size = 60 + chargeProgress * 38;
          // glow
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = 0.65 + chargeProgress * 0.28;
          ctx.fillStyle = '#C01848';
          ctx.beginPath(); ctx.arc(sx, sy, size * 0.58, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
          // sprite本体
          ctx.save();
          ctx.globalAlpha = 0.92;
          ctx.shadowColor = '#FF2868';
          ctx.shadowBlur = 18 + chargeProgress * 20;
          ctx.translate(sx, sy);
          ctx.rotate(a + Math.PI / 2 + frameCount * (0.08 + chargeProgress * 0.1));
          ctx.drawImage(img, -size / 2, -size / 2, size, size);
          ctx.restore();
        });
      }
      // 風パーティクル
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 14; i++) {
        const a = i / 14 * Math.PI * 2 - frameCount * 0.04;
        const r = 30 + chargeProgress * 130 + (i % 3) * 14;
        ctx.fillStyle = i % 2 ? `rgba(255,50,100,${0.52 * chargeProgress})` : `rgba(190,70,255,${0.42 * chargeProgress})`;
        ctx.beginPath();
        ctx.ellipse(b.x + Math.cos(a) * r, b.y + 20 + Math.sin(a) * r, 4 + pulse * 3, 15 + pulse * 8, a, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

    } else {
      // 発射：ブレードが飛翔
      if (img) {
        (b.swordBlades || []).forEach(blade => {
          if (!blade.launched) return;
          const bx = blade.startX + blade.vx * fireElapsed;
          const by = blade.startY + blade.vy * fireElapsed;
          if (bx < -140 || bx > W + 140 || by < -140 || by > H + 140) return;
          const alpha = Math.min(1, fireElapsed / 14) * Math.max(0.55, 1 - Math.max(0, fireElapsed - 128) / 42);
          // 暗黒トレイル
          ctx.save();
          for (let k = 1; k <= 6; k++) {
            const tx = bx - blade.vx * k * 7;
            const ty = by - blade.vy * k * 7;
            ctx.globalAlpha = 0.55 / k * alpha;
            ctx.fillStyle = '#280415';
            ctx.beginPath(); ctx.arc(tx, ty, 30 - k * 3, 0, Math.PI * 2); ctx.fill();
          }
          ctx.restore();
          // 発光トレイル
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          for (let k = 1; k <= 5; k++) {
            const tx = bx - blade.vx * k * 7;
            const ty = by - blade.vy * k * 7;
            ctx.globalAlpha = 0.45 / k * alpha;
            ctx.fillStyle = '#FF2858';
            ctx.beginPath(); ctx.arc(tx, ty, 24 - k * 3, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#9030FF';
            ctx.beginPath(); ctx.arc(tx, ty, 14 - k * 2, 0, Math.PI * 2); ctx.fill();
          }
          ctx.restore();
          // sprite本体（強い輝き）
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.shadowColor = '#FF1848';
          ctx.shadowBlur = 32;
          ctx.translate(bx, by);
          ctx.rotate(Math.atan2(blade.vy, blade.vx) + Math.PI / 2 + fireElapsed * 0.06);
          ctx.drawImage(img, -54, -54, 108, 108);
          ctx.restore();
        });
      }
      // ボス周囲のオーラ
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 10; i++) {
        const a = i / 10 * Math.PI * 2 - frameCount * 0.06;
        const r = 26 + fireProgress * 58 + (i % 2) * 18;
        ctx.fillStyle = i % 2 ? `rgba(255,50,95,${0.48 * (1 - fireProgress * 0.55)})` : `rgba(190,60,255,${0.38 * (1 - fireProgress * 0.55)})`;
        ctx.beginPath();
        ctx.ellipse(b.x + Math.cos(a) * r, b.y + 20 + Math.sin(a) * r, 3 + pulse * 2, 12 + pulse * 4, a, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  ctx.restore();
}

function drawBoss3PhaseTransition(b) {
  if (!b || b.stage !== 3 || b.phaseTransitionTimer <= 0) return;
  const progress = 1 - b.phaseTransitionTimer / BOSS3_PHASE_TRANSITION;
  const pulse = Math.sin(progress * Math.PI);
  ctx.save();
  ctx.fillStyle = `rgba(8,10,32,${0.42 + pulse * 0.22})`;
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 22; i++) {
    const a = i / 22 * Math.PI * 2 - progress * 3.2;
    const r = 42 + progress * 260 + (i % 4) * 16;
    ctx.fillStyle = i % 2 ? `rgba(239,91,143,${0.22 + pulse * 0.18})` : `rgba(155,134,217,${0.22 + pulse * 0.22})`;
    ctx.beginPath();
    ctx.ellipse(b.x + Math.cos(a) * r, b.y + Math.sin(a) * r * 0.72, 5 + pulse * 6, 18 + pulse * 10, a, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.strokeStyle = `rgba(255,248,237,${0.35 + pulse * 0.35})`;
  ctx.lineWidth = 5 + pulse * 5;
  ctx.beginPath();
  ctx.arc(b.x, b.y, 52 + progress * 210, 0, Math.PI * 2);
  ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = C.white;
  ctx.font = 'bold 17px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('BLACK WIND FORM', W / 2, H - 122);
  ctx.restore();
}

function getBossName(stage) {
  if (stage === 3) return 'DARK YUPPY';
  if (stage === 2) return 'KING GORILLA';
  return 'GONSU';
}

// ===== DRAW: 弾 =====
function drawBossIntro() {
  if (!bossIntroTimer || !boss) return;
  const introDuration = boss.stage === 3 ? BOSS3_INTRO_DURATION : BOSS_INTRO_DURATION;
  const progress = 1 - bossIntroTimer / introDuration;
  const warningPhase = progress < (boss.stage === 3 ? 0.48 : 0.38);
  const dropProgress = Math.max(0, (progress - 0.38) / 0.62);
  const flash = Math.max(0, Math.sin(progress * Math.PI * 4)) * (1 - progress * 0.55);
  const isBoss2 = boss.stage === 2;
  const isBoss3 = boss.stage === 3;
  const mainColor = isBoss3 ? '#281B4D' : isBoss2 ? '#63C7BA' : C.pink;
  const accentColor = isBoss3 ? '#EF5B8F' : isBoss2 ? '#9B86D9' : C.yellow;
  const bossName = getBossName(boss.stage);
  ctx.save();
  ctx.fillStyle = `rgba(8,16,58,${isBoss3 ? 0.82 - dropProgress * 0.24 : warningPhase ? 0.62 : 0.5 - dropProgress * 0.22})`;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = isBoss3 ? 'rgba(6,3,18,0.92)' : C.outline;
  ctx.fillRect(0, H / 2 - 94, W, 226);
  ctx.fillStyle = isBoss3 ? '#EF5B8F' : warningPhase && Math.floor(frameCount / 14) % 2 === 0 ? accentColor : mainColor;
  ctx.font = `900 ${isBoss3 ? 44 : 42}px Courier New`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = isBoss3 ? 'rgba(239,91,143,1)' : 'transparent';
  ctx.shadowBlur = isBoss3 ? 22 : 0;
  ctx.lineWidth = isBoss3 ? 8 : 0;
  if (isBoss3) {
    ctx.strokeStyle = '#FFF8ED';
    ctx.strokeText('WARNING!', W / 2, H / 2 - 14);
    ctx.strokeStyle = '#08103A';
    ctx.lineWidth = 4;
    ctx.strokeText('WARNING!', W / 2, H / 2 - 14);
  }
  ctx.fillText('WARNING!', W / 2, H / 2 - 14);
  ctx.shadowBlur = 0;

  const nameProgress = Math.min(1, Math.max(0, (progress - 0.18) / 0.42));
  const nameEase = 1 - Math.pow(1 - nameProgress, 3);
  const namePulse = 1 + Math.sin(progress * Math.PI * 5) * 0.018 * (1 - nameProgress * 0.35);
  const nameY = H / 2 + 74 - nameEase * 14;
  const nameSize = isBoss2 ? 48 : isBoss3 ? 56 : 66;
  ctx.save();
  ctx.globalAlpha = Math.min(1, nameProgress * 1.35);
  ctx.translate(W / 2, nameY);
  ctx.scale((0.68 + nameEase * 0.32) * namePulse, (1.18 - nameEase * 0.18) * namePulse);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `900 ${nameSize}px Courier New`;
  ctx.shadowColor = isBoss3 ? 'rgba(239,91,143,1)' : isBoss2 ? 'rgba(99,199,186,0.95)' : 'rgba(255,200,61,0.95)';
  ctx.shadowBlur = isBoss3 ? 28 : 20;
  ctx.lineWidth = isBoss3 ? 10 : 8;
  ctx.strokeStyle = C.white;
  ctx.strokeText(bossName, 0, 0);
  ctx.lineWidth = isBoss3 ? 5 : 4;
  ctx.strokeStyle = C.outline;
  ctx.strokeText(bossName, 0, 0);
  ctx.fillStyle = isBoss3 ? '#EF5B8F' : isBoss2 ? '#63C7BA' : '#FFC83D';
  ctx.fillText(bossName, 0, 0);
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = Math.min(1, nameProgress * 1.6);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '900 18px Courier New';
  ctx.letterSpacing = '0px';
  ctx.shadowColor = 'rgba(255,248,237,0.8)';
  ctx.shadowBlur = 12;
  ctx.fillStyle = C.white;
  ctx.strokeStyle = C.outline;
  ctx.lineWidth = 4;
  ctx.strokeText('BOSS APPEAR!', W / 2, nameY - 48);
  ctx.fillText('BOSS APPEAR!', W / 2, nameY - 48);
  ctx.restore();

  const ringR = 55 + dropProgress * (isBoss3 ? 390 : 250);
  ctx.strokeStyle = isBoss3 ? `rgba(155,134,217,${0.72 - dropProgress * 0.36})` : isBoss2 ? `rgba(99,199,186,${0.78 - dropProgress * 0.45})` : `rgba(239,91,143,${0.75 - dropProgress * 0.45})`;
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.arc(W / 2, boss.targetY + 28, ringR, 0, Math.PI * 2);
  ctx.stroke();

  if (isBoss3) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 24; i++) {
      const a = i / 24 * Math.PI * 2 - progress * 4.2;
      const r = 52 + dropProgress * 300 + (i % 5) * 18;
      const x = W / 2 + Math.cos(a) * r;
      const y = boss.targetY + 34 + Math.sin(a) * r * 0.56;
      const len = 12 + (i % 4) * 7 + flash * 10;
      const wid = 3 + (i % 3) * 1.2;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(a + Math.PI / 2);
      ctx.shadowColor = i % 3 === 0 ? '#EF5B8F' : '#9B86D9';
      ctx.shadowBlur = 12 + flash * 22;
      ctx.fillStyle = i % 4 === 0 ? 'rgba(255,212,90,0.72)' : i % 2 ? 'rgba(239,91,143,0.82)' : 'rgba(48,24,96,0.9)';
      ctx.beginPath();
      ctx.moveTo(0, -len);
      ctx.lineTo(wid, 0);
      ctx.lineTo(0, len * 0.55);
      ctx.lineTo(-wid, 0);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    for (let i = 0; i < 10; i++) {
      const a = i / 10 * Math.PI * 2 + progress * 2.8;
      const r = 80 + dropProgress * 250;
      ctx.strokeStyle = i % 2 ? 'rgba(239,91,143,0.55)' : 'rgba(155,134,217,0.5)';
      ctx.lineWidth = 2 + flash * 4;
      ctx.beginPath();
      ctx.moveTo(W / 2 + Math.cos(a) * r, boss.targetY + 34 + Math.sin(a) * r * 0.55);
      ctx.lineTo(W / 2 + Math.cos(a + 0.13) * (r + 48), boss.targetY + 34 + Math.sin(a + 0.13) * (r + 48) * 0.55);
      ctx.stroke();
    }
    ctx.restore();
  } else {
    for (let i = 0; i < 16; i++) {
      const a = i / 16 * Math.PI * 2 + progress * 2.5;
      const r = 38 + dropProgress * 190 + (i % 3) * 12;
      ctx.fillStyle = isBoss2 ? (i % 2 ? '#9B86D9' : '#63C7BA') : (i % 2 ? '#7A4A2B' : C.peach);
      ctx.beginPath();
      ctx.ellipse(W / 2 + Math.cos(a) * r, boss.targetY + 34 + Math.sin(a) * r * 0.58, 5 + flash * 8, 9 + flash * 10, a, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  if (flash > 0.05) {
    ctx.fillStyle = `rgba(255,248,237,${flash * 0.45})`;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
}

function drawBullet(b) {
  ctx.save(); ctx.translate(b.x, b.y);
  if (b.type === 'charge') {
    const pulse = 0.5 + Math.sin(frameCount * 0.35) * 0.5;
    const stage = b.chargeStage || 1;
    ctx.rotate((b.vx || 0) * 0.05 + Math.sin(frameCount * 0.12) * 0.035);
    ctx.globalCompositeOperation = 'lighter';
    ctx.shadowColor = b.burst ? 'rgba(255,212,90,1)' : 'rgba(239,91,143,0.95)';
    ctx.shadowBlur = 18 + stage * 7;
    const outer = ctx.createLinearGradient(0, 34 + stage * 8, 0, -48 - stage * 13);
    outer.addColorStop(0, 'transparent');
    outer.addColorStop(0.18, b.burst ? 'rgba(255,212,90,0.42)' : 'rgba(239,91,143,0.34)');
    outer.addColorStop(0.55, b.burst ? 'rgba(255,248,237,0.76)' : 'rgba(255,200,61,0.74)');
    outer.addColorStop(1, 'transparent');
    ctx.fillStyle = outer;
    ctx.beginPath();
    ctx.roundRect(-8 - stage * 2, -50 - stage * 12, 16 + stage * 4, 92 + stage * 18, 999);
    ctx.fill();
    ctx.strokeStyle = b.burst ? `rgba(255,248,237,${0.5 + pulse * 0.28})` : `rgba(99,199,186,${0.34 + pulse * 0.22})`;
    ctx.lineWidth = 2 + stage * 0.7;
    ctx.beginPath();
    ctx.moveTo(0, 34 + stage * 7);
    ctx.lineTo(0, -54 - stage * 11);
    ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = b.burst ? C.yellow : C.pink;
    ctx.strokeStyle = C.outline;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(-4 - stage * 0.8, -42 - stage * 9, 8 + stage * 1.6, 68 + stage * 12, 999);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,248,237,0.95)';
    ctx.beginPath();
    ctx.roundRect(-2.2, -38 - stage * 8, 4.4, 48 + stage * 9, 999);
    ctx.fill();
    ctx.restore();
    return;
  }
  if (b.type === 'featherCharge') {
    const isGold = b.isGold;
    const stage = b.chargeStage || 1;
    const pulse = 0.5 + Math.sin(frameCount * 0.22 + b.x) * 0.5;
    const sc = 1 + stage * 0.55;
    ctx.rotate((b.vx || 0) * 0.06 + Math.sin(frameCount * 0.15 + b.x) * 0.1);
    ctx.scale(sc, sc);
    ctx.globalCompositeOperation = 'lighter';
    ctx.shadowColor = isGold ? 'rgba(255,212,90,1)' : 'rgba(255,248,237,0.95)';
    ctx.shadowBlur = 30 + stage * 10;
    ctx.fillStyle = isGold ? `rgba(255,212,90,${0.24 + pulse * 0.18})` : `rgba(255,248,237,${0.2 + pulse * 0.16})`;
    ctx.beginPath();
    ctx.ellipse(0, -5, 18 + stage * 2, 38 + stage * 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = isGold ? C.gold : '#FFFDF6';
    ctx.strokeStyle = C.outline;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -36);
    ctx.bezierCurveTo(16, -22, 13, 6, 0, 30);
    ctx.bezierCurveTo(-13, 6, -14, -20, 0, -36);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = isGold ? C.white : C.mint;
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(0, -28);
    ctx.lineTo(0, 26);
    ctx.stroke();
    ctx.strokeStyle = isGold ? 'rgba(255,248,237,0.8)' : 'rgba(99,199,186,0.75)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, -18); ctx.lineTo(11, -24);
    ctx.moveTo(0, -8);  ctx.lineTo(-12, -14);
    ctx.moveTo(0, 2);   ctx.lineTo(11, -5);
    ctx.moveTo(0, 12);  ctx.lineTo(-11, 4);
    ctx.moveTo(0, 21);  ctx.lineTo(9, 14);
    ctx.stroke();
    ctx.fillStyle = isGold ? 'rgba(255,248,237,0.98)' : 'rgba(255,248,237,0.95)';
    ctx.beginPath();
    ctx.arc(0, -31, 3.5, 0, Math.PI * 2);
    ctx.fill();
    if (isGold) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = `rgba(255,248,237,${0.5 + pulse * 0.4})`;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(-15, 14);
      ctx.lineTo(0, -40);
      ctx.lineTo(15, 14);
      ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.restore();
    return;
  }
  if (b.type === 'feather' || b.type === 'goldFeather') {
    const isGold = b.type === 'goldFeather';
    const pulse = 0.5 + Math.sin(frameCount * 0.22 + b.x) * 0.5;
    ctx.rotate((b.vx || 0) * 0.08 + Math.sin(frameCount * 0.18 + b.x) * 0.08);
    ctx.globalCompositeOperation = 'lighter';
    ctx.shadowColor = isGold ? 'rgba(255,212,90,0.92)' : 'rgba(255,248,237,0.82)';
    ctx.shadowBlur = isGold ? 18 : 10 + Math.min(6, (b.featherLv || 1) * 2);
    ctx.fillStyle = isGold ? `rgba(255,212,90,${0.24 + pulse * 0.14})` : `rgba(255,248,237,${0.2 + pulse * 0.12})`;
    ctx.beginPath();
    ctx.moveTo(0, 18);
    ctx.lineTo(9, -4);
    ctx.lineTo(0, -28);
    ctx.lineTo(-9, -4);
    ctx.closePath();
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = isGold ? C.gold : '#FFFDF6'; ctx.strokeStyle = C.outline; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(0, -24);
    ctx.bezierCurveTo(11, -15, 9, 4, 0, 22);
    ctx.bezierCurveTo(-9, 5, -10, -14, 0, -24);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = isGold ? C.white : C.mint; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(0, 16); ctx.stroke();
    ctx.strokeStyle = isGold ? 'rgba(255,248,237,0.78)' : 'rgba(99,199,186,0.72)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(0, -6); ctx.lineTo(7, -13);
    ctx.moveTo(0, 2); ctx.lineTo(-7, -6);
    ctx.moveTo(0, 9); ctx.lineTo(6, 2);
    ctx.stroke();
    ctx.fillStyle = isGold ? 'rgba(255,248,237,0.95)' : 'rgba(255,248,237,0.9)';
    ctx.beginPath(); ctx.arc(-2.5, -14, 2.6, 0, Math.PI*2); ctx.fill();
    if (isGold) {
      ctx.strokeStyle = 'rgba(255,248,237,0.7)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(-11, 10);
      ctx.lineTo(0, -28);
      ctx.lineTo(11, 10);
      ctx.stroke();
    }
    ctx.restore();
    return;
  }
  ctx.rotate((b.vx || 0) * 0.08 + Math.sin(frameCount * 0.2 + b.x) * 0.035);
  ctx.globalCompositeOperation = 'lighter';
  ctx.shadowColor = 'rgba(255,200,61,0.72)';
  ctx.shadowBlur = 8;
  const beam = ctx.createLinearGradient(0, 18, 0, -24);
  beam.addColorStop(0, 'transparent');
  beam.addColorStop(0.28, 'rgba(239,91,143,0.62)');
  beam.addColorStop(0.62, 'rgba(255,200,61,0.86)');
  beam.addColorStop(1, 'transparent');
  ctx.fillStyle = beam;
  ctx.beginPath();
  ctx.roundRect(-4.5, -25, 9, 46, 999);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = C.yellow; ctx.strokeStyle = C.outline; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.roundRect(-2.8, -20, 5.6, 31, 999); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,248,237,0.9)';
  ctx.beginPath(); ctx.roundRect(-1.2, -17, 2.4, 20, 999); ctx.fill();
  ctx.restore();
}

function drawEnemyBullet(b) {
  ctx.save(); ctx.translate(b.x, b.y);
  if (b.popped > 0) {
    ctx.shadowColor = 'rgba(255,200,61,0.72)';
    ctx.shadowBlur = 14;
    b.popped--;
  }
  if (b.reflected) {
    ctx.shadowColor = b.popRush ? 'rgba(255,212,90,1)' : 'rgba(255,200,61,0.95)';
    ctx.shadowBlur = b.popRush ? 26 : 18;
    ctx.rotate(frameCount * 0.12);
  }
  if (b.type === 'rush') {
    const r = b.r || 11;
    ctx.fillStyle = C.yellow;
    ctx.strokeStyle = C.outline;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = C.white;
    ctx.beginPath(); ctx.arc(-r * 0.25, -r * 0.3, r * 0.28, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    return;
  }
  if (b.type === 'coffee') {
    ctx.rotate(Math.atan2(b.vy, b.vx) + Math.PI / 2);
    ctx.fillStyle = '#7A4A2B';
    ctx.strokeStyle = C.outline;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(0, 0, 5.5, 9, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,248,237,0.55)';
    ctx.beginPath(); ctx.arc(-1.5, -3, 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#B97947';
    ctx.beginPath(); ctx.arc(8, 8, 2.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(-8, 6, 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    return;
  }
  if (b.type === 'shock') {
    ctx.rotate(Math.atan2(b.vy, b.vx));
    ctx.shadowColor = 'rgba(155,134,217,0.65)';
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#63C7BA';
    ctx.strokeStyle = C.outline;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(10, 0);
    ctx.lineTo(1, 7);
    ctx.lineTo(-9, 4);
    ctx.lineTo(-2, 0);
    ctx.lineTo(-9, -4);
    ctx.lineTo(1, -7);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,248,237,0.82)';
    ctx.beginPath(); ctx.arc(1, -2, 2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    return;
  }
  if (b.type === 'dark') {
    ctx.rotate(Math.atan2(b.vy, b.vx) + Math.PI / 2);
    ctx.shadowColor = 'rgba(155,134,217,0.75)';
    ctx.shadowBlur = 14;
    ctx.fillStyle = b.reflected ? C.yellow : '#1B123A';
    ctx.strokeStyle = b.reflected ? C.gold : '#FFF8ED';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(0, -12);
    ctx.bezierCurveTo(11, -5, 9, 8, 0, 13);
    ctx.bezierCurveTo(-9, 8, -11, -5, 0, -12);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = b.reflected ? C.white : C.pink;
    ctx.lineWidth = 1.7;
    ctx.beginPath(); ctx.moveTo(0, -8); ctx.lineTo(0, 9); ctx.stroke();
    ctx.restore();
    return;
  }
  const r = b.r || 7;
  ctx.fillStyle = C.pink; ctx.strokeStyle = C.outline; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,248,237,0.75)';
  ctx.beginPath(); ctx.arc(-r * 0.28, -r * 0.28, Math.max(2.5, r * 0.36), 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

// ===== DRAW: パワーアップ =====
function drawPowerup(p) {
  const pulse = Math.sin(frameCount*0.12)*3;
  ctx.save(); ctx.translate(p.x, p.y);
  if (p.type === 'feather') {
    ctx.globalCompositeOperation = 'lighter';
    ctx.shadowColor = 'rgba(255,248,237,1)';
    ctx.shadowBlur = 24;
    ctx.globalAlpha = 0.36;
    ctx.fillStyle = C.white;
    ctx.beginPath(); ctx.arc(0, 0, p.r + 16 + pulse * 1.4, 0, Math.PI*2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.globalAlpha = p.type === 'feather' ? 0.85 : 0.55; ctx.strokeStyle = p.color; ctx.lineWidth = p.type === 'feather' ? 3.5 : 2.5;
  ctx.beginPath(); ctx.arc(0, 0, p.r+5+pulse, 0, Math.PI*2); ctx.stroke();
  if (p.type === 'feather') {
    ctx.strokeStyle = C.yellow; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, p.r+11-pulse*0.4, 0, Math.PI*2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = p.color; ctx.strokeStyle = C.outline; ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (let i = 0; i < 4; i++) {
    const a1 = (i / 4) * Math.PI * 2;
    const a2 = a1 + Math.PI / 4;
    ctx.lineTo(Math.cos(a1) * (p.r + 3), Math.sin(a1) * (p.r + 3));
    ctx.lineTo(Math.cos(a2) * p.r * 0.45, Math.sin(a2) * p.r * 0.45);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.outline;
  ctx.font = 'bold 11px Courier New'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText({ spread:'S', rapid:'R', shield:'♡', bomb:'P', feather:'F' }[p.type], 0, 0);
  ctx.restore();
}

// ===== UPDATE =====
function update() {
  frameCount++;
  shootTimer = Math.max(0, shootTimer-1);
  enemySoundCooldown = Math.max(0, enemySoundCooldown-1);
  if (player.popTimer > 0) player.popTimer--;
  if (player.popRushTimer > 0) {
    player.popRushTimer--;
    player.popRushShotTimer = Math.max(0, (player.popRushShotTimer || 0) - 1);
    if (player.popRushShotTimer === 0) {
      emitPopRushWave(player.popRushTimer > 150);
      player.popRushShotTimer = 38;
    }
  }
  if (screenShake > 0.3) screenShake *= 0.8; else screenShake = 0;
  if (damageFlash > 0) damageFlash--;
  if (comboTimer > 0) {
    comboTimer--;
    if (comboTimer === 0) {
      combo = 0;
      updateHUD();
    }
  }

  if (powerTimer > 0) {
    powerTimer--;
    if (powerTimer === 0) { currentPower = 'normal'; updateHUD(); }
    else if (powerTimer % 60 === 0) updateHUD();
  }

  const newLevel = Math.floor(score/500)+1;
  if (newLevel !== level) {
    level = newLevel;
    enemySpawnInterval = Math.max(42, 108-(level-1)*6);
    enemySpeed = Math.min(1.92, 0.78+(level-1)*0.14);
    updateHUD(); playSound('levelup');
  }
  if (!bossActive && !clearPending) {
    const relScore = score - (ngBaseScore || 0);
    const relLevel = Math.floor(relScore / 500) + 1;
    if (relLevel >= 11 && !bossStageSpawned?.[3]) spawnBoss(3);
    else if (relLevel >= 7 && !bossStageSpawned?.[2]) spawnBoss(2);
    else if (relLevel >= 3 && !bossStageSpawned?.[1]) spawnBoss(1);
  }

  if (keys['ArrowLeft'])  player.x = Math.max(player.w/2,     player.x-player.speed);
  if (keys['ArrowRight']) player.x = Math.min(W-player.w/2,   player.x+player.speed);
  if (keys['ArrowUp'])    player.y = Math.max(H*0.28,         player.y-player.speed);
  if (keys['ArrowDown'])  player.y = Math.min(H-player.h/2,   player.y+player.speed);
  if (keys['Space']) {
    const chargeLv = runUpgrades?.chargePath || 0;
    const chargeGain = chargeLv > 0 ? 0.74 : 1;
    chargeFrames = Math.min(CHARGE_MAX, chargeFrames + chargeGain);
    chargeSoundTimer = Math.max(0, chargeSoundTimer - 1);
    if (chargeFrames >= 10 && chargeSoundTimer === 0) {
      playSound('chargeTick');
      chargeSoundTimer = chargeFrames >= CHARGE_MIN ? 10 : 16;
    }
  }

  const cd = currentPower === 'rapid' ? Math.ceil(shootCooldown/2.5) : shootCooldown;
  if (keys['Space'] && shootTimer === 0) {
    const shotSpeed = 10 + (runUpgrades?.shotSpeed || 0) * 1.2;
    if (currentPower === 'spread') {
      pushPlayerBullet(player.x, player.y-player.h/2, shotSpeed, 0);
      pushPlayerBullet(player.x, player.y-player.h/2, shotSpeed - 1, -3.2);
      pushPlayerBullet(player.x, player.y-player.h/2, shotSpeed - 1, 3.2);
    } else {
      pushPlayerBullet(player.x, player.y-player.h/2, shotSpeed, 0);
      for (let i = 0; i < Math.min(2, runUpgrades?.twin || 0); i++) {
        const gap = 12 + i * 8;
        pushPlayerBullet(player.x-gap, player.y-player.h/2+6, shotSpeed - 0.6, -0.45-i*0.18);
        pushPlayerBullet(player.x+gap, player.y-player.h/2+6, shotSpeed - 0.6, 0.45+i*0.18);
      }
    }
    shootTimer = cd;
    playSound((runUpgrades?.feather || 0) > 0 || (runUpgrades?.goldFeather || 0) > 0 ? 'featherShoot' : 'shoot');
  }

  const popRushInvincible = (runUpgrades?.popPath || 0) >= 2 && (player.popRushTimer || 0) > 0;

  bullets = bullets.filter(b => {
    b.y -= b.speed;
    b.x += b.vx;
    const margin = b.type === 'charge' ? 45 : 24;
    return b.y > -margin && b.x > -margin && b.x < W + margin;
  });

  if (frameCount % enemySpawnInterval === 0) spawnEnemy();
  if (player.invincible > 0) player.invincible--;

  // ===== BOSS =====
  if (bossActive && boss) {
    boss.fc++;
    if (boss.stateTimer > 0) { boss.stateTimer--; if (boss.stateTimer === 0) boss.bossState = 'normal'; }

    if (bossIntroTimer > 0) {
      bossIntroTimer--;
      const introDuration = boss.stage === 3 ? BOSS3_INTRO_DURATION : BOSS_INTRO_DURATION;
      const t = 1 - bossIntroTimer / introDuration;
      const dropStart = boss.stage === 3 ? 0.58 : 0.38;
      const dropT = Math.max(0, (t - dropStart) / (1 - dropStart));
      const ease = 1 - Math.pow(1 - dropT, boss.stage === 3 ? 4 : 3);
      boss.y = -170 + (boss.targetY + 170) * ease;
      if (boss.stage !== 3 && dropT > 0 && bossIntroTimer % 10 === 0) {
        spawnParticles(
          W / 2 + (Math.random() - 0.5) * 120,
          boss.targetY + 40,
          boss.stage === 2 ? '#63C7BA' : '#7A4A2B',
          3
        );
      }
      if (bossIntroTimer === 0) {
        boss.y = boss.targetY;
        screenShake = boss.stage === 3 ? 32 : 24;
        if (boss.stage !== 3) {
          spawnParticles(boss.x, boss.y + 45, boss.stage === 2 ? '#9B86D9' : '#7A4A2B', 38);
        }
        notify(boss.stage === 3 ? 'DARK YUPPY AWAKENS!' : boss.stage === 2 ? 'KING GORILLA IMPACT!' : 'GONSU SPLASH!', boss.stage === 3 ? C.lavender : boss.stage === 2 ? C.mint : C.yellow);
      }
      return;
    }

    if (boss.hp < boss.maxHp*0.5 && boss.phase === 1) {
      boss.phase = 2;
      boss.speed = boss.stage === 3 ? 1.55 : boss.stage === 2 ? 2.05 : 2.45;
      boss.shootInterval = boss.stage === 3 ? 82 : boss.stage === 2 ? 78 : 68;
      boss.aimedVolley = 0;
      if (boss.stage === 3) {
        boss.phaseTransitionTimer = BOSS3_PHASE_TRANSITION;
        boss.beamPhase = null;
        boss.beamCooldown = 170;
        enemyBullets = [];
        playBgm('boss3b');
      }
      notify(boss.stage === 3 ? 'BLACK WIND RISES!' : 'PHASE 2!', boss.stage === 3 ? C.pink : boss.stage === 2 ? C.mint : C.pink);
    }

    if (boss.phaseTransitionTimer > 0) {
      boss.phaseTransitionTimer--;
      boss.y += (boss.targetY - boss.y) * 0.04;
      if (boss.phaseTransitionTimer % 8 === 0) {
        spawnParticles(boss.x + (Math.random() - 0.5) * 150, boss.y + (Math.random() - 0.5) * 110, boss.phaseTransitionTimer % 16 === 0 ? C.pink : C.lavender, 5);
      }
      return;
    }

    if (boss.stage === 3 && boss.phase === 2 && !boss.darkBurningUsed && boss.hp <= boss.maxHp * 0.15 && boss.beamPhase === null) {
      boss.darkBurningUsed = true;
      boss.beamPhase = 'charging';
      boss.beamKind = 'darkBurning';
      boss.beamTimer = 150;
      boss.beamChargeSounded = false;
      boss.darkBurnSafeZones = [
        { x: W * 0.24, y: H * 0.68, r: 62, phase: 0 },
        { x: W * 0.52, y: H * 0.54, r: 58, phase: 1.7 },
        { x: W * 0.78, y: H * 0.72, r: 62, phase: 3.2 },
      ];
      enemyBullets = [];
      playSound('darkBurningCharge');
      boss.beamChargeSounded = true;
      notify('DARK BURNING!', C.pink);
    }

    if (boss.stage === 3 && boss.phase === 2 && boss.hp <= boss.maxHp * 0.25 && boss.beamPhase === null) {
      boss.beamCooldown = Math.min(boss.beamCooldown, 90);
    }

    if (boss.beamPhase === null) {
      boss.beamCooldown--;
      if (boss.beamCooldown <= 0) {
        boss.beamPhase = 'charging'; boss.beamKind = null; boss.beamTimer = boss.stage === 3 ? 110 : 90;
        boss.beamX = boss.x; boss.beamChargeSounded = false;
        if (boss.stage === 3) boss.chargingStartFrame = frameCount;
        if (boss.stage === 3 && boss.phase === 1) {
          boss.beamSafeAngle = Math.atan2(player.y - (boss.y + 20), player.x - boss.x) + (Math.random() < 0.5 ? -1 : 1) * 0.40;
          const safeCenter = boss.beamSafeAngle, safeHalf = 0.58;
          const unsafeRange = Math.PI * 2 - safeHalf * 2;
          boss.ringSprites = Array.from({ length: 8 }, (_, i) => ({
            baseAngle: (safeCenter + safeHalf + 0.08) + (i / 8) * (unsafeRange - 0.16),
            launchAngle: null,
          }));
        }
        if (boss.stage === 3 && boss.phase === 2) {
          const swordBladeCount = boss.hp <= boss.maxHp * 0.25 ? 6 : 3;
          boss.swordBlades = Array.from({ length: swordBladeCount }, (_, i) => ({
            orbitOffset: (i / swordBladeCount) * Math.PI * 2,
            launched: false, startX: 0, startY: 0, vx: 0, vy: 0,
          }));
        }
      }
    }
    if (boss.beamPhase === 'charging') {
      boss.beamTimer--;
      if (!boss.beamChargeSounded) {
        if (boss.beamKind === 'darkBurning') playSound('darkBurningCharge');
        else if (boss.stage === 3) playSound(boss.phase === 1 ? 'boss3Charge1' : 'boss3Charge2');
        else playSound('beamCharge');
        boss.beamChargeSounded = true;
      }
      if (boss.beamTimer <= 0) {
        boss.beamPhase = 'firing'; boss.beamTimer = boss.beamKind === 'darkBurning' ? 250 : boss.stage === 3 ? (boss.phase === 2 ? 170 : 150) : boss.stage === 2 ? 150 : 130;
        boss.beamX = boss.x;
        if (boss.beamKind === 'darkBurning') {
          playSound('darkBurningFire');
          screenShake = Math.max(screenShake, 18);
        } else if (boss.stage === 3 && boss.phase === 1 && boss.ringSprites) {
          const elapsed = frameCount - (boss.chargingStartFrame || frameCount);
          boss.ringSprites.forEach(s => { s.launchAngle = s.baseAngle + elapsed * 0.055; });
          playSound('boss3Fire1');
        } else if (boss.stage === 3 && boss.phase === 2 && boss.swordBlades) {
          const elapsed = frameCount - (boss.chargingStartFrame || frameCount);
          const finalBladeRush = boss.hp <= boss.maxHp * 0.25;
          const flyAngles = finalBladeRush
            ? [Math.PI * 0.30, Math.PI * 0.38, Math.PI * 0.46, Math.PI * 0.54, Math.PI * 0.62, Math.PI * 0.70]
            : [Math.PI * 7 / 20, Math.PI / 2, Math.PI * 13 / 20];
          const flySpeeds = finalBladeRush ? [3.05, 3.2, 3.35, 3.35, 3.2, 3.05] : [3.2, 3.4, 3.2];
          boss.swordBlades.forEach((blade, i) => {
            const orbitAngle = blade.orbitOffset + elapsed * 0.14;
            blade.startX = boss.x + Math.cos(orbitAngle) * 106;
            blade.startY = (boss.y + 20) + Math.sin(orbitAngle) * 106;
            blade.vx = Math.cos(flyAngles[i]) * flySpeeds[i];
            blade.vy = Math.sin(flyAngles[i]) * flySpeeds[i];
            blade.launched = true;
          });
          playSound('boss3Fire2');
        } else {
          playSound('beam');
        }
      }
    }
    if (boss.beamPhase === 'firing') {
      boss.beamTimer--;
      const hitByBoss2Wave = () => {
        const elapsed = 150 - boss.beamTimer;
        const startY = boss.y + boss.h * 0.38;
        for (let i = 0; i < 4; i++) {
          const y = startY + elapsed * 4.4 - i * 150;
          const waveY = y + Math.sin(player.x * 0.035 + frameCount * 0.18 + i) * (18 + i * 2);
          const gapX = getBoss2ShockGapX(boss, i, elapsed);
          const inSafeGap = Math.abs(player.x - gapX) < 72;
          if (!inSafeGap && Math.abs(player.y - waveY) < 22) return true;
        }
        return false;
      };
      const hitByBoss3Repulser = () => {
        const elapsed = 150 - boss.beamTimer;
        const dx = player.x - boss.x;
        const dy = player.y - (boss.y + 20);
        const dist = Math.sqrt(dx * dx + dy * dy);
        const angle = Math.atan2(dy, dx);
        const safeDiff = Math.abs(Math.atan2(Math.sin(angle - (boss.beamSafeAngle || 0)), Math.cos(angle - (boss.beamSafeAngle || 0))));
        if (safeDiff < 0.58) return false;
        for (let i = 0; i < 4; i++) {
          const r = elapsed / 150 * 460 - i * 82;
          if (Math.abs(dist - r) < 16) return true;
        }
        return false;
      };
      const hitByBoss3Sword = () => {
        if (boss.beamTimer > 155) return false;
        const elapsed = 170 - boss.beamTimer;
        return (boss.swordBlades || []).some(blade => {
          if (!blade.launched) return false;
          const bx = blade.startX + blade.vx * elapsed;
          const by = blade.startY + blade.vy * elapsed;
          const dx = player.x - bx, dy = player.y - by;
          return dx * dx + dy * dy < 52 * 52;
        });
      };
      const hitByDarkBurning = () => {
        if (boss.beamTimer > 190) return false;
        return !(boss.darkBurnSafeZones || []).some(z => {
          const zx = z.x;
          const zy = z.y;
          const dx = player.x - zx, dy = player.y - zy;
          return dx * dx + dy * dy < z.r * z.r;
        });
      };
      const specialHit = boss.stage === 3
        ? (boss.beamKind === 'darkBurning' ? hitByDarkBurning() : boss.phase === 2 ? hitByBoss3Sword() : hitByBoss3Repulser())
        : boss.stage === 2 ? hitByBoss2Wave() : Math.abs(player.x-boss.beamX) < 38 && player.y > boss.y+boss.h/2;
      if (player.invincible === 0 && !popRushInvincible && specialHit) {
        if (!DEBUG_INVINCIBLE) { lives--; missCount++; damageFlash = 22; } player.invincible = 140; screenShake = 14;
        spawnParticles(player.x, player.y, boss.stage === 2 ? C.lavender : C.blue, 25);
        playSound('hit'); updateHUD();
        if (lives <= 0) gameOverPending = true;
      }
      if (boss.beamTimer <= 0) {
        boss.beamPhase = null; boss.beamCooldown = (boss.stage === 3 ? (boss.phase === 2 ? (boss.hp <= boss.maxHp * 0.25 ? 95 : 230) : 260) : boss.stage === 2 ? 330 : 380)+Math.floor(Math.random()*(boss.stage === 3 && boss.phase === 2 && boss.hp <= boss.maxHp * 0.25 ? 70 : 160));
        boss.beamKind = null;
        boss.bossState = 'normal'; boss.stateTimer = 0;
      }
    }

    if (boss.beamPhase === null) {
      boss.x += boss.speed*boss.dir;
      if (boss.x > W-boss.w/2-15 || boss.x < boss.w/2+15) boss.dir *= -1;
    }

    if (boss.beamPhase === null) {
      boss.shootTimer++;
      if (boss.shootTimer >= boss.shootInterval) {
        boss.shootTimer = 0; boss.bossState = 'shooting'; boss.stateTimer = 35;
        const n = boss.stage === 3 ? (boss.phase === 2 ? 5 : 4) : boss.phase === 2 ? 4 : 3;
        const spreadSpeed = boss.stage === 3 ? (boss.phase === 2 ? 1.86 : 1.72) : boss.stage === 2 ? (boss.phase === 2 ? 1.94 : 1.88) : (boss.phase === 2 ? 2.08 : 2.02);
        for (let i = 0; i < n; i++) {
          const a = Math.PI/2+(i-(n-1)/2)*(boss.stage === 3 ? 0.28 : 0.36) + (boss.stage === 3 ? Math.sin(frameCount * 0.025) * 0.18 : 0);
          enemyBullets.push({ x:boss.x, y:boss.y+boss.h/2, vx:Math.cos(a)*spreadSpeed, vy:Math.sin(a)*spreadSpeed, type: boss.stage === 3 ? 'dark' : boss.stage === 2 ? 'shock' : 'coffee', r: boss.stage === 3 ? 8 : undefined });
        }
        if (boss.phase === 2) {
          boss.aimedVolley = (boss.aimedVolley || 0) + 1;
        }
        if (boss.phase === 2 && boss.aimedVolley % 2 === 0) {
          const dx=player.x-boss.x, dy=player.y-boss.y, d=Math.sqrt(dx*dx+dy*dy);
          const aimedSpeed = boss.stage === 3 ? 2.12 : boss.stage === 2 ? 2.26 : 2.38;
          enemyBullets.push({ x:boss.x, y:boss.y+boss.h/2, vx:dx/d*aimedSpeed, vy:dy/d*aimedSpeed, type: boss.stage === 3 ? 'dark' : boss.stage === 2 ? 'shock' : 'coffee', r: boss.stage === 3 ? 9 : undefined });
        }
        if (enemySoundCooldown === 0) { playSound('enemyShoot'); enemySoundCooldown = 10; }
      }
    }

    bullets = bullets.filter(b => {
      if (!boss) return true;
      const hitR = getPlayerBulletHitRadius(b);
      if (Math.abs(b.x-boss.x) < boss.hw/2 + hitR && Math.abs(b.y-boss.y) < boss.hh/2 + hitR) {
        const damage = b.damage || 1;
        boss.hp -= damage; boss.bossState = 'damaged'; boss.stateTimer = 18;
        spawnParticles(b.x, b.y, b.type === 'goldFeather' || (b.type === 'featherCharge' && b.isGold) ? C.gold : b.type === 'feather' || b.type === 'featherCharge' ? C.white : C.pink, b.type === 'charge' || b.type === 'featherCharge' ? 14 : 5);
        if (b.type === 'charge' || b.type === 'featherCharge') explodeChargeBullet(b);
        playSound('enemyHit'); updateHUD();
        if (boss.hp <= 0) defeatBoss();
        return false;
      }
      return true;
    });

    if (boss && player.invincible === 0 && !popRushInvincible &&
        Math.abs(boss.x-player.x) < (boss.hw+player.hw)/2 &&
        Math.abs(boss.y-player.y) < (boss.hh+player.hh)/2) {
      if (!DEBUG_INVINCIBLE) { lives--; missCount++; damageFlash = 22; } player.invincible = 120; screenShake = 12;
      spawnParticles(player.x, player.y, C.blue, 24);
      playSound('hit'); updateHUD();
      if (lives <= 0) gameOverPending = true;
    }
  }

  // ===== ENEMIES =====
  enemies = enemies.filter(e => {
    e.y += e.speed;
    if (e.pattern === 'sine') {
      e.x = e.startX + Math.sin(e.y/70+e.sineBase)*55;
      e.x = Math.max(e.w/2, Math.min(W-e.w/2, e.x));
    }
    if (e.canShoot && e.y > 0 && Math.random() < e.shootProb*(1+(level-1)*0.055)) {
      const dx=player.x-e.x, dy=player.y-e.y, d=Math.sqrt(dx*dx+dy*dy);
      const bulletSpeed = Math.min(3.2, (1.62 + (level-1) * 0.08) * (1 + (ng || 0) * 0.15)) * (e.bulletSpeedMul || 1);
      enemyBullets.push({ x:e.x, y:e.y+e.h/2, vx:dx/d*bulletSpeed, vy:dy/d*bulletSpeed, r: e.bulletR || 7 });
      if (enemySoundCooldown === 0) { playSound('enemyShoot'); enemySoundCooldown = 10; }
    }
    bullets = bullets.filter(b => {
      const hitR = getPlayerBulletHitRadius(b);
      if (Math.abs(b.x-e.x) < e.hw/2 + hitR && Math.abs(b.y-e.y) < e.hh/2 + hitR) {
        const damage = b.damage || 1;
        e.hp -= damage;
        spawnParticles(b.x, b.y, b.type === 'goldFeather' || (b.type === 'featherCharge' && b.isGold) ? C.gold : b.type === 'feather' || b.type === 'featherCharge' ? C.white : e.color, b.type === 'charge' || b.type === 'featherCharge' ? 14 : 5);
        if (b.type === 'charge' || b.type === 'featherCharge') explodeChargeBullet(b);
        playSound('enemyHit');
        if (e.hp <= 0) {
          addScore(e.scoreVal);
          spawnParticles(e.x, e.y, e.color, 18);
          if (e.dropBomb) trySpawnPowerup(e.x, e.y, 'bomb');
          else trySpawnPowerup(e.x, e.y);
          playSound('explosion');
        }
        return false;
      }
      return true;
    });
    if (e.hp <= 0) return false;
    if (player.invincible === 0 && !popRushInvincible && Math.abs(e.x-player.x) < (e.hw+player.hw)/2 && Math.abs(e.y-player.y) < (e.hh+player.hh)/2) {
      if (!DEBUG_INVINCIBLE) { lives--; missCount++; damageFlash = 22; } player.invincible = 120; screenShake = 10;
      spawnParticles(player.x, player.y, C.blue, 20); playSound('hit'); updateHUD();
      if (!DEBUG_INVINCIBLE && lives <= 0) gameOverPending = true;
      return false;
    }
    return e.y < H+e.h;
  });

  if ((runUpgrades?.chargePath || 0) >= 2) {
    const burstHits = [];
    for (const pb of bullets) {
      if (!pb.burst) continue;
      const pr = getPlayerBulletHitRadius(pb);
      if (enemyBullets.some(eb => {
        const dx = eb.x - pb.x, dy = eb.y - pb.y;
        return dx*dx + dy*dy < (pr + (eb.r || 7)) * (pr + (eb.r || 7));
      })) burstHits.push(pb);
    }
    for (const pb of burstHits) explodeChargeBullet(pb);
    if (burstHits.length) bullets = bullets.filter(b => !burstHits.includes(b));
  }

  enemyBullets = enemyBullets.filter(b => {
    b.x += b.vx; b.y += b.vy;
    const br = b.r || 7;
    const popLv = runUpgrades?.popPath || 0;
    const maxChain = popLv >= 2 ? 7 : popLv >= 1 ? 5 : 3;
    if (b.reflected && (b.chain || 0) < maxChain) {
      let chained = 0;
      for (const other of enemyBullets) {
        if (other === b || other.reflected || other.chainCooldown > 0) continue;
        const or = other.r || 7;
        const dx = other.x - b.x;
        const dy = other.y - b.y;
        const dist = Math.max(1, Math.sqrt(dx * dx + dy * dy));
        if (dist > br + or + 12 + popLv * 12) continue;
        const nextChain = (b.chain || 0) + 1;
        reflectEnemyBullet(other, dx / dist, dy / dist, nextChain, 0.8 + popLv * 0.35);
        other.chainCooldown = Math.max(4, 10 - popLv * 2);
        popEffects.push({ x: other.x, y: other.y, life: 22 + popLv * 4, maxLife: 22 + popLv * 4, r: 42 + nextChain * (12 + popLv * 3), level: popLv });
        spawnParticles(other.x, other.y, nextChain >= 3 ? C.pink : C.yellow, 10 + nextChain * (3 + popLv));
        chained++;
        if (chained >= 2 + popLv) break;
      }
      if (chained > 0) {
        screenShake = Math.max(screenShake, 4 + chained + popLv * 2);
        notify(chained >= 2 ? 'CHAIN POP!' : 'POP CHAIN!', chained >= 2 ? C.pink : C.yellow);
      }
    }
    if (b.reflected && bossActive && boss &&
        Math.abs(b.x-boss.x) < boss.hw/2 + br &&
        Math.abs(b.y-boss.y) < boss.hh/2 + br) {
      boss.hp -= b.damage || 3;
      boss.bossState = 'damaged';
      boss.stateTimer = 16;
      screenShake = Math.max(screenShake, 6);
      spawnParticles(b.x, b.y, C.yellow, 16);
      playSound('enemyHit');
      updateHUD();
      if (boss.hp <= 0) defeatBoss();
      if ((b.pierce || 0) > 0) {
        b.pierce--;
        return b.y < H+28 && b.y > -28 && b.x > -28 && b.x < W+28;
      }
      return false;
    }
    if (b.reflected) {
      for (const e of enemies) {
        if (Math.abs(b.x-e.x) < e.hw/2 + br && Math.abs(b.y-e.y) < e.hh/2 + br) {
          e.hp -= b.damage || 3;
          spawnParticles(b.x, b.y, C.yellow, 14);
          playSound('enemyHit');
          if (e.hp <= 0) {
            score += Math.max(5, Math.round(e.scoreVal * 0.5));
            updateHUD();
            spawnParticles(e.x, e.y, e.color, 18);
            if (e.dropBomb) trySpawnPowerup(e.x, e.y, 'bomb');
            else trySpawnPowerup(e.x, e.y);
            playSound('explosion');
          }
          if ((b.pierce || 0) > 0) {
            b.pierce--;
            return b.y < H+28 && b.y > -28 && b.x > -28 && b.x < W+28;
          }
          return false;
        }
      }
      return b.y < H+28 && b.y > -28 && b.x > -28 && b.x < W+28;
    }
    if (player.invincible === 0 && !popRushInvincible && Math.abs(b.x-player.x) < player.hw/2 + br * 0.45 && Math.abs(b.y-player.y) < player.hh/2 + br * 0.45) {
      if (!DEBUG_INVINCIBLE) { lives--; missCount++; damageFlash = 22; } player.invincible = 120; screenShake = 10;
      spawnParticles(player.x, player.y, C.blue, 20); playSound('hit'); updateHUD();
      if (!DEBUG_INVINCIBLE && lives <= 0) gameOverPending = true;
      return false;
    }
    return b.y < H+10 && b.y > -10 && b.x > -10 && b.x < W+10;
  });

  powerups = powerups.filter(p => {
    p.y += p.vy;
    if (Math.abs(p.x-player.x) < player.w/2+p.r && Math.abs(p.y-player.y) < player.h/2+p.r) {
      if (p.type === 'shield') { lives = Math.min(5, lives+1); notify('SHIELD +1', C.mint); }
      else if (p.type === 'bomb') { bombs = Math.min(maxBombs, bombs + 1); notify('POP +1', C.pink); }
      else if (p.type === 'feather') {
        runUpgrades.feather++;
        notify(`FEATHER +${runUpgrades.feather}!`, C.white);
      }
      else { currentPower = p.type; powerTimer = POWER_DURATION; notify(p.type.toUpperCase()+' SHOT!', C.lavender); }
      playSound(p.type === 'feather' ? 'featherPower' : 'powerup');
      spawnParticles(p.x, p.y, p.color, p.type === 'feather' ? 28 : 15);
      updateHUD();
      return false;
    }
    return p.y < H+20;
  });

  particles = particles.filter(p => { p.x+=p.vx; p.y+=p.vy; p.vy+=0.07; p.life-=p.decay; return p.life>0; });
  enemyBullets.forEach(b => { if (b.chainCooldown > 0) b.chainCooldown--; });
  popEffects = popEffects.filter(e => { e.life--; return e.life > 0; });
  notifications = notifications.filter(n => { n.life--; return n.life>0; });
  if (bossDeath) {
    bossDeath.life--;
    bossDeath.y += 0.09;
    if (bossDeath.life % 18 === 0) {
      spawnParticles(bossDeath.x + (Math.random() - 0.5) * 120, bossDeath.y + (Math.random() - 0.5) * 90, bossDeath.life % 36 === 0 ? C.lavender : C.pink, 10);
    }
    if (bossDeath.life <= 0) bossDeath = null;
  }

  stars.forEach(s => { s.y += s.speed; s.rot += s.rotSpeed; if (s.y > H) { s.y = 0; s.x = Math.random()*W; } });
  clouds.forEach(c => { c.x -= c.speed; if (c.x < -130) c.x = W+130; });

  if (gameOverPending) endGame();
}

function endGame() {
  const prevHi = hiScore;
  if (score > hiScore) { hiScore = score; localStorage.setItem('ssHi', hiScore); }
  playBgm('gameover');
  state = 'over';
  screenShake = 0;
  showOverlay(score > prevHi);
}

// ===== DRAW =====
function draw() {
  ctx.clearRect(0, 0, W, H);

  const sx = state === 'play' && screenShake > 0 ? (Math.random()-0.5)*screenShake : 0;
  const sy = state === 'play' && screenShake > 0 ? (Math.random()-0.5)*screenShake : 0;
  ctx.save();
  ctx.translate(sx, sy);

  drawBackground();
  if ((bossActive && boss?.stage === 3) || bossDeath) {
    ctx.save();
    ctx.fillStyle = bossDeath ? 'rgba(8,10,32,0.42)' : 'rgba(8,10,32,0.28)';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 12; i++) {
      const x = (i * 53 + frameCount * 0.35) % (W + 120) - 60;
      const y = 80 + Math.sin(frameCount * 0.018 + i) * 58 + (i % 4) * 95;
      ctx.fillStyle = i % 2 ? 'rgba(155,134,217,0.08)' : 'rgba(239,91,143,0.06)';
      ctx.beginPath();
      ctx.ellipse(x, y, 38 + (i % 3) * 18, 7 + (i % 4) * 3, -0.35, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
  clouds.forEach((c, i) => {
    const cc = cloudCaches[i];
    if (!cc) return;
    ctx.save();
    ctx.globalAlpha = c.alpha;
    ctx.drawImage(cc.canvas, c.x - cc.ox, c.y - cc.oy);
    ctx.restore();
  });
  ctx.save();
  stars.forEach(s => {
    ctx.globalAlpha = s.alpha;
    ctx.fillStyle = s.color;
    ctx.beginPath();
    for (let i = 0; i < 4; i++) {
      const a1 = (i/4)*Math.PI*2 + s.rot, a2 = a1+Math.PI/4;
      ctx.lineTo(s.x + Math.cos(a1)*s.r, s.y + Math.sin(a1)*s.r);
      ctx.lineTo(s.x + Math.cos(a2)*s.r*0.32, s.y + Math.sin(a2)*s.r*0.32);
    }
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = s.alpha * 0.55;
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.arc(s.x - Math.cos(s.rot)*s.r*0.2, s.y - Math.sin(s.rot)*s.r*0.2, s.r*0.22, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.restore();

  if (state === 'play' || state === 'upgrade') {
    particles.forEach(p => drawParticle(p));
    powerups.forEach(drawPowerup);
    bullets.forEach(drawBullet);
    enemyBullets.forEach(drawEnemyBullet);
    popEffects.forEach(drawPopEffect);
    enemies.forEach(drawEnemy);
    if (bossActive && boss && boss.beamPhase !== null) drawBeam(boss);
    if (bossActive && boss) drawBoss(boss);
    if (bossActive && boss) drawBoss3PhaseTransition(boss);
    if (bossDeath) drawBossDeath();
    if (bossActive && boss) drawBossIntro();
    drawPlayer();

    notifications.forEach(n => {
      const alpha = Math.min(1, n.life/30);
      const yOff  = (1-n.life/150)*45;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = n.color; ctx.strokeStyle = C.outline; ctx.lineWidth = 3;
      ctx.font = 'bold 26px Courier New';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.strokeText(n.text, n.x, n.y-yOff);
      ctx.fillText(n.text, n.x, n.y-yOff);
    });
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  if (state === 'play' && damageFlash > 0) {
    const alpha = (damageFlash / 22) * 0.65;
    ctx.save();
    const grad = ctx.createRadialGradient(W/2, H/2, H*0.2, W/2, H/2, H*0.78);
    grad.addColorStop(0, 'rgba(200,18,36,0)');
    grad.addColorStop(1, `rgba(200,18,36,${alpha})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  if (state === 'play' && hitStopTimer > 0) {
    const t = hitStopTimer / 34;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = `rgba(255,248,237,${0.34 * t})`;
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = `rgba(255,212,90,${0.86 * t})`;
    ctx.lineWidth = 10 * t + 2;
    ctx.beginPath();
    ctx.arc(W / 2, H * 0.28, 92 + (1 - t) * 240, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // ボスHPバー（シェイク外）
  if (state === 'play' && bossActive && boss) {
    const bw = 250;
    ctx.fillStyle = '#EED8E8'; ctx.strokeStyle = C.outline; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.roundRect(W/2-bw/2, 6, bw, 12, 6); ctx.fill(); ctx.stroke();
    const ratio = boss.hp / boss.maxHp;
    ctx.fillStyle = `hsl(${150+(1-ratio)*190}, 60%, 70%)`;
    ctx.beginPath(); ctx.roundRect(W/2-bw/2, 6, bw*ratio, 12, 6); ctx.fill();
    ctx.fillStyle = C.outline; ctx.font = 'bold 9px Courier New';
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(`BOSS  ${boss.hp} / ${boss.maxHp}`, W/2, 5);
  }
}

  }

// ===== LOOP =====
let _lastTime = 0;
const _FRAME_MS = 1000 / 60;

function loop(ts) {
  requestAnimationFrame(loop);
  const elapsed = ts - _lastTime;
  if (elapsed < _FRAME_MS) return;
  _lastTime = ts - (elapsed % _FRAME_MS);
  updateBootLogoFx();
  updateTitleMusicFx();
  if (state === 'play' && !paused) {
    if (hitStopTimer > 0) hitStopTimer--;
    else update();
  }
  draw();
}

// ===== 起動 =====
Promise.all([
  loadImage('p1',     'image/player/player01.png'),
  loadImage('p2',     'image/player/player01.png'),
  loadImage('p3',     'image/player/player01.png'),
  loadImage('b1',     'image/boss/boss01.png'),

  loadImage('b2a',    'image/boss2/boss2-01.png'),
  loadImage('b2special', 'image/boss2/boss2-02.png'),
  loadImage('b3p1',        'image/boss3/boss3-1-1.png'),
  loadImage('b3p1special', 'image/boss3/boss3-1_atack.png'),
  loadImage('b3p2',        'image/boss3/boss3-2-1.png'),
  loadImage('b3p2special', 'image/boss3/boss3-2-atack.png'),
  loadImage('b3dead',      'image/boss3/boss3-3.png'),
  loadImage('gameclear',   'title/title_gameclear.png'),
  loadImage('enemy0', 'image/enemy/enemy02.png'),
  loadImage('enemy1', 'image/enemy/enemy03.png'),
  loadImage('enemy2', 'image/enemy/enemy04.png'),

]).then(() => {
  loadingEl.style.display = 'none';
  initBgm();
  initStars();
  initClouds();
  initBgCache();
  initCloudCaches();
  initGame();
  if (DEBUG_BOSS) {
    bootScreen.style.display = 'none';
    overlay.style.display = 'none';
    score = 4500;
    bossStageSpawned[1] = true;
    bossStageSpawned[2] = true;
    state = 'play';
    playBgm('battle');
    spawnBoss(DEBUG_BOSS);
    updateHUD();
  } else {
    document.body.classList.add('boot-mode');
    overlay.style.display = 'none';
  }
  loop();
});
