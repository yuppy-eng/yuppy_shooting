function reflectEnemyBullet(b, nx, ny, chain = 0, strength = 1) {
  const speed = Math.min(6.4, Math.max(3.6, Math.sqrt(b.vx * b.vx + b.vy * b.vy) * 1.45 + strength * 1.7 + chain * 0.35));
  b.vx = nx * speed;
  b.vy = ny * speed;
  b.x += nx * (10 + strength * 12);
  b.y += ny * (10 + strength * 12);
  b.reflected = true;
  b.chain = chain;
  b.popped = 42;
  b.damage = Math.min(7, (b.type === 'coffee' || b.type === 'shock' ? 5 : 3) + chain);
  b.r = Math.max(b.r || 7, 9 + chain);
}

function usePop() {
  if (bombs <= 0 || player.invincible > 0) return;
  playSound('pop');
  bombs--;
  screenShake = 14;
  const radius = 164;
  let popped = 0;
  enemyBullets.forEach(b => {
    const dx = b.x - player.x;
    const dy = b.y - player.y;
    const dist = Math.max(1, Math.sqrt(dx * dx + dy * dy));
    if (dist > radius) return;
    const strength = 1 - dist / radius;
    reflectEnemyBullet(b, dx / dist, dy / dist, 0, strength);
    popped++;
  });
  popEffects.push({ x: player.x, y: player.y, life: 44, maxLife: 44, r: radius });
  player.popTimer = 32;
  spawnParticles(player.x, player.y, C.mint, 34);
  spawnParticles(player.x, player.y, C.yellow, 18);
  const label = popped >= 10 ? 'BIG POP!' : popped >= 5 ? 'NICE POP!' : 'POP!';
  notify(popped > 0 ? `${label} x${popped}` : label, popped >= 5 ? C.yellow : C.mint);
  if (popped > 0) score += popped * 5;
  updateHUD();
}

function defeatBoss() {
  if (!boss) return;
  const bx = boss.x, by = boss.y;
  addScore(boss.scoreVal);
  spawnParticles(bx, by, C.pink,   40);
  spawnParticles(bx, by, C.yellow, 30);
  spawnParticles(bx, by, C.blue,   20);
  screenShake = 18;
  bossActive = false;
  boss = null;
  enemyBullets = [];
  currentPower = 'rapid';
  powerTimer = Math.max(powerTimer, 420);
  notify('BOSS DEFEATED!', C.mint);
  playSound('bigExplosion');
  if (state === 'play') playBgm('battle');
  updateHUD();
  showUpgradeSelection();
}

// ===== BOSS =====
function getBossStageForLevel(lv) {
  if (lv >= 6) return 2;
  return 1;
}

function spawnBoss(stage = getBossStageForLevel(level)) {
  bossActive = true;
  if (bossStageSpawned) bossStageSpawned[stage] = true;
  enemies = []; enemyBullets = []; notifications = [];
  const isBoss2 = stage === 2;
  const hp = isBoss2 ? 70 + level * 13 : 30 + level * 15;
  boss = {
    stage, x: W / 2, y: -140, targetY: isBoss2 ? 112 : 100,
    w: isBoss2 ? 196 : 180, h: isBoss2 ? 196 : 180,
    hw: isBoss2 ? 126 : 116, hh: isBoss2 ? 126 : 116,
    hp, maxHp: hp, speed: isBoss2 ? 1.25 : 1.5, dir: 1,
    scoreVal: 500 + level * 100 + (isBoss2 ? 350 : 0),
    shootTimer: 0, shootInterval: isBoss2 ? 84 : 70,
    phase: 1, fc: 0,
    bossState: 'normal', stateTimer: 0,
    beamPhase: null, beamTimer: 0,
    beamCooldown: isBoss2 ? 300 : 360, beamX: W / 2,
    beamChargeSounded: false,
  };
  bossIntroTimer = BOSS_INTRO_DURATION;
  screenShake = 22;
  playSound('beamCharge');
  playBgm(isBoss2 ? 'boss2' : 'boss');
  updateHUD();
}

// ===== ENEMIES =====
function spawnEnemy() {
  if (bossActive) return;
  const types   = ['heavy', 'basic', 'fast', 'bomber'];
  const weights = level < 3 ? [1, 9, 4, 1] : level < 6 ? [2, 8, 5, 2] : [2, 7, 5, 3];
  const total   = weights.reduce((a, b) => a + b, 0);
  let acc = 0, r = Math.random() * total, type = 'basic';
  for (let i = 0; i < types.length; i++) { acc += weights[i]; if (r < acc) { type = types[i]; break; } }

  const cfg = {
    heavy:  { imgKey: 'enemy0', w: 104, h: 104, hw: 64, hh: 64, hp: 4, speed: enemySpeed * 0.64, color: C.lavender, scoreVal: 55, canShoot: true,  shootProb: 0.0022, bulletR: 15, bulletSpeedMul: 0.58, dropBomb: false },
    basic:  { imgKey: 'enemy1', w: 78,  h: 78,  hw: 48, hh: 48, hp: 1, speed: enemySpeed,        color: C.pink,     scoreVal: 15, canShoot: true,  shootProb: 0.0017, bulletR: 8,  bulletSpeedMul: 0.82, dropBomb: false },
    fast:   { imgKey: 'enemy2', w: 60,  h: 60,  hw: 34, hh: 34, hp: 1, speed: enemySpeed * 1.78, color: C.peach,    scoreVal: 20, canShoot: false, shootProb: 0,      bulletR: 6,  bulletSpeedMul: 1,    dropBomb: false },
    bomber: { imgKey: 'enemy3', w: 78,  h: 78,  hw: 47, hh: 47, hp: 1, speed: enemySpeed * 0.92, color: C.yellow,   scoreVal: 35, canShoot: true,  shootProb: 0.0065, bulletR: 8,  bulletSpeedMul: 0.72, dropBomb: true },
  }[type];

  const pattern = type === 'fast' || Math.random() < 0.22 ? 'sine' : 'straight';
  const startX  = Math.random() * (W - cfg.w) + cfg.w / 2;
  enemies.push({ x: startX, y: -cfg.h, type, ...cfg, maxHp: cfg.hp, pattern, startX, sineBase: Math.random() * Math.PI * 2 });
}

// ===== POWERUP =====
function spawnPowerup(x, y, type) {
  const colors = { spread: C.lavender, rapid: C.yellow, shield: C.mint, bomb: C.pink };
  powerups.push({ x, y, type, vy: 1.5, r: type === 'bomb' ? 14 : 13, color: colors[type] });
}

function trySpawnPowerup(x, y, forcedType = null) {
  if (forcedType) {
    spawnPowerup(x, y, forcedType);
    return;
  }
  if (Math.random() > Math.min(0.34, 0.18 + (runUpgrades?.luck || 0) * 0.045)) return;
  const types  = ['spread', 'rapid', 'shield'];
  const type   = types[Math.floor(Math.random() * types.length)];
  spawnPowerup(x, y, type);
}

// ===== PARTICLES =====
function spawnParticles(x, y, _color, count = 12) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2, spd = Math.random() * 4 + 1;
    particles.push({
      x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
      r: Math.random() * 4 + 1.5, life: 1,
      decay: 0.018 + Math.random() * 0.018,
      color: PASTEL_COLS[Math.floor(Math.random() * PASTEL_COLS.length)],
      shape: Math.random() < 0.4 ? 'star' : 'circle',
    });
  }
}

// ===== DRAW: 背景 =====
function drawBackground() {
  const grd = ctx.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0,    C.bgTop);
  grd.addColorStop(0.45, C.bgMid);
  grd.addColorStop(1,    C.bgBot);
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.globalAlpha = 0.32;
  ctx.fillStyle = C.pink;
  for (let y = 28; y < H; y += 26) {
    for (let x = 18; x < W; x += 26) {
      if ((x + y) % 78 === 0) {
        ctx.beginPath();
        ctx.arc(x, y, 1.4, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
  ctx.globalAlpha = 1;

  const streaks = [
    { x: W - 105, y: 150, w: 92, color: C.yellow, rot: -0.7 },
    { x: W - 72, y: 520, w: 112, color: C.mint, rot: -0.35 },
    { x: 52, y: 610, w: 82, color: C.pink, rot: 0.28 },
  ];
  streaks.forEach(s => {
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rot);
    ctx.fillStyle = s.color;
    ctx.beginPath();
    ctx.roundRect(-s.w / 2, -4, s.w, 8, 8);
    ctx.fill();
    ctx.restore();
  });

  ctx.fillStyle = C.pink;
  ctx.beginPath();
  ctx.arc(-35, H - 70, 105, 0, Math.PI * 2);
  ctx.arc(82, H - 20, 96, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = C.outline;
  ctx.beginPath();
  ctx.moveTo(0, H - 22);
  ctx.bezierCurveTo(120, H - 110, 215, H + 15, 340, H - 44);
  ctx.bezierCurveTo(430, H - 86, 488, H - 18, W, H - 70);
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// ===== DRAW: 雲 =====
function drawCloud(x, y, scale, alpha) {
  ctx.save();
  ctx.translate(x, y);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#FFF8ED';
  [[0,0,22],[26,6,15],[-26,6,15],[13,-10,13],[-13,-10,13],[38,10,10],[-38,10,10]].forEach(([cx,cy,r]) => {
    ctx.beginPath(); ctx.arc(cx*scale, cy*scale, r*scale, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = alpha * 0.2;
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath(); ctx.ellipse(-10*scale, -8*scale, 25*scale, 10*scale, -0.18, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

// ===== DRAW: キラキラ星 =====
function drawSparkle(x, y, r, color, alpha, rot) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 4; i++) {
    const a1 = (i/4)*Math.PI*2, a2 = a1+Math.PI/4;
    ctx.lineTo(Math.cos(a1)*r, Math.sin(a1)*r);
    ctx.lineTo(Math.cos(a2)*r*0.32, Math.sin(a2)*r*0.32);
  }
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = alpha * 0.55;
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath(); ctx.arc(-r*0.2, -r*0.2, r*0.22, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

// ===== DRAW: パーティクル =====
function drawParticle(p) {
  ctx.save();
  ctx.globalAlpha = p.life;
  ctx.fillStyle = p.color;
  ctx.strokeStyle = C.outline; ctx.lineWidth = 1;
  if (p.shape === 'star') {
    ctx.translate(p.x, p.y); ctx.rotate(p.life * 3);
    ctx.beginPath();
    for (let i = 0; i < 4; i++) {
      const a1=(i/4)*Math.PI*2, a2=a1+Math.PI/4;
      ctx.lineTo(Math.cos(a1)*p.r, Math.sin(a1)*p.r);
      ctx.lineTo(Math.cos(a2)*p.r*0.35, Math.sin(a2)*p.r*0.35);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

// ===== DRAW: PLAYER =====
function drawPlayer() {
  const { x, y, w, h, invincible } = player;
  if (invincible > 0 && Math.floor(invincible / 8) % 2 !== 0) return;

  let imgKey = 'p1';
  if (invincible > 0)                imgKey = 'p2';
  else if (currentPower !== 'normal') imgKey = 'p3';

  ctx.save();
  ctx.translate(x, y);
  if (player.popTimer > 0) {
    const pop = player.popTimer / 24;
    const poyon = Math.sin((1 - pop) * Math.PI) * 0.18 + pop * 0.05;
    ctx.scale(1 + poyon, 1 + poyon * 0.72);
  }
  if (invincible > 0) {
    ctx.translate((Math.random()-0.5)*7, (Math.random()-0.5)*7);
    ctx.scale(0.87, 0.87);
  }
  const img = imgs[imgKey];
  if (img) {
    const sx = img.width * 0.18;
    const sy = img.height * 0.2;
    const sw = img.width * 0.64;
    const sh = img.height * 0.66;
    drawImagePartOutlined(img, sx, sy, sw, sh, -w/2, -h/2, w, h, 2.3);
  } else {
    drawPlayerMascot(w, h);
  }
  ctx.restore();
}

function drawPopEffect(e) {
  const t = 1 - e.life / e.maxLife;
  const r = 18 + e.r * t;
  const alpha = Math.max(0, 1 - t);
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.globalCompositeOperation = 'lighter';
  ['#63C7BA', '#EF5B8F', '#FFC83D'].forEach((color, i) => {
    ctx.strokeStyle = color;
    ctx.globalAlpha = alpha * (0.72 - i * 0.12);
    ctx.lineWidth = 8 - i * 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, r + i * 9 + Math.sin(frameCount * 0.18 + i) * 2, 0, Math.PI * 2);
    ctx.stroke();
  });
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = alpha;
  for (let i = 0; i < 14; i++) {
    const a = i / 14 * Math.PI * 2 + t * 1.8;
    const rr = r * 0.62 + i % 2 * 14;
    ctx.fillStyle = i % 3 === 0 ? C.yellow : i % 3 === 1 ? C.pink : C.mint;
    ctx.beginPath();
    ctx.ellipse(Math.cos(a) * rr, Math.sin(a) * rr, 4.5, 9, a, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawPlayerMascot(w, h) {
  ctx.save();
  ctx.strokeStyle = C.outline;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  ctx.fillStyle = '#FFFFFF';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.ellipse(0, 3, w * 0.34, h * 0.42, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();

  ctx.fillStyle = C.white;
  ctx.beginPath();
  ctx.ellipse(-w * 0.34, h * 0.04, w * 0.18, h * 0.09, -0.45, 0, Math.PI * 2);
  ctx.ellipse(w * 0.34, h * 0.04, w * 0.18, h * 0.09, 0.45, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();

  ctx.fillStyle = C.pink;
  [-10, 0, 10].forEach((dx, i) => {
    ctx.beginPath();
    ctx.ellipse(dx * 0.55, -h * 0.43 - i * 1.5, 6, 13, dx * 0.03, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
  });

  ctx.fillStyle = '#FFFFFF';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(-9, -h * 0.17, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(9, -h * 0.17, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.outline;
  ctx.beginPath(); ctx.arc(-8, -h * 0.16, 1.6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(8, -h * 0.16, 1.6, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = C.yellow;
  ctx.beginPath();
  ctx.moveTo(-5, -h * 0.08);
  ctx.lineTo(0, -h * 0.01);
  ctx.lineTo(5, -h * 0.08);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  ctx.fillStyle = '#F8D9CA';
  ctx.strokeStyle = C.outline;
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.ellipse(0, h * 0.12, w * 0.19, h * 0.18, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.white;
  ctx.beginPath(); ctx.ellipse(0, h * 0.12, w * 0.14, h * 0.13, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.pink;
  ctx.beginPath(); ctx.arc(0, h * 0.12, 11, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.yellow;
  ctx.beginPath(); ctx.arc(0, h * 0.12, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

  ctx.strokeStyle = '#E6B792';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-12, h * 0.41); ctx.lineTo(-20, h * 0.5); ctx.moveTo(-12, h * 0.41); ctx.lineTo(-5, h * 0.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(12, h * 0.41); ctx.lineTo(5, h * 0.5); ctx.moveTo(12, h * 0.41); ctx.lineTo(20, h * 0.5); ctx.stroke();
  ctx.restore();
}

// ===== DRAW: ENEMY =====
function drawEnemy(e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  const img = imgs[e.imgKey];
  if (img) {
    drawImageContainOutlined(img, -e.w/2, -e.h/2, e.w, e.h, 2.4);
  } else {
    ctx.fillStyle = e.color; ctx.strokeStyle = C.outline; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, 0, e.w*0.45, e.h*0.45, 0, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
  }
  if (e.maxHp > 1) {
    const bw = e.w * 0.85;
    ctx.fillStyle = '#EED8E8'; ctx.strokeStyle = C.outline; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(-bw/2, e.h/2+3, bw, 6, 3); ctx.fill(); ctx.stroke();
    ctx.fillStyle = C.mint;
    ctx.beginPath(); ctx.roundRect(-bw/2, e.h/2+3, bw*(e.hp/e.maxHp), 6, 3); ctx.fill();
  }
  ctx.restore();
}

// ===== DRAW: BOSS =====
function drawBoss(b) {
  let imgKey = b.stage === 2 ? 'b2a' : 'b1';
  if (b.stage === 2) {
    if (b.beamPhase !== null || b.bossState === 'shooting') imgKey = 'b2special';
  } else {
    if (b.beamPhase !== null)            imgKey = 'bBeam';
    else if (b.bossState === 'damaged')  imgKey = 'b3';
    else if (b.bossState === 'shooting') imgKey = 'b2';
  }

  const pulse = 1 + Math.sin(b.fc * 0.06) * 0.025;
  ctx.save();
  ctx.translate(b.x, b.y); ctx.scale(pulse, pulse);
  const img = imgs[imgKey];
  if (img) {
    drawImageCoverOutlined(img, -b.w/2, -b.h/2, b.w, b.h, 3);
  } else {
    ctx.fillStyle = C.white; ctx.strokeStyle = C.outline; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(0, 0, b.w*0.45, b.h*0.45, 0, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

function drawImageCover(img, dx, dy, dw, dh) {
  const scale = Math.min(img.width / dw, img.height / dh);
  const sw = dw * scale;
  const sh = dh * scale;
  const sx = (img.width - sw) / 2;
  const sy = (img.height - sh) / 2;
  ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
}

function drawImagePartOutlined(img, sx, sy, sw, sh, dx, dy, dw, dh, outline = 4) {
  const offsets = Array.from({ length: 12 }, (_, i) => {
    const a = (i / 12) * Math.PI * 2;
    return [Math.cos(a) * outline, Math.sin(a) * outline];
  });
  ctx.save();
  ctx.globalAlpha = 0.86;
  ctx.filter = 'brightness(0) blur(0.35px)';
  offsets.forEach(([ox, oy]) => ctx.drawImage(img, sx, sy, sw, sh, dx + ox, dy + oy, dw, dh));
  ctx.restore();
  ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
}

function drawImageCoverOutlined(img, dx, dy, dw, dh, outline = 4) {
  const scale = Math.min(img.width / dw, img.height / dh);
  const sw = dw * scale;
  const sh = dh * scale;
  const sx = (img.width - sw) / 2;
  const sy = (img.height - sh) / 2;
  drawImagePartOutlined(img, sx, sy, sw, sh, dx, dy, dw, dh, outline);
}

function drawImageContainOutlined(img, dx, dy, dw, dh, outline = 4) {
  const scale = Math.min(dw / img.width, dh / img.height);
  const w = img.width * scale;
  const h = img.height * scale;
  drawImagePartOutlined(img, 0, 0, img.width, img.height, dx + (dw - w) / 2, dy + (dh - h) / 2, w, h, outline);
}

// ===== DRAW: BEAM =====
function drawBeam(b) {
  if (b.stage === 2) { drawGorillaShockwave(b); return; }
  const bx = b.beamX, startY = b.y + b.h/2;
  if (b.beamPhase === 'charging') {
    const progress = 1 - b.beamTimer/90, r = 18 + progress*76;
    ctx.save();
    const grd = ctx.createRadialGradient(bx, startY, 0, bx, startY, r);
    grd.addColorStop(0,    `rgba(255,248,237,${progress})`);
    grd.addColorStop(0.24, `rgba(226,177,111,${progress*0.9})`);
    grd.addColorStop(0.58, `rgba(122,74,43,${progress*0.58})`);
    grd.addColorStop(1,    'transparent');
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(bx, startY, r, 0, Math.PI*2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    for (let i = 0; i < 4; i++) {
      const x = bx + Math.sin(frameCount * 0.045 + i * 1.7) * 23 * progress;
      ctx.strokeStyle = `rgba(${i % 2 ? '255,248,237' : '122,74,43'},${0.42 * progress})`;
      ctx.lineWidth = 2 + i;
      ctx.beginPath();
      ctx.moveTo(x, startY + 10);
      ctx.bezierCurveTo(x - 22, startY + 110, x + 25, startY + 190, x, H);
      ctx.stroke();
    }
    for (let i = 0; i < 8; i++) {
      const ox = Math.sin(frameCount * 0.08 + i) * 26 * progress;
      ctx.fillStyle = i % 3 === 0 ? `rgba(255,248,237,${0.55 * progress})` : `rgba(185,121,71,${0.55 * progress})`;
      ctx.beginPath();
      ctx.ellipse(bx + ox, startY + 18 + i * 14, 3 + i * 0.25, 5 + i * 0.3, 0.3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  } else if (b.beamPhase === 'firing') {
    const pulse = 0.5 + Math.sin(frameCount * 0.34) * 0.5;
    const ripple = Math.sin(frameCount * 0.11) * 7;
    const flicker = 0.9 + pulse * 0.1, beamW = 118;
    ctx.save();

    const beamTop = startY - 8;
    const beamBottom = H + 38;
    const edgePoints = [];
    for (let y = beamTop; y <= beamBottom; y += 28) {
      const t = (y - beamTop) / Math.max(1, beamBottom - beamTop);
      const width = beamW * (0.36 + 0.08 * Math.sin(t * Math.PI * 2 + frameCount * 0.04));
      const wobble = Math.sin(t * 10 + frameCount * 0.075) * 10 + Math.sin(t * 23 - frameCount * 0.035) * 4;
      edgePoints.push({ y, left: bx - width + wobble, right: bx + width + wobble });
    }

    ctx.globalCompositeOperation = 'lighter';
    const aura = ctx.createRadialGradient(bx, startY + 22, 8, bx, startY + 210, beamW * 1.55);
    aura.addColorStop(0, 'rgba(255,248,237,0.32)');
    aura.addColorStop(0.36, 'rgba(226,177,111,0.18)');
    aura.addColorStop(0.72, 'rgba(122,74,43,0.08)');
    aura.addColorStop(1, 'transparent');
    ctx.fillStyle = aura;
    ctx.beginPath();
    ctx.ellipse(bx, startY + 220, beamW * 1.45, H - startY + 90, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';

    ctx.beginPath();
    edgePoints.forEach((pt, i) => {
      if (i === 0) ctx.moveTo(pt.left, pt.y);
      else ctx.lineTo(pt.left, pt.y);
    });
    for (let i = edgePoints.length - 1; i >= 0; i--) {
      const pt = edgePoints[i];
      ctx.lineTo(pt.right, pt.y);
    }
    ctx.closePath();
    ctx.save();
    ctx.clip();

    const cg = ctx.createLinearGradient(bx-beamW/2, 0, bx+beamW/2, 0);
    cg.addColorStop(0,    'transparent');
    cg.addColorStop(0.1,  `rgba(54,27,14,${flicker*0.84})`);
    cg.addColorStop(0.24, `rgba(104,58,31,${flicker})`);
    cg.addColorStop(0.42, `rgba(185,121,71,${flicker})`);
    cg.addColorStop(0.5,  `rgba(255,240,204,${flicker*0.92})`);
    cg.addColorStop(0.58, `rgba(185,121,71,${flicker})`);
    cg.addColorStop(0.76, `rgba(104,58,31,${flicker})`);
    cg.addColorStop(0.9,  `rgba(54,27,14,${flicker*0.84})`);
    cg.addColorStop(1,    'transparent');
    ctx.fillStyle = cg;
    ctx.fillRect(bx - beamW * 0.62, beamTop, beamW * 1.24, beamBottom - beamTop);

    const shine = ctx.createLinearGradient(bx - 11, 0, bx + 11, 0);
    shine.addColorStop(0, 'rgba(255,248,237,0)');
    shine.addColorStop(0.48, `rgba(255,248,237,${0.7 + pulse * 0.18})`);
    shine.addColorStop(1, 'rgba(255,248,237,0)');
    ctx.fillStyle = shine;
    ctx.fillRect(bx - 13 + ripple * 0.2, beamTop, 26, beamBottom - beamTop);

    ctx.restore();

    ctx.strokeStyle = 'rgba(255,248,237,0.28)';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    edgePoints.forEach((pt, i) => {
      const x = pt.left + 4;
      if (i === 0) ctx.moveTo(x, pt.y); else ctx.lineTo(x, pt.y);
    });
    ctx.stroke();
    ctx.beginPath();
    edgePoints.forEach((pt, i) => {
      const x = pt.right - 4;
      if (i === 0) ctx.moveTo(x, pt.y); else ctx.lineTo(x, pt.y);
    });
    ctx.stroke();

    for (let i = 0; i < 5; i++) {
      const offset = (i - 2) * 15 + Math.sin(frameCount * 0.08 + i) * 9;
      ctx.strokeStyle = i === 2 ? 'rgba(255,248,237,0.54)' : 'rgba(226,177,111,0.38)';
      ctx.lineWidth = i === 2 ? 5 : 3;
      ctx.beginPath();
      ctx.moveTo(bx + offset, beamTop + 6);
      ctx.bezierCurveTo(bx + offset + 18 + ripple, startY + 150, bx + offset - 22 - ripple, startY + 320, bx + offset + ripple, H + 20);
      ctx.stroke();
    }

    for (let i = 0; i < 30; i++) {
      const y = startY + ((frameCount * (6 + i % 4) + i * 37) % (H - startY + 76));
      const drift = Math.sin(frameCount * 0.055 + i * 1.37);
      const x = bx + drift * beamW * (0.16 + (i % 5) * 0.045);
      ctx.fillStyle = i % 4 === 0 ? 'rgba(255,248,237,0.78)' : i % 3 === 0 ? 'rgba(226,177,111,0.66)' : 'rgba(92,48,25,0.58)';
      ctx.beginPath();
      ctx.ellipse(x, y, 2.2 + (i % 4), 4.5 + (i % 5), drift * 0.55, 0, Math.PI * 2);
      ctx.fill();
    }

    const cap = ctx.createRadialGradient(bx, startY + 9, 4, bx, startY + 9, beamW * 0.72);
    cap.addColorStop(0, 'rgba(255,248,237,0.9)');
    cap.addColorStop(0.22, 'rgba(226,177,111,0.54)');
    cap.addColorStop(0.52, 'rgba(122,74,43,0.22)');
    cap.addColorStop(1, 'transparent');
    ctx.fillStyle = cap;
    ctx.beginPath();
    ctx.ellipse(bx, startY + 10, beamW * 0.54 + pulse * 11, 22 + pulse * 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,248,237,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(bx, startY + 10, beamW * 0.45 + pulse * 9, 17 + pulse * 5, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
}

function getBoss2ShockGapX(b) {
  const base = b.beamX || b.x;
  return Math.max(82, Math.min(W - 82, base));
}

function traceBoss2WavePath(y, waveIndex, width, gapX, gapHalf, upper) {
  const step = 24;
  const points = [];
  for (let x = 0; x <= W; x += step) {
    const waveY = y + Math.sin(x * 0.035 + frameCount * 0.18 + waveIndex) * (18 + waveIndex * 2);
    points.push({ x, y: waveY + (upper ? -width : width) });
  }
  const drawSegment = (from, to) => {
    ctx.beginPath();
    const pts = upper ? points.slice(from, to + 1) : points.slice(from, to + 1).reverse();
    pts.forEach((pt, idx) => idx === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y));
    const edgeA = upper ? points[to] : points[from];
    const edgeB = upper ? points[from] : points[to];
    ctx.lineTo(edgeA.x, edgeA.y + (upper ? width * 2 : -width * 2));
    for (let i = to; i >= from; i--) {
      const pt = points[i];
      ctx.lineTo(pt.x, pt.y + (upper ? width * 2 : -width * 2));
    }
    ctx.lineTo(edgeB.x, edgeB.y);
    ctx.closePath();
    ctx.fill();
  };
  let start = 0;
  for (let i = 0; i < points.length; i++) {
    if (Math.abs(points[i].x - gapX) < gapHalf) {
      if (i - 1 > start) drawSegment(start, i - 1);
      start = i + 1;
    }
  }
  if (start < points.length - 1) drawSegment(start, points.length - 1);
}

function drawGorillaShockwave(b) {
  const startY = b.y + b.h * 0.38;
  ctx.save();
  if (b.beamPhase === 'charging') {
    const progress = 1 - b.beamTimer / 90;
    const pulse = 0.5 + Math.sin(frameCount * 0.35) * 0.5;
    const gapX = getBoss2ShockGapX(b, 0, 0);
    ctx.fillStyle = `rgba(8,16,58,${0.18 + progress * 0.18})`;
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 4; i++) {
      const r = 34 + progress * (64 + i * 35) + pulse * 10;
      const grd = ctx.createRadialGradient(b.x, startY, r * 0.25, b.x, startY, r);
      grd.addColorStop(0, `rgba(255,248,237,${0.02})`);
      grd.addColorStop(0.58, `rgba(99,199,186,${0.06 + progress * 0.13})`);
      grd.addColorStop(0.82, `rgba(155,134,217,${0.22 + progress * 0.28})`);
      grd.addColorStop(1, 'transparent');
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(b.x, startY, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = `rgba(255,248,237,${0.18 + progress * 0.18})`;
    ctx.fillRect(gapX - 68, startY + 26, 136, H - startY - 44);
    ctx.strokeStyle = `rgba(255,248,237,${0.72 * progress})`;
    ctx.lineWidth = 3;
    ctx.setLineDash([12, 8]);
    ctx.beginPath();
    ctx.moveTo(gapX - 68, startY + 32);
    ctx.lineTo(gapX - 68, H - 40);
    ctx.moveTo(gapX + 68, startY + 32);
    ctx.lineTo(gapX + 68, H - 40);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = `rgba(99,199,186,${0.78 * progress})`;
    ctx.font = 'bold 14px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('SAFE GAP', gapX, startY + 56);
    ctx.restore();
    return;
  }

  const elapsed = 150 - b.beamTimer;
  const baseAlpha = Math.max(0.24, b.beamTimer / 150);
  ctx.fillStyle = `rgba(8,16,58,${0.1 * baseAlpha})`;
  ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 4; i++) {
    const y = startY + elapsed * 4.4 - i * 150;
    if (y < startY - 70 || y > H + 80) continue;
    const width = 30 + i * 3 + Math.sin(frameCount * 0.2 + i) * 3;
    const gapX = getBoss2ShockGapX(b, i, elapsed);
    const gapHalf = 62;
    const grd = ctx.createLinearGradient(0, y - width, 0, y + width);
    grd.addColorStop(0, 'transparent');
    grd.addColorStop(0.24, `rgba(99,199,186,${0.18 * baseAlpha})`);
    grd.addColorStop(0.46, `rgba(255,248,237,${0.82 * baseAlpha})`);
    grd.addColorStop(0.54, `rgba(155,134,217,${0.86 * baseAlpha})`);
    grd.addColorStop(0.78, `rgba(239,91,143,${0.28 * baseAlpha})`);
    grd.addColorStop(1, 'transparent');
    ctx.fillStyle = grd;
    traceBoss2WavePath(y, i, width, gapX, gapHalf, true);
    ctx.strokeStyle = `rgba(255,248,237,${0.72 * baseAlpha})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    let drawing = false;
    for (let x = 0; x <= W; x += 24) {
      const waveY = y + Math.sin(x * 0.035 + frameCount * 0.18 + i) * (18 + i * 2);
      if (Math.abs(x - gapX) < gapHalf) { drawing = false; continue; }
      if (!drawing) { ctx.moveTo(x, waveY); drawing = true; }
      else ctx.lineTo(x, waveY);
    }
    ctx.stroke();
    ctx.fillStyle = `rgba(255,248,237,${0.28 * baseAlpha})`;
    ctx.fillRect(gapX - gapHalf, y - width - 5, gapHalf * 2, width * 2 + 10);
  }
  ctx.restore();
}

// ===== DRAW: 弾 =====
function drawBossIntro() {
  if (!bossIntroTimer || !boss) return;
  const progress = 1 - bossIntroTimer / BOSS_INTRO_DURATION;
  const warningPhase = progress < 0.38;
  const dropProgress = Math.max(0, (progress - 0.38) / 0.62);
  const flash = Math.max(0, Math.sin(progress * Math.PI * 4)) * (1 - progress * 0.55);
  const isBoss2 = boss.stage === 2;
  const mainColor = isBoss2 ? '#63C7BA' : C.pink;
  const accentColor = isBoss2 ? '#9B86D9' : C.yellow;
  const alertText = isBoss2 ? 'GORILLA SHOCKWAVE APPROACHING' : 'COFFEE CUP ELEPHANT APPROACHING';
  ctx.save();
  ctx.fillStyle = `rgba(8,16,58,${warningPhase ? 0.62 : 0.5 - dropProgress * 0.22})`;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = C.outline;
  ctx.fillRect(0, 84, W, 70);
  ctx.fillRect(0, H - 158, W, 62);
  ctx.fillStyle = warningPhase && Math.floor(frameCount / 14) % 2 === 0 ? accentColor : mainColor;
  ctx.font = 'bold 42px Courier New';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('WARNING', W / 2, 119);
  ctx.fillStyle = C.white;
  ctx.font = 'bold 16px Courier New';
  ctx.fillText(alertText, W / 2, H - 127);

  const ringR = 55 + dropProgress * 250;
  ctx.strokeStyle = isBoss2 ? `rgba(99,199,186,${0.78 - dropProgress * 0.45})` : `rgba(239,91,143,${0.75 - dropProgress * 0.45})`;
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.arc(W / 2, boss.targetY + 28, ringR, 0, Math.PI * 2);
  ctx.stroke();

  for (let i = 0; i < 16; i++) {
    const a = i / 16 * Math.PI * 2 + progress * 2.5;
    const r = 38 + dropProgress * 190 + (i % 3) * 12;
    ctx.fillStyle = isBoss2 ? (i % 2 ? '#9B86D9' : '#63C7BA') : (i % 2 ? '#7A4A2B' : C.peach);
    ctx.beginPath();
    ctx.ellipse(W / 2 + Math.cos(a) * r, boss.targetY + 34 + Math.sin(a) * r * 0.58, 5 + flash * 8, 9 + flash * 10, a, 0, Math.PI * 2);
    ctx.fill();
  }

  if (flash > 0.05) {
    ctx.fillStyle = `rgba(255,248,237,${flash * 0.45})`;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
}

function drawBullet(b) {
  ctx.save(); ctx.translate(b.x, b.y);
  ctx.rotate(Math.sin(frameCount * 0.2 + b.x) * 0.08);
  ctx.fillStyle = C.yellow; ctx.strokeStyle = C.outline; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(0, -4, 6, 10, 0, 0, Math.PI*2);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,248,237,0.85)';
  ctx.beginPath(); ctx.arc(-2, -8, 3, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = C.pink; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(0, 8); ctx.lineTo(0, 22); ctx.stroke();
  ctx.restore();
}

function drawEnemyBullet(b) {
  ctx.save(); ctx.translate(b.x, b.y);
  if (b.popped > 0) {
    ctx.shadowColor = 'rgba(255,200,61,0.72)';
    ctx.shadowBlur = 14;
    b.popped--;
  }
  if (b.reflected) {
    ctx.shadowColor = 'rgba(255,200,61,0.95)';
    ctx.shadowBlur = 18;
    ctx.rotate(frameCount * 0.12);
  }
  if (b.type === 'coffee') {
    ctx.rotate(Math.atan2(b.vy, b.vx) + Math.PI / 2);
    ctx.fillStyle = '#7A4A2B';
    ctx.strokeStyle = C.outline;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(0, 0, 5.5, 9, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,248,237,0.55)';
    ctx.beginPath(); ctx.arc(-1.5, -3, 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#B97947';
    ctx.beginPath(); ctx.arc(8, 8, 2.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(-8, 6, 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    return;
  }
  if (b.type === 'shock') {
    ctx.rotate(Math.atan2(b.vy, b.vx));
    ctx.shadowColor = 'rgba(155,134,217,0.65)';
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#63C7BA';
    ctx.strokeStyle = C.outline;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(10, 0);
    ctx.lineTo(1, 7);
    ctx.lineTo(-9, 4);
    ctx.lineTo(-2, 0);
    ctx.lineTo(-9, -4);
    ctx.lineTo(1, -7);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,248,237,0.82)';
    ctx.beginPath(); ctx.arc(1, -2, 2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    return;
  }
  const r = b.r || 7;
  ctx.fillStyle = C.pink; ctx.strokeStyle = C.outline; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,248,237,0.75)';
  ctx.beginPath(); ctx.arc(-r * 0.28, -r * 0.28, Math.max(2.5, r * 0.36), 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

// ===== DRAW: パワーアップ =====
function drawPowerup(p) {
  const pulse = Math.sin(frameCount*0.12)*3;
  ctx.save(); ctx.translate(p.x, p.y);
  ctx.globalAlpha = 0.55; ctx.strokeStyle = p.color; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(0, 0, p.r+5+pulse, 0, Math.PI*2); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.fillStyle = p.color; ctx.strokeStyle = C.outline; ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (let i = 0; i < 4; i++) {
    const a1 = (i / 4) * Math.PI * 2;
    const a2 = a1 + Math.PI / 4;
    ctx.lineTo(Math.cos(a1) * (p.r + 3), Math.sin(a1) * (p.r + 3));
    ctx.lineTo(Math.cos(a2) * p.r * 0.45, Math.sin(a2) * p.r * 0.45);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.outline;
  ctx.font = 'bold 11px Courier New'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText({ spread:'S', rapid:'R', shield:'♡', bomb:'P' }[p.type], 0, 0);
  ctx.restore();
}

// ===== UPDATE =====
function update() {
  frameCount++;
  shootTimer = Math.max(0, shootTimer-1);
  enemySoundCooldown = Math.max(0, enemySoundCooldown-1);
  if (player.popTimer > 0) player.popTimer--;
  if (screenShake > 0.3) screenShake *= 0.8; else screenShake = 0;
  if (comboTimer > 0) {
    comboTimer--;
    if (comboTimer === 0) {
      combo = 0;
      updateHUD();
    }
  }

  if (powerTimer > 0) {
    powerTimer--;
    if (powerTimer === 0) { currentPower = 'normal'; updateHUD(); }
    else if (powerTimer % 60 === 0) updateHUD();
  }

  const newLevel = Math.floor(score/500)+1;
  if (newLevel !== level) {
    level = newLevel;
    enemySpawnInterval = Math.max(42, 108-(level-1)*6);
    enemySpeed = Math.min(2.05, 0.82+(level-1)*0.16);
    updateHUD(); playSound('levelup');
    notify(`LEVEL ${level}!`, C.yellow);
  }
  if (!bossActive) {
    if (level >= 6 && !bossStageSpawned?.[2]) spawnBoss(2);
    else if (level >= 3 && !bossStageSpawned?.[1]) spawnBoss(1);
  }

  if (keys['ArrowLeft'])  player.x = Math.max(player.w/2,     player.x-player.speed);
  if (keys['ArrowRight']) player.x = Math.min(W-player.w/2,   player.x+player.speed);
  if (keys['ArrowUp'])    player.y = Math.max(H*0.28,         player.y-player.speed);
  if (keys['ArrowDown'])  player.y = Math.min(H-player.h/2,   player.y+player.speed);

  const cd = currentPower === 'rapid' ? Math.ceil(shootCooldown/2.5) : shootCooldown;
  if (keys['Space'] && shootTimer === 0) {
    const shotSpeed = 10 + (runUpgrades?.shotSpeed || 0) * 1.2;
    if (currentPower === 'spread') {
      bullets.push({ x:player.x, y:player.y-player.h/2, speed:shotSpeed, vx: 0   });
      bullets.push({ x:player.x, y:player.y-player.h/2, speed: shotSpeed - 1, vx:-3.2 });
      bullets.push({ x:player.x, y:player.y-player.h/2, speed: shotSpeed - 1, vx: 3.2 });
    } else {
      bullets.push({ x:player.x, y:player.y-player.h/2, speed:shotSpeed, vx:0 });
      for (let i = 0; i < Math.min(2, runUpgrades?.twin || 0); i++) {
        const gap = 12 + i * 8;
        bullets.push({ x:player.x-gap, y:player.y-player.h/2+6, speed:shotSpeed - 0.6, vx:-0.45-i*0.18 });
        bullets.push({ x:player.x+gap, y:player.y-player.h/2+6, speed:shotSpeed - 0.6, vx: 0.45+i*0.18 });
      }
    }
    shootTimer = cd; playSound('shoot');
  }

  bullets = bullets.filter(b => { b.y -= b.speed; b.x += b.vx; return b.y > -10 && b.x > -10 && b.x < W+10; });

  if (frameCount % enemySpawnInterval === 0) spawnEnemy();
  if (player.invincible > 0) player.invincible--;

  // ===== BOSS =====
  if (bossActive && boss) {
    boss.fc++;
    if (boss.stateTimer > 0) { boss.stateTimer--; if (boss.stateTimer === 0) boss.bossState = 'normal'; }

    if (bossIntroTimer > 0) {
      bossIntroTimer--;
      const t = 1 - bossIntroTimer / BOSS_INTRO_DURATION;
      const dropT = Math.max(0, (t - 0.38) / 0.62);
      const ease = 1 - Math.pow(1 - dropT, 3);
      boss.y = -140 + (boss.targetY + 140) * ease;
      if (dropT > 0 && bossIntroTimer % 10 === 0) {
        spawnParticles(W / 2 + (Math.random() - 0.5) * 120, boss.targetY + 40, boss.stage === 2 ? '#63C7BA' : '#7A4A2B', 3);
      }
      if (bossIntroTimer === 0) {
        boss.y = boss.targetY;
        screenShake = 24;
        spawnParticles(boss.x, boss.y + 45, boss.stage === 2 ? '#9B86D9' : '#7A4A2B', 38);
        notify(boss.stage === 2 ? 'GORILLA IMPACT!' : 'COFFEE SPLASH!', boss.stage === 2 ? C.mint : C.yellow);
      }
      return;
    }

    if (boss.hp < boss.maxHp*0.5 && boss.phase === 1) {
      boss.phase = 2;
      boss.speed = boss.stage === 2 ? 2.05 : 2.45;
      boss.shootInterval = boss.stage === 2 ? 62 : 54;
      notify('PHASE 2!', boss.stage === 2 ? C.mint : C.pink);
    }

    if (boss.beamPhase === null) {
      boss.beamCooldown--;
      if (boss.beamCooldown <= 0) {
        boss.beamPhase = 'charging'; boss.beamTimer = 90;
        boss.beamX = boss.x; boss.beamChargeSounded = false;
      }
    }
    if (boss.beamPhase === 'charging') {
      boss.beamTimer--;
      if (!boss.beamChargeSounded) { playSound('beamCharge'); boss.beamChargeSounded = true; }
      if (boss.beamTimer <= 0) {
        boss.beamPhase = 'firing'; boss.beamTimer = boss.stage === 2 ? 150 : 130;
        boss.beamX = boss.x; playSound('beam');
      }
    }
    if (boss.beamPhase === 'firing') {
      boss.beamTimer--;
      const hitByBoss2Wave = () => {
        const elapsed = 150 - boss.beamTimer;
        const startY = boss.y + boss.h * 0.38;
        for (let i = 0; i < 4; i++) {
          const y = startY + elapsed * 4.4 - i * 150;
          const waveY = y + Math.sin(player.x * 0.035 + frameCount * 0.18 + i) * (18 + i * 2);
          const gapX = getBoss2ShockGapX(boss, i, elapsed);
          const inSafeGap = Math.abs(player.x - gapX) < 62;
          if (!inSafeGap && Math.abs(player.y - waveY) < 22) return true;
        }
        return false;
      };
      const specialHit = boss.stage === 2
        ? hitByBoss2Wave()
        : Math.abs(player.x-boss.beamX) < 38 && player.y > boss.y+boss.h/2;
      if (player.invincible === 0 && specialHit) {
        lives--; player.invincible = 140; screenShake = 14;
        spawnParticles(player.x, player.y, boss.stage === 2 ? C.lavender : C.blue, 25);
        playSound('hit'); updateHUD();
        if (lives <= 0) gameOverPending = true;
      }
      if (boss.beamTimer <= 0) {
        boss.beamPhase = null; boss.beamCooldown = (boss.stage === 2 ? 330 : 380)+Math.floor(Math.random()*160);
        boss.bossState = 'normal'; boss.stateTimer = 0;
      }
    }

    if (boss.beamPhase === null) {
      boss.x += boss.speed*boss.dir;
      if (boss.x > W-boss.w/2-15 || boss.x < boss.w/2+15) boss.dir *= -1;
    }

    if (boss.beamPhase === null) {
      boss.shootTimer++;
      if (boss.shootTimer >= boss.shootInterval) {
        boss.shootTimer = 0; boss.bossState = 'shooting'; boss.stateTimer = 35;
        const n = boss.phase === 2 ? 5 : 3;
        const spreadSpeed = boss.stage === 2 ? (boss.phase === 2 ? 2.35 : 2.05) : (boss.phase === 2 ? 2.55 : 2.2);
        for (let i = 0; i < n; i++) {
          const a = Math.PI/2+(i-Math.floor(n/2))*0.3;
          enemyBullets.push({ x:boss.x, y:boss.y+boss.h/2, vx:Math.cos(a)*spreadSpeed, vy:Math.sin(a)*spreadSpeed, type: boss.stage === 2 ? 'shock' : 'coffee' });
        }
        if (boss.phase === 2) {
          const dx=player.x-boss.x, dy=player.y-boss.y, d=Math.sqrt(dx*dx+dy*dy);
          const aimedSpeed = boss.stage === 2 ? 2.75 : 2.95;
          enemyBullets.push({ x:boss.x, y:boss.y+boss.h/2, vx:dx/d*aimedSpeed, vy:dy/d*aimedSpeed, type: boss.stage === 2 ? 'shock' : 'coffee' });
        }
        if (enemySoundCooldown === 0) { playSound('enemyShoot'); enemySoundCooldown = 10; }
      }
    }

    bullets = bullets.filter(b => {
      if (!boss) return true;
      if (Math.abs(b.x-boss.x) < boss.hw/2 && Math.abs(b.y-boss.y) < boss.hh/2) {
        boss.hp--; boss.bossState = 'damaged'; boss.stateTimer = 18;
        spawnParticles(b.x, b.y, C.pink, 5); playSound('enemyHit'); updateHUD();
        if (boss.hp <= 0) defeatBoss();
        return false;
      }
      return true;
    });

    if (boss && player.invincible === 0 &&
        Math.abs(boss.x-player.x) < (boss.hw+player.hw)/2 &&
        Math.abs(boss.y-player.y) < (boss.hh+player.hh)/2) {
      lives--; player.invincible = 120; screenShake = 12;
      spawnParticles(player.x, player.y, C.blue, 24);
      playSound('hit'); updateHUD();
      if (lives <= 0) gameOverPending = true;
    }
  }

  // ===== ENEMIES =====
  enemies = enemies.filter(e => {
    e.y += e.speed;
    if (e.pattern === 'sine') {
      e.x = e.startX + Math.sin(e.y/70+e.sineBase)*55;
      e.x = Math.max(e.w/2, Math.min(W-e.w/2, e.x));
    }
    if (e.canShoot && e.y > 0 && Math.random() < e.shootProb*(1+(level-1)*0.055)) {
      const dx=player.x-e.x, dy=player.y-e.y, d=Math.sqrt(dx*dx+dy*dy);
      const bulletSpeed = Math.min(2.75, 1.82 + (level-1) * 0.095) * (e.bulletSpeedMul || 1);
      enemyBullets.push({ x:e.x, y:e.y+e.h/2, vx:dx/d*bulletSpeed, vy:dy/d*bulletSpeed, r: e.bulletR || 7 });
      if (enemySoundCooldown === 0) { playSound('enemyShoot'); enemySoundCooldown = 10; }
    }
    bullets = bullets.filter(b => {
      if (Math.abs(b.x-e.x) < e.hw/2 && Math.abs(b.y-e.y) < e.hh/2) {
        e.hp--; spawnParticles(b.x, b.y, e.color, 5); playSound('enemyHit');
        if (e.hp <= 0) {
          addScore(e.scoreVal);
          spawnParticles(e.x, e.y, e.color, 18);
          if (e.dropBomb) trySpawnPowerup(e.x, e.y, 'bomb');
          else trySpawnPowerup(e.x, e.y);
          playSound('explosion');
        }
        return false;
      }
      return true;
    });
    if (e.hp <= 0) return false;
    if (player.invincible === 0 && Math.abs(e.x-player.x) < (e.hw+player.hw)/2 && Math.abs(e.y-player.y) < (e.hh+player.hh)/2) {
      lives--; player.invincible = 120; screenShake = 10;
      spawnParticles(player.x, player.y, C.blue, 20); playSound('hit'); updateHUD();
      if (lives <= 0) gameOverPending = true;
      return false;
    }
    return e.y < H+e.h;
  });

  enemyBullets = enemyBullets.filter(b => {
    b.x += b.vx; b.y += b.vy;
    const br = b.r || 7;
    if (b.reflected && (b.chain || 0) < 3) {
      let chained = 0;
      for (const other of enemyBullets) {
        if (other === b || other.reflected || other.chainCooldown > 0) continue;
        const or = other.r || 7;
        const dx = other.x - b.x;
        const dy = other.y - b.y;
        const dist = Math.max(1, Math.sqrt(dx * dx + dy * dy));
        if (dist > br + or + 12) continue;
        const nextChain = (b.chain || 0) + 1;
        reflectEnemyBullet(other, dx / dist, dy / dist, nextChain, 0.8);
        other.chainCooldown = 10;
        popEffects.push({ x: other.x, y: other.y, life: 22, maxLife: 22, r: 42 + nextChain * 12 });
        spawnParticles(other.x, other.y, nextChain >= 3 ? C.pink : C.yellow, 10 + nextChain * 3);
        addScore(8 * nextChain);
        chained++;
        if (chained >= 2) break;
      }
      if (chained > 0) {
        screenShake = Math.max(screenShake, 4 + chained);
        notify(chained >= 2 ? 'CHAIN POP!' : 'POP CHAIN!', chained >= 2 ? C.pink : C.yellow);
      }
    }
    if (b.reflected && bossActive && boss &&
        Math.abs(b.x-boss.x) < boss.hw/2 + br &&
        Math.abs(b.y-boss.y) < boss.hh/2 + br) {
      boss.hp -= b.damage || 3;
      boss.bossState = 'damaged';
      boss.stateTimer = 16;
      screenShake = Math.max(screenShake, 6);
      addScore(18);
      spawnParticles(b.x, b.y, C.yellow, 16);
      playSound('enemyHit');
      updateHUD();
      if (boss.hp <= 0) defeatBoss();
      return false;
    }
    if (b.reflected) {
      for (const e of enemies) {
        if (Math.abs(b.x-e.x) < e.hw/2 + br && Math.abs(b.y-e.y) < e.hh/2 + br) {
          e.hp -= b.damage || 3;
          addScore(14);
          spawnParticles(b.x, b.y, C.yellow, 14);
          playSound('enemyHit');
          if (e.hp <= 0) {
            addScore(e.scoreVal);
            spawnParticles(e.x, e.y, e.color, 18);
            if (e.dropBomb) trySpawnPowerup(e.x, e.y, 'bomb');
            else trySpawnPowerup(e.x, e.y);
            playSound('explosion');
          }
          return false;
        }
      }
      return b.y < H+28 && b.y > -28 && b.x > -28 && b.x < W+28;
    }
    if (player.invincible === 0 && Math.abs(b.x-player.x) < player.hw/2 + br * 0.45 && Math.abs(b.y-player.y) < player.hh/2 + br * 0.45) {
      lives--; player.invincible = 120; screenShake = 10;
      spawnParticles(player.x, player.y, C.blue, 20); playSound('hit'); updateHUD();
      if (lives <= 0) gameOverPending = true;
      return false;
    }
    return b.y < H+10 && b.y > -10 && b.x > -10 && b.x < W+10;
  });

  powerups = powerups.filter(p => {
    p.y += p.vy;
    if (Math.abs(p.x-player.x) < player.w/2+p.r && Math.abs(p.y-player.y) < player.h/2+p.r) {
      if (p.type === 'shield') { lives = Math.min(5, lives+1); notify('SHIELD +1', C.mint); }
      else if (p.type === 'bomb') { bombs = Math.min(maxBombs, bombs + 1); notify('POP +1', C.pink); }
      else { currentPower = p.type; powerTimer = POWER_DURATION; notify(p.type.toUpperCase()+' SHOT!', C.lavender); }
      playSound('powerup'); spawnParticles(p.x, p.y, p.color, 15); updateHUD();
      return false;
    }
    return p.y < H+20;
  });

  particles = particles.filter(p => { p.x+=p.vx; p.y+=p.vy; p.vy+=0.07; p.life-=p.decay; return p.life>0; });
  enemyBullets.forEach(b => { if (b.chainCooldown > 0) b.chainCooldown--; });
  popEffects = popEffects.filter(e => { e.life--; return e.life > 0; });
  notifications = notifications.filter(n => { n.life--; return n.life>0; });

  stars.forEach(s => { s.y += s.speed; s.rot += s.rotSpeed; if (s.y > H) { s.y = 0; s.x = Math.random()*W; } });
  clouds.forEach(c => { c.x -= c.speed; if (c.x < -130) c.x = W+130; });

  if (gameOverPending) endGame();
}

function endGame() {
  const prevHi = hiScore;
  if (score > hiScore) { hiScore = score; localStorage.setItem('ssHi', hiScore); }
  playBgm('gameover');
  state = 'over';
  screenShake = 0;
  showOverlay(score > prevHi);
}

// ===== DRAW =====
function draw() {
  ctx.clearRect(0, 0, W, H);

  const sx = state === 'play' && screenShake > 0 ? (Math.random()-0.5)*screenShake : 0;
  const sy = state === 'play' && screenShake > 0 ? (Math.random()-0.5)*screenShake : 0;
  ctx.save();
  ctx.translate(sx, sy);

  drawBackground();
  clouds.forEach(c => drawCloud(c.x, c.y, c.scale, c.alpha));
  stars.forEach(s => drawSparkle(s.x, s.y, s.r, s.color, s.alpha, s.rot));

  if (state === 'play' || state === 'upgrade') {
    particles.forEach(p => drawParticle(p));
    powerups.forEach(drawPowerup);
    bullets.forEach(drawBullet);
    enemyBullets.forEach(drawEnemyBullet);
    popEffects.forEach(drawPopEffect);
    enemies.forEach(drawEnemy);
    if (bossActive && boss && boss.beamPhase !== null) drawBeam(boss);
    if (bossActive && boss) drawBoss(boss);
    if (bossActive && boss) drawBossIntro();
    drawPlayer();

    notifications.forEach(n => {
      const alpha = Math.min(1, n.life/30);
      const yOff  = (1-n.life/150)*45;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = n.color; ctx.strokeStyle = C.outline; ctx.lineWidth = 3;
      ctx.font = 'bold 26px Courier New';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.strokeText(n.text, n.x, n.y-yOff);
      ctx.fillText(n.text, n.x, n.y-yOff);
    });
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  // ボスHPバー（シェイク外）
  if (state === 'play' && bossActive && boss) {
    const bw = 250;
    ctx.fillStyle = '#EED8E8'; ctx.strokeStyle = C.outline; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.roundRect(W/2-bw/2, 6, bw, 12, 6); ctx.fill(); ctx.stroke();
    const ratio = boss.hp / boss.maxHp;
    ctx.fillStyle = `hsl(${150+(1-ratio)*190}, 60%, 70%)`;
    ctx.beginPath(); ctx.roundRect(W/2-bw/2, 6, bw*ratio, 12, 6); ctx.fill();
    ctx.fillStyle = C.outline; ctx.font = 'bold 9px Courier New';
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(`BOSS  ${boss.hp} / ${boss.maxHp}`, W/2, 5);
  }
}

// ===== OVERLAY =====
function showOverlay(isNewHi = false) {
  overlay.style.display = 'flex';
  document.body.classList.remove('title-mode');
  overlay.classList.remove('title-screen');
  overlay.classList.add('game-over-screen');
  upgradeOptionsEl.style.display = 'none';
  overlayTitle.textContent = 'GAME OVER';
  overlayTitle.style.color = '#E04878';
  overlayTitle.style.textShadow = '-2px -2px 0 #2A2A2A, 2px -2px 0 #2A2A2A, -2px 2px 0 #2A2A2A, 2px 2px 0 #2A2A2A, 5px 6px 0 rgba(244,160,192,0.9)';
  overlayTitle.classList.remove('float-anim');
  overlayHint.textContent = `FINAL SCORE: ${score}`;
  overlaySub.textContent  = 'SPACE キーでリスタート';
  overlayHi.textContent   = isNewHi ? '🎉 NEW HI-SCORE!' : (hiScore > 0 ? `HI: ${hiScore}` : '');
  titleLogo.style.display = 'none';
}

function showTitle() {
  overlay.style.display = 'flex';
  document.body.classList.add('title-mode');
  overlay.classList.remove('game-over-screen');
  overlay.classList.add('title-screen');
  upgradeOptionsEl.style.display = 'none';
  overlayTitle.textContent = 'Tixiv Shooting';
  overlayTitle.style.color = '#4A80D4';
  overlayTitle.style.textShadow = '-2px -2px 0 #2A2A2A, 2px -2px 0 #2A2A2A, -2px 2px 0 #2A2A2A, 2px 2px 0 #2A2A2A, 5px 6px 0 rgba(244,160,192,0.9)';
  overlayTitle.classList.add('float-anim');
  overlayHint.textContent = 'START';
  overlayHi.textContent   = hiScore > 0 ? `HI: ${hiScore}` : '';
  overlaySub.textContent  = 'SPACE キーで開始';
  titleLogo.style.display = 'none';
}

// ===== LOOP =====
function loop() {
  updateBootLogoFx();
  updateTitleMusicFx();
  if (state === 'play' && !paused) update();
  draw();
  requestAnimationFrame(loop);
}

// ===== 起動 =====
Promise.all([
  loadImage('p1',     'image/player/player01.png'),
  loadImage('p2',     'image/player/player01.png'),
  loadImage('p3',     'image/player/player01.png'),
  loadImage('b1',     'image/boss/boss01.png'),
  loadImage('b2',     'image/boss/boss02.png'),
  loadImage('b3',     'image/boss/boss02.png'),
  loadImage('bBeam',  'image/boss/boss02.png'),
  loadImage('b2a',    'image/boss2/boss2-01.png'),
  loadImage('b2special', 'image/boss2/boss2-02.png'),
  loadImage('enemy0', 'image/enemy/enemy02.png'),
  loadImage('enemy1', 'image/enemy/enemy03.png'),
  loadImage('enemy2', 'image/enemy/enemy04.png'),
  loadImage('enemy3', 'image/enemy/enemy05.png'),
]).then(() => {
  loadingEl.style.display = 'none';
  initBgm();
  initStars();
  initClouds();
  initGame();
  document.body.classList.add('boot-mode');
  overlay.style.display = 'none';
  loop();
});
</script>
