<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tixiv Shooting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --page-bg:
        radial-gradient(circle at 15% 20%, rgba(239,91,143,0.13), transparent 24%),
        radial-gradient(circle at 86% 82%, rgba(99,199,186,0.18), transparent 26%),
        #FFF8ED;
      --soft-fade-bg:
        radial-gradient(circle at 15% 20%, rgba(239,91,143,0.13), transparent 24%),
        radial-gradient(circle at 86% 82%, rgba(99,199,186,0.18), transparent 26%),
        #FFF8ED;
    }
    body {
      background: var(--page-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      color: #08103A;
      overflow: hidden;
    }
    body.title-mode #hud,
    body.title-mode #hud2 {
      visibility: hidden;
    }
    body.boot-mode #hud,
    body.boot-mode #hud2,
    body.boot-mode #game-wrap {
      visibility: hidden;
    }
    #boot-screen {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      background: var(--page-bg);
      color: #08103A;
    }
    #boot-screen.show { display: flex; }
    #boot-fade {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: var(--soft-fade-bg);
      opacity: 0;
    }
    #boot-screen.fade-to-title #boot-fade {
      animation: bootSoftFade 1.85s cubic-bezier(.33, 0, .16, 1) forwards;
    }
    @keyframes bootSoftFade {
      0%   { opacity: 0; }
      72%  { opacity: 1; }
      100% { opacity: 1; }
    }
    #screen-fade {
      position: absolute;
      inset: 0;
      z-index: 19;
      pointer-events: none;
      background: #FFF8ED;
      opacity: 0;
      display: none;
    }
    #screen-fade.title-fade-in {
      display: block;
      animation: titleSoftReveal 1.65s cubic-bezier(.22, .75, .15, 1) forwards;
    }
    #screen-fade.game-fade-cover {
      display: block;
      animation: gameSoftCover 0.95s cubic-bezier(.33, 0, .16, 1) forwards;
    }
    #screen-fade.game-fade-in {
      display: block;
      animation: gameSoftReveal 1.75s cubic-bezier(.22, .75, .15, 1) forwards;
    }
    @keyframes titleSoftReveal {
      0%   { opacity: 1; }
      34%  { opacity: 1; }
      78%  { opacity: 0.18; }
      100% { opacity: 0; }
    }
    @keyframes gameSoftReveal {
      0%   { opacity: 1; }
      26%  { opacity: 1; }
      82%  { opacity: 0.14; }
      100% { opacity: 0; }
    }
    @keyframes gameSoftCover {
      0%   { opacity: 0; }
      48%  { opacity: 0.62; }
      100% { opacity: 1; }
    }
    #boot-logo {
      width: min(72vw, 680px);
      max-height: 330px;
      object-fit: contain;
      --boot-pop: 0;
      transform: scale(calc(1 + var(--boot-pop) * 0.2));
      transform-origin: center;
      filter:
        drop-shadow(0 10px 16px rgba(8,16,58,0.08))
        drop-shadow(0 0 calc(var(--boot-pop) * 22px) rgba(239,91,143,0.32));
      will-change: transform, filter;
    }
    #boot-logo.boot-pop-play {
      animation: bootLogoPoyon 1.05s cubic-bezier(.18, .95, .22, 1.18) both;
    }
    @keyframes bootLogoPoyon {
      0%   { transform: scale(1) rotate(0deg); }
      16%  { transform: scale(1.2, 0.86) rotate(-1.4deg); }
      34%  { transform: scale(0.88, 1.18) rotate(1.2deg); }
      52%  { transform: scale(1.09, 0.94) rotate(-0.7deg); }
      70%  { transform: scale(0.97, 1.04) rotate(0.4deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    #boot-button {
      margin-top: -8px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #08103A;
      box-shadow: none;
      font-family: 'Courier New', monospace;
      font-weight: 900;
      font-size: 10px;
      letter-spacing: 2.6px;
      text-align: center;
      opacity: 0.78;
    }
    @keyframes bootPulse {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    #hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 560px;
      padding: 10px 10px 2px;
      font-size: 13px;
      letter-spacing: 1.4px;
      font-weight: bold;
      text-shadow: 0 1px 0 #FFFFFF;
    }
    #score-display { color: #08103A; }
    #level-display { color: #EF5B8F; }
    #life-display  { color: #EF5B8F; }
    #hi-display    { color: #08103A; }
    #hud2 {
      display: flex;
      justify-content: space-between;
      width: 560px;
      padding: 1px 10px 8px;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1.2px;
      text-shadow: 0 1px 0 #FFFFFF;
    }
    #power-display { color: #63C7BA; }
    #bomb-display  { color: #EF5B8F; }
    #combo-display { color: #FFC83D; }
    #boss-warning  { color: #EF5B8F; animation: blink 0.5s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    canvas {
      border: 4px solid #08103A;
      box-shadow: 0 8px 0 #EF5B8F, 0 18px 34px rgba(8,16,58,0.18);
      background: #FFF8ED;
      display: block;
      border-radius: 18px;
    }
    #game-wrap {
      position: relative;
      display: inline-block;
      overflow: hidden;
      border-radius: 18px;
    }
    #overlay {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      pointer-events: none;
      border-radius: 18px;
      overflow: hidden;
    }
    #overlay.title-screen {
      background: #FFF8ED url("title/title_sanko.png") center / cover no-repeat;
      justify-content: flex-end;
      padding-bottom: 28px;
      --music-pulse: 0;
      --music-sway: 0;
      filter: saturate(calc(1 + var(--music-pulse) * 0.18)) brightness(calc(1 + var(--music-pulse) * 0.035));
    }
    #title-fx {
      position: absolute;
      inset: 0;
      display: none;
      pointer-events: none;
      overflow: hidden;
    }
    #overlay.title-screen #title-fx { display: block; }
    .title-spark {
      position: absolute;
      width: calc(8px + var(--music-pulse) * 9px);
      height: calc(8px + var(--music-pulse) * 9px);
      background: var(--c);
      clip-path: polygon(50% 0, 61% 34%, 100% 50%, 61% 66%, 50% 100%, 39% 66%, 0 50%, 39% 34%);
      opacity: calc(0.54 + var(--music-pulse) * 0.36);
      transform: translate(-50%, -50%) scale(calc(1 + var(--music-pulse) * 0.8)) rotate(calc(var(--r) + var(--music-sway) * 32deg));
      animation: titleTwinkle var(--d) ease-in-out infinite;
      filter: drop-shadow(0 0 calc(3px + var(--music-pulse) * 10px) rgba(255,255,255,0.8));
    }
    .title-comet {
      position: absolute;
      width: calc(72px + var(--music-pulse) * 42px);
      height: 9px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, var(--c) 32%, var(--c));
      opacity: calc(0.32 + var(--music-pulse) * 0.45);
      transform: translateX(-140px) rotate(var(--a));
      animation: titleComet var(--d) linear infinite;
      box-shadow: 0 0 calc(4px + var(--music-pulse) * 14px) var(--c);
    }
    .title-ring {
      position: absolute;
      left: 50%;
      top: 38%;
      width: calc(150px + var(--music-pulse) * 55px);
      height: calc(150px + var(--music-pulse) * 55px);
      border: 3px solid rgba(239,91,143,0.36);
      border-radius: 50%;
      opacity: calc(0.16 + var(--music-pulse) * 0.28);
      transform: translate(-50%, -50%) scale(calc(1 + var(--music-pulse) * 0.18));
      animation: titleRing 2.4s ease-out infinite;
    }
    @keyframes titleTwinkle {
      0%, 100% { margin-top: 0; }
      50% { margin-top: -12px; }
    }
    @keyframes titleComet {
      from { left: -24%; }
      to { left: 118%; }
    }
    @keyframes titleRing {
      from { opacity: 0.35; }
      to { opacity: 0; transform: translate(-50%, -50%) scale(1.45); }
    }
    #overlay.title-screen #overlay-box {
      background: transparent;
      border: 0;
      box-shadow: none;
      padding: 0;
      display: none;
    }
    #overlay.title-screen #overlay-title,
    #overlay.title-screen #overlay-sub,
    #overlay.title-screen #overlay-controls,
    #overlay.title-screen #title-logo {
      display: none;
    }
    #overlay.title-screen #overlay-hint {
      min-width: 250px;
      padding: 17px 38px;
      border: 4px solid #08103A;
      border-radius: 999px;
      background: #FFF8ED;
      color: #EF5B8F;
      box-shadow: 0 7px 0 #EF5B8F, 0 12px 18px rgba(8,16,58,0.12);
      font-family: 'Fredoka One', 'Arial Rounded MT Bold', cursive;
      font-size: 26px;
      letter-spacing: 10px;
      text-align: center;
    }
    #overlay.title-screen #overlay-hi {
      margin-top: 18px;
      color: #08103A;
      font-size: 13px;
      letter-spacing: 2px;
    }
    #title-ui {
      position: absolute;
      left: 50%;
      bottom: 72px;
      z-index: 2;
      display: none;
      transform: translateX(-50%);
      min-width: 460px;
      padding: 10px 18px 11px;
      border: 0;
      border-radius: 16px;
      background: rgba(255, 248, 237, 0.34);
      box-shadow: none;
      text-align: center;
      font-family: 'Courier New', monospace;
      color: #08103A;
      text-shadow: 0 1px 0 #FFFFFF, 0 0 7px rgba(255,255,255,0.92);
    }
    #overlay.title-screen #title-ui { display: block; }
    .title-start {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 210px;
      padding: 8px 18px 9px;
      border-radius: 999px;
      background: #08103A;
      color: #FFFFFF;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      box-shadow: 0 5px 12px rgba(8,16,58,0.18);
      text-shadow: none;
      transform-origin: center;
    }
    .title-start.title-pressing {
      animation: titleStartPoyon 0.42s cubic-bezier(.17, .92, .25, 1.28) both;
    }
    .title-key {
      display: inline-block;
      padding: 2px 8px 3px;
      border-radius: 6px;
      background: #EF5B8F;
      color: #08103A;
      font-weight: 900;
      letter-spacing: 1px;
      box-shadow: inset 0 -2px 0 rgba(8,16,58,0.16);
    }
    .title-controls {
      margin-top: 13px;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 0.8px;
      white-space: nowrap;
    }
    .title-sep {
      color: #EF5B8F;
      padding: 0 12px;
      font-weight: 900;
    }
    @keyframes titleStartPoyon {
      0%   { transform: scale(1); }
      28%  { transform: scale(1.14, 0.86); }
      56%  { transform: scale(0.94, 1.08); }
      100% { transform: scale(1); }
    }
    #overlay-box {
      background: rgba(255, 248, 237, 0.94);
      border: 4px solid #08103A;
      border-radius: 22px;
      padding: 30px 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 7px 0 #EF5B8F, 0 14px 26px rgba(8,16,58,0.18);
    }
    #overlay.game-over-screen #overlay-box {
      background: transparent;
      border: 0;
      border-radius: 0;
      padding: 0;
      box-shadow: none;
    }
    #overlay.game-clear-screen {
      background: #08103A url("title/title_gameclear.png") center / cover no-repeat;
      justify-content: flex-end;
      padding-bottom: 18px;
    }
    #overlay.game-clear-screen #overlay-box {
      background: rgba(8,16,58,0.68);
      border: 2px solid rgba(255,212,90,0.52);
      border-radius: 18px;
      padding: 12px 42px 14px;
      box-shadow: 0 0 30px rgba(155,134,217,0.38), 0 5px 0 rgba(255,212,90,0.32);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      margin-bottom: 8px;
    }
    #overlay.game-clear-screen #overlay-title { display: none; }
    #clear-stats {
      display: none;
      grid-template-columns: auto auto auto;
      gap: 18px;
      align-items: end;
    }
    #overlay.game-clear-screen #clear-stats { display: grid; }
    .clear-stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 110px;
    }
    #clear-score-label {
      display: none;
      font-size: 10px;
      letter-spacing: 3px;
      color: rgba(255,212,90,0.75);
      font-family: 'Fredoka One', cursive;
    }
    #overlay.game-clear-screen #clear-score-label { display: block; }
    #clear-score-value,
    #clear-time-value {
      display: none;
      font-family: 'Fredoka One', 'Arial Rounded MT Bold', cursive;
      font-size: 42px;
      line-height: 1;
      letter-spacing: 3px;
      color: #FFD45A;
      text-shadow:
        -2px -2px 0 #08103A, 2px -2px 0 #08103A,
        -2px  2px 0 #08103A, 2px  2px 0 #08103A,
        0 0 24px rgba(255,212,90,0.9), 0 0 48px rgba(255,180,50,0.5);
    }
    #clear-time-label {
      display: none;
      font-size: 10px;
      letter-spacing: 3px;
      color: rgba(99,199,186,0.78);
      font-family: 'Fredoka One', cursive;
    }
    #clear-time-value {
      color: #63C7BA;
      text-shadow:
        -2px -2px 0 #08103A, 2px -2px 0 #08103A,
        -2px  2px 0 #08103A, 2px  2px 0 #08103A,
        0 0 24px rgba(99,199,186,0.9), 0 0 48px rgba(99,199,186,0.45);
    }
    #overlay.game-clear-screen #clear-score-value,
    #overlay.game-clear-screen #clear-time-label,
    #overlay.game-clear-screen #clear-time-value { display: block; }
    #clear-rank-label {
      display: none;
      font-size: 10px;
      letter-spacing: 3px;
      color: rgba(255,212,90,0.75);
      font-family: 'Fredoka One', cursive;
    }
    #overlay.game-clear-screen #clear-rank-label { display: block; }
    #clear-rank-value {
      display: none;
      font-family: 'Fredoka One', 'Arial Rounded MT Bold', cursive;
      font-size: 58px;
      line-height: 1;
      letter-spacing: 4px;
      color: #FFD45A;
    }
    #overlay.game-clear-screen #clear-rank-value { display: block; }
    #clear-choices {
      display: none;
      flex-direction: row;
      gap: 14px;
      margin-top: 6px;
    }
    #overlay.game-clear-screen #clear-choices { display: flex; }
    .clear-choice {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,248,237,0.08);
      border: 1.5px solid rgba(255,248,237,0.28);
      border-radius: 10px;
      padding: 7px 14px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      color: rgba(255,248,237,0.82);
      transition: background 0.15s;
      user-select: none;
    }
    .clear-choice:hover { background: rgba(255,248,237,0.2); }
    #choice-ng { border-color: rgba(255,212,90,0.55); color: #FFD45A; }
    #choice-ng:hover { background: rgba(255,212,90,0.18); }
    .clear-choice-key {
      display: inline-block;
      padding: 2px 7px 3px;
      border-radius: 5px;
      background: #EF5B8F;
      color: #08103A;
      font-weight: 900;
      font-size: 12px;
      letter-spacing: 0.5px;
      box-shadow: inset 0 -2px 0 rgba(8,16,58,0.16);
    }
    #overlay.game-clear-screen #overlay-hint { display: none; }
    #overlay.game-clear-screen #overlay-controls,
    #overlay.game-clear-screen #overlay-sub { display: none; }
    #overlay.game-clear-screen #overlay-hi {
      font-size: 13px;
      color: #EF5B8F;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(239,91,143,0.7);
    }
    #overlay.game-clear-screen #overlay-sub {
      font-size: 13px;
      color: rgba(255,248,237,0.7);
      letter-spacing: 1px;
    }
    #clear-fx {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      display: none;
    }
    #overlay.game-clear-screen #clear-fx { display: block; }
    .clear-spark {
      position: absolute;
      border-radius: 50%;
      opacity: 0;
      animation: clearSparkRise var(--d) var(--dl) ease-in-out infinite;
    }
    @keyframes clearSparkRise {
      0%   { opacity: 0;   transform: translateX(-50%) translateY(0)   scale(0.3); }
      20%  { opacity: 1; }
      80%  { opacity: 0.8; }
      100% { opacity: 0;   transform: translateX(-50%) translateY(var(--rise)) scale(0.5); }
    }
    .clear-star {
      position: absolute;
      clip-path: polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
      opacity: 0;
      animation: clearStarFloat var(--d) var(--dl) ease-in-out infinite;
    }
    @keyframes clearStarFloat {
      0%   { opacity: 0;        transform: translateY(20px) rotate(var(--r)) scale(0.4); }
      25%  { opacity: var(--op); }
      75%  { opacity: var(--op); }
      100% { opacity: 0;        transform: translateY(-90px) rotate(calc(var(--r) + 200deg)) scale(0.9); }
    }
    .clear-comet {
      position: absolute;
      height: 6px;
      border-radius: 999px;
      opacity: 0;
      animation: clearComet var(--d) var(--dl) linear infinite;
    }
    @keyframes clearComet {
      0%   { opacity: 0; left: -20%; }
      8%   { opacity: 0.85; }
      85%  { opacity: 0.7; }
      100% { opacity: 0; left: 115%; }
    }
    #overlay-title {
      font-family: 'Fredoka One', 'Arial Rounded MT Bold', cursive;
      font-size: 52px;
      line-height: 1.1;
      letter-spacing: 2px;
      color: #08103A;
      text-shadow:
        -2px -2px 0 #2A2A2A,
         2px -2px 0 #2A2A2A,
        -2px  2px 0 #2A2A2A,
         2px  2px 0 #2A2A2A,
         5px  6px 0 rgba(239,91,143,0.9);
    }
    @keyframes floatTitle {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-7px); }
    }
    .float-anim { animation: floatTitle 2.6s ease-in-out infinite; }

    #overlay p        { font-size: 15px; color: #08103A; font-weight: bold; }
    #overlay-hint     { font-size: 20px; color: #EF5B8F; font-weight: bold; }
    #overlay-hi       { font-size: 15px; color: #63C7BA; font-weight: bold; }
    #overlay-controls { font-size: 11px; color: #08103A; font-weight: normal; }
    #upgrade-options {
      display: none;
      gap: 12px;
      margin-top: 10px;
      width: 430px;
      max-width: 90%;
      pointer-events: auto;
    }
    .upgrade-card {
      flex: 1;
      min-height: 128px;
      padding: 12px 10px;
      border: 3px solid #08103A;
      border-radius: 14px;
      background: #FFFDF6;
      color: #08103A;
      box-shadow: 0 5px 0 #EF5B8F;
      font-family: 'Courier New', monospace;
      cursor: pointer;
      text-align: center;
      pointer-events: auto;
    }
    .upgrade-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 0 #EF5B8F, 0 12px 18px rgba(8,16,58,0.12);
    }
    .upgrade-key {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      margin-bottom: 7px;
      border-radius: 50%;
      background: #08103A;
      color: #FFF8ED;
      font-weight: bold;
      font-size: 13px;
    }
    .upgrade-name {
      min-height: 34px;
      color: #EF5B8F;
      font-weight: bold;
      font-size: 14px;
      line-height: 1.18;
    }
    .upgrade-desc {
      margin-top: 8px;
      font-size: 11px;
      line-height: 1.35;
      color: #08103A;
    }

    /* タイトルロゴ：オーバーレイ内の絶対下部 */
    #title-logo {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 108px;
      opacity: 0.65;
      display: none;
    }

    #loading {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 18px;
      color: #EF5B8F;
      letter-spacing: 3px;
      font-weight: bold;
    }
  </style>
</head>
<body>
<div id="boot-screen" class="show">
  <img id="boot-logo" src="title2/logo.png" alt="TOUGA logo">
  <div id="boot-button">PRESS SPACE</div>
  <div id="boot-fade" aria-hidden="true"></div>
</div>
<div id="hud">
  <span id="score-display">SCORE: 0</span>
  <span id="level-display">LEVEL: 1</span>
  <span id="life-display">LIFE: ❤❤❤</span>
  <span id="hi-display">HI: 0</span>
</div>
<div id="hud2">
  <span id="power-display">POWER: NORMAL</span>
  <span id="bomb-display">POP: 3</span>
  <span id="combo-display">COMBO: x1</span>
  <span id="boss-warning"></span>
</div>
<div id="game-wrap">

<script>
const urlParams = new URLSearchParams(window.location.search);
const DEBUG_BOSS = parseInt(urlParams.get('boss') || '0');
const DEBUG_INVINCIBLE = urlParams.get('invincible') === '1';

const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const scoreEl      = document.getElementById('score-display');
const levelEl      = document.getElementById('level-display');
const lifeEl       = document.getElementById('life-display');
const hiEl         = document.getElementById('hi-display');
const powerEl      = document.getElementById('power-display');
const bombEl       = document.getElementById('bomb-display');
const comboEl      = document.getElementById('combo-display');
const bossEl       = document.getElementById('boss-warning');
const overlay      = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlay-title');
const overlaySub   = document.getElementById('overlay-sub');
const overlayHint  = document.getElementById('overlay-hint');
const upgradeOptionsEl = document.getElementById('upgrade-options');
const overlayHi    = document.getElementById('overlay-hi');
const titleLogo    = document.getElementById('title-logo');
const titleStartEl = document.querySelector('.title-start');
const loadingEl    = document.getElementById('loading');
const titleFx      = document.getElementById('title-fx');
const bootScreen   = document.getElementById('boot-screen');
const bootLogo     = document.getElementById('boot-logo');
const bootFade     = document.getElementById('boot-fade');
const screenFade   = document.getElementById('screen-fade');

// ===== カラーパレット =====
const C = {
  pink:     '#EF5B8F',
  blue:     '#69B7F3',
  yellow:   '#FFC83D',
  gold:     '#FFD45A',
  white:    '#FFF8ED',
  lavender: '#9B86D9',
  mint:     '#63C7BA',
  peach:    '#FFB36B',
  outline:  '#08103A',
  bgTop:    '#FFFDF6',
  bgMid:    '#FFF8ED',
  bgBot:    '#FFF1E1',
};
const PASTEL_COLS = [
  '#EF5B8F','#63C7BA','#FFC83D','#69B7F3','#9B86D9','#FFB36B','#FFF8ED'
];

// ===== BGM =====
const bgmAudio = {};
const seAudio = {};
let currentBgmKey = null;
let bgmReady = false;
let titleAnalyser = null;
let titleAnalyserData = null;
let titleMediaSource = null;
let titlePulse = 0;
let titleBeatPhase = 0;
let titleFxFrame = 0;
let bootCallPulse = 0;
let bootIntroStarted = false;
let bootFadingToTitle = false;
let titleStartPending = false;

function initBgm() {
  bgmAudio.title    = new Audio('music/titlegamen.mp3');
  bgmAudio.battle   = new Audio('music/battle.mp3');
  bgmAudio.boss     = new Audio('music/boss1.mp3');
  bgmAudio.boss2    = new Audio('music/boss2.mp3');
  bgmAudio.boss3a   = new Audio('music/boss3-1.mp3');
  bgmAudio.boss3b   = new Audio('music/boss3-2.mp3');
  bgmAudio.gameclear = new Audio('music/gameclear.mp3');
  bgmAudio.gameover = new Audio('music/gameover.mp3');
  seAudio.charge = new Audio('music/SE/charge.mp3');
  seAudio.feather = new Audio('music/SE/wind.mp3');
  seAudio.featherCharge = new Audio('music/SE/wind2.mp3');
  seAudio.pop = new Audio('music/SE/pop.mp3');
  bgmAudio.title.loop    = true;
  bgmAudio.battle.loop   = true;
  bgmAudio.boss.loop     = true;
  bgmAudio.boss2.loop    = true;
  bgmAudio.boss3a.loop   = true;
  bgmAudio.boss3b.loop   = true;
  bgmAudio.gameclear.loop = true;
  bgmAudio.gameover.loop = true;
  bgmAudio.title.volume    = 0.58;
  bgmAudio.battle.volume = 0.42;
  bgmAudio.boss.volume   = 0.5;
  bgmAudio.boss2.volume  = 0.52;
  bgmAudio.boss3a.volume = 0.54;
  bgmAudio.boss3b.volume = 0.58;
  bgmAudio.gameclear.volume = 0.56;
  bgmAudio.gameover.volume = 0.5;
  seAudio.charge.volume = 0.72;
  seAudio.feather.volume = 0.34;
  seAudio.featherCharge.volume = 0.62;
  seAudio.pop.volume = 0.7;
  Object.values(bgmAudio).forEach(audio => {
    audio.preload = 'auto';
    audio.load();
  });
  Object.values(seAudio).forEach(audio => {
    audio.preload = 'auto';
    audio.load();
  });
  bgmReady = true;
}

function playSeAsset(key, volume = 1) {
  const base = seAudio[key];
  if (!base) return false;
  try {
    const audio = base.cloneNode();
    audio.volume = Math.max(0, Math.min(1, base.volume * volume));
    const playPromise = audio.play();
    if (playPromise && typeof playPromise.catch === 'function') playPromise.catch(() => {});
    return true;
  } catch(e) {
    return false;
  }
}

function playBgm(key) {
  if (!bgmReady || !bgmAudio[key]) return;
  resumeAudio();
  const audio = bgmAudio[key];
  Object.entries(bgmAudio).forEach(([bgmKey, bgm]) => {
    if (bgmKey === key) return;
    bgm.pause();
    bgm.currentTime = 0;
  });
  if (currentBgmKey === key && !audio.paused) return;
  currentBgmKey = key;
  const playPromise = audio.play();
  if (playPromise && typeof playPromise.then === 'function') {
    playPromise.then(() => {
      if (key === 'title') setupTitleAnalyserWhenReady();
    }).catch(() => {
      if (currentBgmKey === key && audio.paused) currentBgmKey = null;
    });
  } else if (key === 'title') {
    setupTitleAnalyserWhenReady();
  }
}

function resumeAudio() {
  const ac = getAC();
  if (ac && ac.state === 'suspended') ac.resume();
}

function playTitleBgmFromGesture() {
  if (!bgmReady || state !== 'title') return;
  if (currentBgmKey !== 'title' || bgmAudio.title.paused) {
    playBgm('title');
  }
}

function ensureTitleBgmPlaying() {
  if (!bgmReady || state !== 'title') return;
  playBgm('title');
}

function setupTitleAnalyserWhenReady() {
  // Keep title BGM as a plain Audio element so browser playback stays reliable.
  // Title effects use a fallback pulse when analyser data is unavailable.
}

function setupTitleAnalyser() {
  const ac = getAC(); if (!ac || !bgmAudio.title || titleAnalyser) return;
  try {
    titleMediaSource = ac.createMediaElementSource(bgmAudio.title);
    titleAnalyser = ac.createAnalyser();
    titleAnalyser.fftSize = 128;
    titleAnalyser.smoothingTimeConstant = 0.72;
    titleAnalyserData = new Uint8Array(titleAnalyser.frequencyBinCount);
    titleMediaSource.connect(titleAnalyser);
    titleAnalyser.connect(ac.destination);
  } catch(e) {
    titleAnalyser = null;
  }
}

function updateTitleMusicFx() {
  if (state !== 'title') return;
  titleFxFrame++;
  let energy = 0;
  if (titleAnalyser && titleAnalyserData && currentBgmKey === 'title' && !bgmAudio.title.paused) {
    titleAnalyser.getByteFrequencyData(titleAnalyserData);
    const bins = Math.min(20, titleAnalyserData.length);
    for (let i = 0; i < bins; i++) energy += titleAnalyserData[i];
    energy = Math.min(1, energy / (bins * 180));
  } else {
    titleBeatPhase += 0.055;
    energy = 0.25 + Math.pow((Math.sin(titleBeatPhase) + 1) / 2, 5) * 0.5;
  }
  titlePulse += (energy - titlePulse) * 0.18;
  const sway = Math.sin(titleFxFrame * 0.035) * (0.35 + titlePulse);
  overlay.style.setProperty('--music-pulse', titlePulse.toFixed(3));
  overlay.style.setProperty('--music-sway', sway.toFixed(3));
}

function updateBootLogoFx() {
  if (!bootLogo) return;
  bootCallPulse += (0 - bootCallPulse) * 0.16;
  bootLogo.style.setProperty('--boot-pop', bootCallPulse.toFixed(3));
}

// ===== AUDIO (SE) =====
let audioCtx = null;
function getAC() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  return audioCtx;
}
function playSound(type) {
  if (type === 'chargeShot' && playSeAsset('charge')) return;
  if (type === 'featherChargeShot' && playSeAsset('featherCharge')) return;
  if (type === 'pop' && playSeAsset('pop')) return;
  if (type === 'featherShoot' && playSeAsset('feather')) return;
  const ac = getAC(); if (!ac) return;
  const osc = ac.createOscillator(), gain = ac.createGain();
  osc.connect(gain); gain.connect(ac.destination);
  const t = ac.currentTime;
  switch (type) {
    case 'shoot':
      osc.frequency.setValueAtTime(880, t);
      osc.frequency.exponentialRampToValueAtTime(440, t + 0.07);
      gain.gain.setValueAtTime(0.07, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
      osc.start(t); osc.stop(t + 0.07); break;
    case 'enemyShoot':
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(260, t);
      osc.frequency.exponentialRampToValueAtTime(130, t + 0.08);
      gain.gain.setValueAtTime(0.04, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
      osc.start(t); osc.stop(t + 0.08); break;
    case 'explosion':
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, t);
      osc.frequency.exponentialRampToValueAtTime(40, t + 0.25);
      gain.gain.setValueAtTime(0.12, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      osc.start(t); osc.stop(t + 0.25); break;
    case 'bigExplosion':
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(120, t);
      osc.frequency.exponentialRampToValueAtTime(25, t + 0.5);
      gain.gain.setValueAtTime(0.2, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
      osc.start(t); osc.stop(t + 0.5); break;
    case 'hit':
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(88, t);
      osc.frequency.exponentialRampToValueAtTime(26, t + 0.32);
      gain.gain.setValueAtTime(0.26, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.36);
      osc.start(t); osc.stop(t + 0.38);
      { const c = ac.createOscillator(), cg = ac.createGain();
        c.type = 'square'; c.frequency.setValueAtTime(360, t); c.frequency.exponentialRampToValueAtTime(88, t + 0.13);
        cg.gain.setValueAtTime(0.16, t); cg.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        c.connect(cg); cg.connect(ac.destination); c.start(t); c.stop(t + 0.17); }
      break;
    case 'powerup':
      osc.frequency.setValueAtTime(440, t);
      osc.frequency.exponentialRampToValueAtTime(1320, t + 0.3);
      gain.gain.setValueAtTime(0.1, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      osc.start(t); osc.stop(t + 0.3); break;
    case 'featherPower':
      [740, 1110, 1480, 2220].forEach((f, i) => {
        const o2 = ac.createOscillator(), g2 = ac.createGain();
        o2.type = i % 2 ? 'triangle' : 'sine';
        o2.connect(g2); g2.connect(ac.destination);
        const ti = t + i * 0.05;
        o2.frequency.setValueAtTime(f, ti);
        o2.frequency.exponentialRampToValueAtTime(f * 1.35, ti + 0.22);
        g2.gain.setValueAtTime(0.11, ti);
        g2.gain.exponentialRampToValueAtTime(0.001, ti + 0.32);
        o2.start(ti); o2.stop(ti + 0.34);
      }); return;
    case 'goldFeatherPower':
      [660, 990, 1320, 1980, 2640, 3300].forEach((f, i) => {
        const o2 = ac.createOscillator(), g2 = ac.createGain();
        o2.type = i < 3 ? 'triangle' : 'sine';
        o2.connect(g2); g2.connect(ac.destination);
        const ti = t + i * 0.04;
        o2.frequency.setValueAtTime(f, ti);
        o2.frequency.exponentialRampToValueAtTime(f * 1.28, ti + 0.22);
        g2.gain.setValueAtTime(0.12, ti);
        g2.gain.exponentialRampToValueAtTime(0.001, ti + 0.36);
        o2.start(ti); o2.stop(ti + 0.38);
      }); return;
    case 'enemyHit':
      [880, 1175, 1568, 2093].forEach((f, i) => {
        const o2 = ac.createOscillator(), g2 = ac.createGain();
        o2.type = i < 2 ? 'triangle' : 'sine';
        o2.connect(g2); g2.connect(ac.destination);
        const ti = t + i * 0.025;
        o2.frequency.setValueAtTime(f, ti);
        o2.frequency.exponentialRampToValueAtTime(f * 1.22, ti + 0.09);
        g2.gain.setValueAtTime(0.07, ti);
        g2.gain.exponentialRampToValueAtTime(0.001, ti + 0.16);
        o2.start(ti); o2.stop(ti + 0.18);
      }); return;
    case 'chargeShot': {
      const thump = ac.createOscillator(), thumpGain = ac.createGain();
      thump.type = 'sawtooth';
      thump.frequency.setValueAtTime(185, t);
      thump.frequency.exponentialRampToValueAtTime(42, t + 0.18);
      thumpGain.gain.setValueAtTime(0.28, t);
      thumpGain.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
      thump.connect(thumpGain); thumpGain.connect(ac.destination);
      thump.start(t); thump.stop(t + 0.24);
      [520, 780, 1170].forEach((f, i) => {
        const o2 = ac.createOscillator(), g2 = ac.createGain();
        const filter = ac.createBiquadFilter();
        o2.type = 'square';
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1200 + i * 420, t);
        filter.Q.setValueAtTime(5.5, t);
        o2.connect(filter); filter.connect(g2); g2.connect(ac.destination);
        const ti = t + i * 0.018;
        o2.frequency.setValueAtTime(f, ti);
        o2.frequency.exponentialRampToValueAtTime(f * 0.42, ti + 0.16);
        g2.gain.setValueAtTime(0.13 - i * 0.02, ti);
        g2.gain.exponentialRampToValueAtTime(0.001, ti + 0.18);
        o2.start(ti); o2.stop(ti + 0.2);
      });
      return;
    }
    case 'chargeTick':
      [380, 520].forEach((f, i) => {
        const o2 = ac.createOscillator(), g2 = ac.createGain();
        const filter = ac.createBiquadFilter();
        o2.type = 'sawtooth';
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(900 + i * 240, t);
        filter.frequency.exponentialRampToValueAtTime(2400 + i * 420, t + 0.18);
        filter.Q.setValueAtTime(7, t);
        o2.connect(filter); filter.connect(g2); g2.connect(ac.destination);
        const ti = t + i * 0.055;
        o2.frequency.setValueAtTime(f, ti);
        o2.frequency.exponentialRampToValueAtTime(f * 5.2, ti + 0.18);
        g2.gain.setValueAtTime(0.001, ti);
        g2.gain.linearRampToValueAtTime(0.035, ti + 0.025);
        g2.gain.exponentialRampToValueAtTime(0.001, ti + 0.22);
        o2.start(ti); o2.stop(ti + 0.24);
      }); return;
    case 'start':
      [392, 523, 659, 880, 1175].forEach((f, i) => {
        const o2 = ac.createOscillator(), g2 = ac.createGain();
        o2.type = i % 2 ? 'triangle' : 'sawtooth';
        o2.connect(g2); g2.connect(ac.destination);
        const ti = t + i * 0.055;
        o2.frequency.setValueAtTime(f, ti);
        o2.frequency.exponentialRampToValueAtTime(f * 1.65, ti + 0.2);
        g2.gain.setValueAtTime(0.13, ti);
        g2.gain.exponentialRampToValueAtTime(0.001, ti + 0.28);
        o2.start(ti); o2.stop(ti + 0.28);
      });
      [1568, 2093, 2637].forEach((f, i) => {
        const o2 = ac.createOscillator(), g2 = ac.createGain();
        o2.type = 'sine';
        o2.connect(g2); g2.connect(ac.destination);
        const ti = t + 0.2 + i * 0.045;
        o2.frequency.setValueAtTime(f, ti);
        o2.frequency.exponentialRampToValueAtTime(f * 1.18, ti + 0.1);
        g2.gain.setValueAtTime(0.09, ti);
        g2.gain.exponentialRampToValueAtTime(0.001, ti + 0.16);
        o2.start(ti); o2.stop(ti + 0.16);
      }); return;
    case 'titlePress':
      [330, 495, 660, 990].forEach((f, i) => {
        const o2 = ac.createOscillator(), g2 = ac.createGain();
        o2.type = 'sine';
        o2.connect(g2); g2.connect(ac.destination);
        const ti = t + i * 0.045;
        o2.frequency.setValueAtTime(f, ti);
        o2.frequency.exponentialRampToValueAtTime(f * 1.22, ti + 0.22);
        g2.gain.setValueAtTime(0.075, ti);
        g2.gain.exponentialRampToValueAtTime(0.001, ti + 0.26);
        o2.start(ti); o2.stop(ti + 0.28);
      });
      return;
    case 'ui':
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(620, t);
      osc.frequency.exponentialRampToValueAtTime(1120, t + 0.08);
      gain.gain.setValueAtTime(0.08, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
      osc.start(t); osc.stop(t + 0.14); break;
    case 'pop':
      [260, 520, 780, 1040, 1560].forEach((f, i) => {
        const o2 = ac.createOscillator(), g2 = ac.createGain();
        o2.type = i < 2 ? 'triangle' : 'sine';
        o2.connect(g2); g2.connect(ac.destination);
        const ti = t + i * 0.028;
        o2.frequency.setValueAtTime(f, ti);
        o2.frequency.exponentialRampToValueAtTime(f * 1.7, ti + 0.2);
        g2.gain.setValueAtTime(0.11, ti);
        g2.gain.exponentialRampToValueAtTime(0.001, ti + 0.28);
        o2.start(ti); o2.stop(ti + 0.3);
      });
      [2093, 2637, 3136].forEach((f, i) => {
        const o2 = ac.createOscillator(), g2 = ac.createGain();
        o2.type = 'sine';
        o2.connect(g2); g2.connect(ac.destination);
        const ti = t + 0.13 + i * 0.045;
        o2.frequency.setValueAtTime(f, ti);
        g2.gain.setValueAtTime(0.075, ti);
        g2.gain.exponentialRampToValueAtTime(0.001, ti + 0.24);
        o2.start(ti); o2.stop(ti + 0.26);
      });
      return;
    case 'bootChime':
      [988, 1319, 1760, 2349].forEach((f, i) => {
        const o2 = ac.createOscillator(), g2 = ac.createGain();
        o2.type = i % 2 ? 'triangle' : 'sine';
        o2.connect(g2); g2.connect(ac.destination);
        const ti = t + i * 0.075;
        o2.frequency.setValueAtTime(f, ti);
        o2.frequency.exponentialRampToValueAtTime(f * 1.18, ti + 0.22);
        g2.gain.setValueAtTime(0.001, ti);
        g2.gain.linearRampToValueAtTime(0.105, ti + 0.018);
        g2.gain.exponentialRampToValueAtTime(0.001, ti + 0.34);
        o2.start(ti); o2.stop(ti + 0.36);
      });
      [2637, 3136, 3951].forEach((f, i) => {
        const o2 = ac.createOscillator(), g2 = ac.createGain();
        o2.type = 'sine';
        o2.connect(g2); g2.connect(ac.destination);
        const ti = t + 0.22 + i * 0.05;
        o2.frequency.setValueAtTime(f, ti);
        g2.gain.setValueAtTime(0.07, ti);
        g2.gain.exponentialRampToValueAtTime(0.001, ti + 0.22);
        o2.start(ti); o2.stop(ti + 0.24);
      });
      return;
    case 'beam':
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(120, t);

    case 'boss3Charge1': {
      const o1 = ac.createOscillator(), g1 = ac.createGain();

        g.gain.setValueAtTime(0.001, t + i * 0.18); g.gain.linearRampToValueAtTime(0.032, t + i * 0.18 + 0.3);

      o1.frequency.setValueAtTime(200, t); o1.frequency.exponentialRampToValueAtTime(28, t + 0.55);

        o.frequency.setValueAtTime(f, t + 0.06 + i * 0.04); o.frequency.exponentialRampToValueAtTime(f * 0.65, t + 0.85);

    case 'boss3Charge2': {
      const filt = ac.createBiquadFilter();
      filt.type = 'bandpass'; filt.frequency.setValueAtTime(600, t); filt.frequency.exponentialRampToValueAtTime(4000, t + 1.5); filt.Q.setValueAtTime(6, t);
      const o1 = ac.createOscillator(), g1 = ac.createGain();
      o1.type = 'sawtooth'; o1.frequency.setValueAtTime(80, t); o1.frequency.exponentialRampToValueAtTime(640, t + 1.5);
      o1.connect(filt); filt.connect(g1); g1.connect(ac.destination);
      g1.gain.setValueAtTime(0.001, t); g1.gain.linearRampToValueAtTime(0.14, t + 0.5);

      o2.type = 'square'; o2.frequency.setValueAtTime(160, t + 0.4); o2.frequency.exponentialRampToValueAtTime(1280, t + 1.5);

      o2.connect(g2); g2.connect(ac.destination); o2.start(t + 0.4); o2.stop(t + 1.6); return;
    }
    case 'boss3Fire2':
      [0, 0.1, 0.2].forEach((delay, i) => {
        const o = ac.createOscillator(), g = ac.createGain();
        const f2 = ac.createBiquadFilter();

    case 'darkBurningCharge': {

      hGain.gain.setValueAtTime(0.001, t);

      [180, 270, 405, 610].forEach((f, i) => {

        const ti = t + 0.3 + i * 0.25;

        g.gain.linearRampToValueAtTime(0.08, ti + 0.08);
        g.gain.exponentialRampToValueAtTime(0.001, ti + 0.72);
        o.connect(g); g.connect(ac.destination); o.start(ti); o.stop(ti + 0.76);
      });

    }
    case 'darkBurningFire': {
      const dur = 1.05;
      const buf = ac.createBuffer(1, Math.ceil(ac.sampleRate * dur), ac.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 0.35);
      const src = ac.createBufferSource(), filt = ac.createBiquadFilter(), g = ac.createGain();
      filt.type = 'bandpass';
      filt.frequency.setValueAtTime(1900, t);
      filt.frequency.exponentialRampToValueAtTime(240, t + dur);
      filt.Q.setValueAtTime(2.6, t);
      g.gain.setValueAtTime(0.46, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      src.buffer = buf; src.connect(filt); filt.connect(g); g.connect(ac.destination);

      [80, 48, 36].forEach((f, i) => {

        o.frequency.setValueAtTime(f, t + i * 0.04);

        o.connect(og); og.connect(ac.destination); o.start(t + i * 0.04); o.stop(t + 0.95);
      });
      return;
    }
    case 'finalBlow': {
      const buf = ac.createBuffer(1, Math.ceil(ac.sampleRate * 0.48), ac.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 0.42);
      const src = ac.createBufferSource();

      src.buffer = buf;
      src.connect(low); low.connect(gNoise); gNoise.connect(ac.destination);
      src.start(t); src.stop(t + 0.5);
      [72, 48, 31].forEach((f, i) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(f, t + i * 0.035);
        o.frequency.exponentialRampToValueAtTime(Math.max(18, f * 0.42), t + 0.5);
        g.gain.setValueAtTime(0.34 - i * 0.06, t + i * 0.035);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.58);
        o.connect(g); g.connect(ac.destination); o.start(t + i * 0.035); o.stop(t + 0.6);
      });
      [1800, 2400, 3200].forEach((f, i) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'square';
        const ti = t + i * 0.025;
        o.frequency.setValueAtTime(f, ti);
        o.frequency.exponentialRampToValueAtTime(f * 0.52, ti + 0.12);
        g.gain.setValueAtTime(0.075, ti);
        g.gain.exponentialRampToValueAtTime(0.001, ti + 0.16);
        o.connect(g); g.connect(ac.destination); o.start(ti); o.stop(ti + 0.18);

    }
    case 'boss3Defeat': {
      // ノイズ爆発
      const buf = ac.createBuffer(1, Math.ceil(ac.sampleRate * 0.95), ac.sampleRate);
      const bd = buf.getChannelData(0);
      for (let i = 0; i < bd.length; i++) bd[i] = (Math.random()*2-1) * Math.pow(1 - i/bd.length, 0.65) * 0.75;
      const nSrc = ac.createBufferSource();
      const nFilt = ac.createBiquadFilter(); nFilt.type = 'lowpass';
      nFilt.frequency.setValueAtTime(900, t); nFilt.frequency.exponentialRampToValueAtTime(80, t + 0.95);
      const nGain = ac.createGain(); nGain.gain.setValueAtTime(0.55, t); nGain.gain.exponentialRampToValueAtTime(0.001, t + 0.95);
      nSrc.buffer = buf; nSrc.connect(nFilt); nFilt.connect(nGain); nGain.connect(ac.destination);

      const sub = ac.createOscillator(), gSub = ac.createGain();

      gSub.gain.setValueAtTime(0.45, t); gSub.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
      sub.connect(gSub); gSub.connect(ac.destination); sub.start(t); sub.stop(t + 0.6);
      // 上昇アルペジオ (勝利ファンファーレ)
      [261, 330, 392, 494, 587, 740, 880, 1047].forEach((f, i) => {
        const d2 = 0.38 + i * 0.085;
        const o2 = ac.createOscillator(), g2 = ac.createGain();
        o2.type = 'triangle'; o2.frequency.setValueAtTime(f, t + d2);
        g2.gain.setValueAtTime(0.11, t + d2); g2.gain.exponentialRampToValueAtTime(0.001, t + d2 + 0.42);
        o2.connect(g2); g2.connect(ac.destination); o2.start(t + d2); o2.stop(t + d2 + 0.42);

      [1047, 1319, 1568, 2093, 1568, 1319, 1047].forEach((f, i) => {
        const d3 = 1.15 + i * 0.075;
        const o3 = ac.createOscillator(), g3 = ac.createGain();

        o3.connect(g3); g3.connect(ac.destination); o3.start(t + d3); o3.stop(t + d3 + 0.22);

    }
    default: return;
  }
}

const imgs = {};

function loadImage(key, src) {
  return new Promise(res => {
    const img = new Image();
    img.onload  = () => { imgs[key] = img; res(); };

}

// ===== INIT =====
function initGame() {
  score = 0; lives = 3; level = 1; frameCount = 0;
  enemySpawnInterval = 108; enemySpeed = 0.78;
  ngBaseScore = 0;
  if (ngInheritedScore > 0) {
    score = ngInheritedScore;
    ngBaseScore = score;
    level = Math.floor(score / 500) + 1;
    enemySpawnInterval = Math.max(42, 108 - (level - 1) * 6);
    enemySpeed = Math.min(1.92, 0.78 + (level - 1) * 0.14);
    ngInheritedScore = 0;
  }
  shootCooldown = 18; shootTimer = 0; chargeFrames = 0; chargeSoundTimer = 0;
  player = { x: W / 2, y: H - 90, w: 61, h: 61, hw: 24, hh: 29, speed: 5, invincible: 0 };
  bullets = []; enemyBullets = []; enemies = []; particles = [];
  powerups = []; notifications = []; popEffects = [];
  bossActive = false; boss = null; bossDeath = null; clearPending = false;
  currentPower = 'normal'; powerTimer = 0;
  screenShake = 0; enemySoundCooldown = 0; gameOverPending = false; bossIntroTimer = 0; hitStopTimer = 0;
  damageFlash = 0; missCount = 0;
  maxBombs = 3; bombs = maxBombs; combo = 0; comboTimer = 0; paused = false;
  bossStageSpawned = { 1: false, 2: false, 3: false };
  if (ngUpgrades) {
    runUpgrades = { ...ngUpgrades };
    ngUpgrades = null;
    applyInheritedUpgrades();
  } else {
    ng = 0;
    runUpgrades = { rapid: 0, shotSpeed: 0, twin: 0, mini: 0, luck: 0, bombStock: 0, heart: 0, feather: 0, goldFeather: 0, chargePath: 0, popPath: 0 };
  }
  upgradeChoices = [];
  updateHUD();
}

function applyInheritedUpgrades() {
  const u = runUpgrades;
  for (let i = 0; i < (u.rapid || 0); i++) shootCooldown = Math.max(10, shootCooldown - 2);
  for (let i = 0; i < (u.mini || 0); i++) {
    player.hw = Math.max(20, player.hw - 4);
    player.hh = Math.max(26, player.hh - 4);
  }
  for (let i = 0; i < (u.bombStock || 0); i++) maxBombs = Math.min(6, maxBombs + 1);
  if ((u.popPath || 0) >= 1) maxBombs = Math.min(8, maxBombs + 2);
  bombs = maxBombs;
}

// ===== HUD =====
function updateHUD() {
  scoreEl.textContent = `SCORE: ${score}`;
  levelEl.textContent = `LEVEL: ${level}${ng > 0 ? ` [NG+${ng}]` : ''}`;
  const hearts = '❤'.repeat(Math.max(0, lives)) + '♡'.repeat(Math.max(0, 3 - lives));
  lifeEl.textContent  = `LIFE: ${hearts}`;
  hiEl.textContent    = `HI: ${Math.max(score, hiScore)}`;
  const pn = { normal: 'NORMAL', spread: 'SPREAD★', rapid: 'RAPID★' };
  const basePower = pn[currentPower] || 'NORMAL';
  const feather = (runUpgrades?.goldFeather || 0) > 0
    ? ' + GOLD FEATHER'
    : (runUpgrades?.feather || 0) > 0 ? ' + FEATHER' : '';
  const rapid = (runUpgrades?.rapid || 0) > 0 ? ` + RAPID${runUpgrades.rapid}` : '';
  const charge = (runUpgrades?.chargePath || 0) > 0 ? ` + CHARGE${runUpgrades.chargePath}` : '';
  const pop = (runUpgrades?.popPath || 0) > 0 ? ` + POP${runUpgrades.popPath}` : '';
  powerEl.textContent = `POWER: ${basePower}${feather}${rapid}${charge}${pop}` + (powerTimer > 0 ? ` ${Math.ceil(powerTimer / 60)}s` : '');
  bombEl.textContent  = `POP: ${bombs}/${maxBombs || 3}`;
  comboEl.textContent = combo >= 3 ? `COMBO: x${getComboMultiplier().toFixed(1)}` : 'COMBO: x1';
  bossEl.textContent  = '';
}

// ===== INPUT =====
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') {
    e.preventDefault();
    if (state === 'boot') startBootIntro();
    else if (state === 'title') startGame();
    else if (state === 'over' || state === 'clear') returnToTitle();
  }
  if (e.code === 'KeyN' && state === 'clear') {
    e.preventDefault();
    startNewGamePlus();
  }
  if (state === 'upgrade' && !e.repeat && ['Digit1', 'Digit2', 'Digit3', 'Numpad1', 'Numpad2', 'Numpad3'].includes(e.code)) {
    e.preventDefault();
    const idx = Number(e.code.slice(-1)) - 1;
    chooseUpgrade(idx);
  }
  if (state === 'play' && !e.repeat && (e.code === 'KeyP' || e.code === 'Escape')) {
    e.preventDefault();
    togglePause();
  }
  if (state === 'play' && !paused && !e.repeat && e.code === 'KeyX') {
    e.preventDefault();
    usePop();
  }
});
document.addEventListener('keyup', e => {
  if (e.code === 'Space' && state === 'play') {
    fireChargedShot();
  }
  delete keys[e.code];
});
document.addEventListener('pointerdown', () => {
  if (state === 'boot') startBootIntro();
  else playTitleBgmFromGesture();
});
if (screenFade) {
  screenFade.addEventListener('animationend', () => {
    if (screenFade.classList.contains('game-fade-cover')) return;
    screenFade.classList.remove('title-fade-in', 'game-fade-in', 'game-fade-cover');
  });
}

function startBootIntro() {
  if (bootIntroStarted) return;
  bootIntroStarted = true;
  resumeAudio();
  playSound('bootChime');
  if (bootLogo) {
    bootLogo.classList.remove('boot-pop-play');
    void bootLogo.offsetWidth;
    bootLogo.classList.add('boot-pop-play');
  }
  window.setTimeout(startTitleFade, 950);
}

function startTitleFade() {
  if (state !== 'boot' || bootFadingToTitle) return;
  bootFadingToTitle = true;
  if (bootScreen) bootScreen.classList.add('fade-to-title');
  playBgm('title');
  window.setTimeout(() => enterTitle(true), 1280);
}

function enterTitle(withFadeIn = false) {
  resumeAudio();
  state = 'title';
  playBgm('title');
  document.body.classList.remove('boot-mode');
  if (bootScreen) bootScreen.classList.remove('fade-to-title');
  bootScreen.classList.remove('show');
  showTitle();
  if (withFadeIn && screenFade) {
    screenFade.classList.remove('title-fade-in');
    void screenFade.offsetWidth;
    screenFade.classList.add('title-fade-in');
  }
}

function returnToTitle() {
  playSound('ui');
  resumeAudio();
  state = 'title';
  playBgm('title');
  screenShake = 0;
  clearPending = false;
  bossDeath = null;
  enemies = [];
  enemyBullets = [];
  bullets = [];
  document.body.classList.add('title-mode');
  overlay.classList.remove('game-clear-screen', 'game-over-screen');
  overlay.classList.add('title-screen');
  showTitle();
}

function startGame() {
  if (titleStartPending) return;
  titleStartPending = true;
  playSound('titlePress');
  if (titleStartEl) {
    titleStartEl.classList.remove('title-pressing');
    void titleStartEl.offsetWidth;
    titleStartEl.classList.add('title-pressing');
  }
  window.setTimeout(() => {
    if (!titleStartPending || state !== 'title' || !screenFade) return;
    screenFade.classList.remove('title-fade-in', 'game-fade-in', 'game-fade-cover');
    void screenFade.offsetWidth;
    screenFade.classList.add('game-fade-cover');
  }, 260);
  window.setTimeout(beginGame, 1120);
}

function beginGame() {
  playSound('start');
  resumeAudio();
  playBgm('battle');
  initGame(); state = 'play';
  titleStartPending = false;
  if (titleStartEl) titleStartEl.classList.remove('title-pressing');
  document.body.classList.remove('title-mode');
  overlay.classList.remove('title-screen', 'game-over-screen', 'game-clear-screen');

function notify(text, color = C.yellow) {
  notifications.push({ text, color, life: 150, x: W / 2, y: H / 2 });
}

function formatClearTime(frames) {
  const totalSeconds = Math.max(0, Math.floor(frames / 60));
  const minutes = Math.floor(totalSeconds / 60);
  const seconds = totalSeconds % 60;
  return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
}

function togglePause() {
  playSound('ui');
  paused = !paused;
  overlay.style.display = paused ? 'flex' : 'none';
  if (paused) {
    document.body.classList.remove('title-mode');
    overlay.classList.remove('title-screen', 'game-clear-screen');
    overlayTitle.textContent = 'PAUSE';
    overlayTitle.style.color = '#9060C8';
    overlayTitle.classList.remove('float-anim');
    overlayHint.textContent = `SCORE: ${score}`;
    overlaySub.textContent = 'P キーで再開';
    overlayHi.textContent = hiScore > 0 ? `HI: ${hiScore}` : '';
    upgradeOptionsEl.style.display = 'none';
    titleLogo.style.display = 'none';
  }
}

function getComboMultiplier() {
  return Math.min(3, 1 + Math.floor(combo / 5) * 0.25);
}

function addScore(baseScore) {
  const gained = Math.round(baseScore * getComboMultiplier());
  score += gained;
  combo++;
  comboTimer = COMBO_DURATION;
  updateHUD();
}

function canOfferUpgrade(u, bossStage = 0) {
  if (u.id === 'bombStock' && maxBombs >= 6) return false;
  if (u.id === 'feather') return bossStage === 1 && (runUpgrades?.feather || 0) === 0;
  if (u.id === 'goldFeather') return bossStage === 2 && (runUpgrades?.feather || 0) > 0 && (runUpgrades?.goldFeather || 0) === 0;
  return true;
}

function getUpgradeChoices(bossStage = 0) {
  if (bossStage === 1 || bossStage === 2) return getBuildUpgradeChoices();
  const guaranteedId = bossStage === 1 && (runUpgrades?.feather || 0) === 0
    ? 'feather'
    : bossStage === 2 && (runUpgrades?.feather || 0) > 0 && (runUpgrades?.goldFeather || 0) === 0 ? 'goldFeather' : null;
  const pool = UPGRADE_POOL.filter(u => canOfferUpgrade(u, bossStage) && u.id !== guaranteedId);
  const choices = [];
  if (guaranteedId) {
    const guaranteed = UPGRADE_POOL.find(u => u.id === guaranteedId);
    if (guaranteed) choices.push(guaranteed);
  }
  const available = [...pool];
  while (choices.length < 3 && available.length > 0) {
    const idx = Math.floor(Math.random() * available.length);
    choices.push(available.splice(idx, 1)[0]);
  }
  return choices;
}

function chooseUpgrade(index) {

function reflectEnemyBullet(b, nx, ny, chain = 0, strength = 1) {
  const popLv = runUpgrades?.popPath || 0;
  const speed = Math.min(6.4 + popLv * 1.15, Math.max(3.6, Math.sqrt(b.vx * b.vx + b.vy * b.vy) * (1.45 + popLv * 0.18) + strength * (1.7 + popLv * 0.55) + chain * (0.35 + popLv * 0.15)));
  b.vx = nx * speed;
  b.vy = ny * speed;
  b.x += nx * (10 + strength * 12);
  b.y += ny * (10 + strength * 12);
  b.reflected = true;
  b.chain = chain;
  b.popped = 42 + popLv * 10;
  b.damage = Math.min(7 + popLv * 4, (b.type === 'coffee' || b.type === 'shock' ? 5 : 3) + chain + popLv * 2);
  b.r = Math.max(b.r || 7, 9 + chain + popLv * 2);
  b.pierce = popLv >= 2 ? 1 : 0;
}

function isPopParryWindow() {
  if ((runUpgrades?.popPath || 0) < 1) return false;
  return enemyBullets.some(b => {
    if (b.reflected) return false;
    const dx = player.x - b.x;
    const dy = player.y - b.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const approaching = dx * (b.vx || 0) + dy * (b.vy || 0) > 0;
    return dist < 92 && (approaching || dist < 58);
  });
}

function emitPopRushWave(strong = false) {
  const count = strong ? 8 : 6;
  const speed = strong ? 5.9 : 4.9;
  for (let i = 0; i < count; i++) {
    const a = i / count * Math.PI * 2 + frameCount * 0.035;
    enemyBullets.push({
      x: player.x + Math.cos(a) * 18,
      y: player.y + Math.sin(a) * 18,
      vx: Math.cos(a) * speed,
      vy: Math.sin(a) * speed,
      r: strong ? 10 : 8,
      type: 'rush',
      reflected: true,
      chain: 1,
      popped: 34,
      damage: strong ? 8 : 5,
      pierce: strong ? 1 : 0,
      popRush: true,
      chainCooldown: 2,
    });
  }
  popEffects.push({ x: player.x, y: player.y, life: 14, maxLife: 14, r: strong ? 92 : 72, level: 0, palette: 'rush' });
}

function pushPlayerBullet(x, y, speed, vx = 0, type = 'normal', damage = 1) {
  const featherLv = runUpgrades?.feather || 0;
  const goldLv = runUpgrades?.goldFeather || 0;
  const finalType = type === 'normal' && goldLv > 0 ? 'goldFeather' : type === 'normal' && featherLv > 0 ? 'feather' : type;
  const finalDamage = finalType === 'goldFeather'
    ? damage + 4
    : finalType === 'feather' ? damage + 2 : damage;
  bullets.push({ x, y, speed, vx, type: finalType, damage: finalDamage, featherLv, goldLv });
}

function getPlayerBulletHitRadius(b) {
  if (b.type === 'charge') return 14 + (b.chargeStage || 1) * 2;
  if (b.type === 'featherCharge') return 14 + (b.chargeStage || 1) * 2;
  if (b.type === 'goldFeather') return 11;
  if (b.type === 'feather') return 9;
  return 4;
}

function pushChargeBullet(x, y, speed, vx, damage, stage, burst = false) {
  bullets.push({ x, y, speed, vx, type: 'charge', damage, chargeStage: stage, burst });
}

function pushFeatherChargeBullet(x, y, speed, vx, damage, stage, burst, isGold) {
  bullets.push({ x, y, speed, vx, type: 'featherCharge', damage, chargeStage: stage, burst, isGold });
}

function explodeChargeBullet(b) {
  if (!b?.burst) return;
  const radius = 76;
  let erased = 0;
  enemyBullets = enemyBullets.filter(eb => {
    const dx = eb.x - b.x;
    const dy = eb.y - b.y;
    if (dx * dx + dy * dy > radius * radius) return true;
    erased++;
    spawnParticles(eb.x, eb.y, C.yellow, 4);
    return false;
  });
  popEffects.push({ x: b.x, y: b.y, life: 30, maxLife: 30, r: radius, level: 3, palette: 'charge' });
  spawnParticles(b.x, b.y, C.yellow, 34);
  if (erased > 0) notify(`BURST CLEAR x${erased}`, C.yellow);
  screenShake = Math.max(screenShake, 10);
}

function fireChargedShot() {
  if (chargeFrames < CHARGE_MIN || state !== 'play') {
    chargeFrames = 0;
    return;
  }
  const chargeLv = runUpgrades?.chargePath || 0;
  const featherLv = runUpgrades?.feather || 0;
  const goldLv = runUpgrades?.goldFeather || 0;
  const hasFeather = featherLv > 0 || goldLv > 0;
  const isGold = goldLv > 0;
  const ratio = Math.min(1, chargeFrames / CHARGE_MAX);
  const stage = chargeLv > 0 && ratio >= 0.82 ? 3 : chargeLv > 0 && ratio >= 0.48 ? 2 : 1;
  const featherBonus = hasFeather ? (isGold ? 5 : 3) : Math.min(2, featherLv);
  const dmg = 4 + Math.round(ratio * 4) + featherBonus + stage + chargeLv;
  const burst = chargeLv >= 2 && stage >= 3;
  const y = player.y - player.h / 2 - 8;
  const speed = 12 + ratio * 2.5 + stage * 0.35;
  const push = hasFeather
    ? (px, py, sp, vx, d) => pushFeatherChargeBullet(px, py, sp, vx, d, stage, burst, isGold)
    : (px, py, sp, vx, d) => pushChargeBullet(px, py, sp, vx, d, stage, burst);
  if (stage === 1) {
    push(player.x, y, speed, 0, dmg);
  } else if (stage === 2) {
    push(player.x - 9, y + 2, speed, -1.05, dmg - 1);
    push(player.x + 9, y + 2, speed, 1.05, dmg - 1);
  } else {
    if (burst) {
      push(player.x, y - 8, speed + 0.6, 0, dmg + 1);
      push(player.x - 14, y, speed + 0.2, -0.9, dmg);
      push(player.x + 14, y, speed + 0.2, 0.9, dmg);
      push(player.x - 26, y + 8, speed - 0.2, -1.75, dmg - 1);
      push(player.x + 26, y + 8, speed - 0.2, 1.75, dmg - 1);
    } else {
      push(player.x, y - 4, speed + 0.5, 0, dmg + 1);
      push(player.x - 18, y + 4, speed, -1.55, dmg);
      push(player.x + 18, y + 4, speed, 1.55, dmg);
    }
  }
  const particleColor = burst ? C.yellow : hasFeather ? (isGold ? C.gold : C.white) : C.pink;
  spawnParticles(player.x, player.y - player.h / 2, particleColor, 26 + stage * 12);
  playSound(hasFeather ? 'featherChargeShot' : 'chargeShot');
  screenShake = Math.max(screenShake, 7 + stage * 2 + (burst ? 3 : 0));
  chargeFrames = 0;
  chargeSoundTimer = 0;
}

function usePop() {
  if (bombs <= 0) return;
  const popLv = runUpgrades?.popPath || 0;
  const parry = isPopParryWindow();
  playSound('pop');
  if (!parry) bombs--;
  screenShake = parry ? 18 : 14;
  const radius = 164 + popLv * 42;
  let popped = 0;
  enemyBullets.forEach(b => {
    const dx = b.x - player.x;
    const dy = b.y - player.y;
    const dist = Math.max(1, Math.sqrt(dx * dx + dy * dy));
    if (dist > radius) return;
    const strength = 1 - dist / radius;
    reflectEnemyBullet(b, dx / dist, dy / dist, 0, strength + popLv * 0.25);
    popped++;
  });
  if (popLv >= 2) {
    const popDamage = 10 + popped * 0.7;
    enemies.forEach(e => {
      const dx = e.x - player.x, dy = e.y - player.y;
      if (dx * dx + dy * dy < radius * radius) {
        e.hp -= popDamage;
        spawnParticles(e.x, e.y, C.mint, 16);
      }
    });
    if (bossActive && boss) {
      const dx = boss.x - player.x, dy = boss.y - player.y;
      if (dx * dx + dy * dy < (radius + boss.hw * 0.45) * (radius + boss.hw * 0.45)) {
        boss.hp -= Math.round(popDamage * 1.2);
        boss.bossState = 'damaged';
        boss.stateTimer = 24;
        spawnParticles(boss.x, boss.y, C.yellow, 24);
        if (boss.hp <= 0) defeatBoss();
      }
    }
  }
  popEffects.push({ x: player.x, y: player.y, life: 44 + popLv * 8, maxLife: 44 + popLv * 8, r: radius, level: popLv });
  if (parry) {
    popEffects.push({ x: player.x, y: player.y, life: 30, maxLife: 30, r: radius * 0.72, level: 2, palette: 'parry' });
    spawnParticles(player.x, player.y, C.white, 26);
    notify('PARRY POP!', C.white);
  }
  if (popLv >= 2) {
    player.popRushTimer = Math.max(player.popRushTimer || 0, 210);
    player.popRushShotTimer = 0;
    emitPopRushWave(true);
    notify(parry ? 'PARRY POP RUSH!' : 'POP RUSH!', C.yellow);
  }
  player.popTimer = 32;
  spawnParticles(player.x, player.y, popLv >= 2 ? C.yellow : C.mint, 34 + popLv * 12);
  spawnParticles(player.x, player.y, popLv >= 2 ? C.pink : C.yellow, 18 + popLv * 10);
  const label = popLv >= 2 ? 'CHAIN POP!' : popped >= 10 ? 'BIG POP!' : popped >= 5 ? 'NICE POP!' : 'POP!';
  notify(popped > 0 ? `${label} x${popped}` : label, popped >= 5 || popLv >= 2 ? C.yellow : C.mint);
  if (popped > 0) score += Math.min(10 + popLv * 6, popped + popLv * 3);
  updateHUD();
}

function defeatBoss() {
  if (!boss) return;
  const bx = boss.x, by = boss.y;
  const defeatedStage = boss.stage;
  addScore(boss.scoreVal);
  spawnParticles(bx, by, C.pink,   40);
  spawnParticles(bx, by, C.yellow, 30);
  spawnParticles(bx, by, C.blue,   20);
  screenShake = 18;
  enemies = [];
  powerups = [];
  if (defeatedStage === 3) {
    clearPending = true;
    hitStopTimer = 34;
    const imgKey = 'b3dead';
    bossDeath = {
      x: boss.x, y: boss.y, w: boss.w, h: boss.h,
      imgKey, life: 210, maxLife: 210, rot: 0,
    };
    bossActive = false;
    boss = null;
    enemyBullets = [];
    bullets = [];
    notifications = [];
    playSound('finalBlow');
    setTimeout(() => playSound('boss3Defeat'), 310);
    notify('DARK YUPPY FALLS...', C.lavender);
    [[260, C.lavender, 42], [560, C.yellow, 54], [920, C.pink, 50], [1280, C.mint, 42], [1660, C.gold, 70]].forEach(([ms, col, n]) => {
      setTimeout(() => {
        if (!bossDeath) return;
        spawnParticles(bx + (Math.random()-0.5)*90, by + (Math.random()-0.5)*75, col, n);
        screenShake = Math.max(screenShake, 14);
      }, ms);
    });
    updateHUD();
    setTimeout(() => {
      if (screenFade) {
        screenFade.classList.remove('title-fade-in', 'game-fade-in', 'game-fade-cover');
        void screenFade.offsetWidth;
        screenFade.classList.add('game-fade-cover');
      }
    }, 2100);
    setTimeout(showClearOverlay, 3050);
    return;
  }
  bossActive = false;
  boss = null;
  enemyBullets = [];
  notify('BOSS DEFEATED!', C.mint);
  playSound('bigExplosion');
  if (state === 'play') playBgm('battle');
  updateHUD();
  showUpgradeSelection(defeatedStage);
}

// ===== BOSS =====
function getBossStageForLevel(lv) {
  if (lv >= 11) return 3;
  if (lv >= 7) return 2;
  return 1;
}

function spawnBoss(stage = getBossStageForLevel(level)) {
  bossActive = true;
  if (bossStageSpawned) bossStageSpawned[stage] = true;
  enemies = []; enemyBullets = []; notifications = [];
  const isBoss2 = stage === 2;
  const isBoss3 = stage === 3;
  const ngMul = 1 + (ng || 0) * 0.25;
  const baseHp = isBoss3 ? Math.round((360 + level * 42) * 1.8) : isBoss2 ? 165 + level * 30 : 72 + level * 28;
  const hp = Math.round(baseHp * ngMul);
  boss = {
    stage, x: W / 2, y: -170, targetY: isBoss3 ? 126 : isBoss2 ? 112 : 100,
    w: isBoss3 ? 214 : isBoss2 ? 196 : 180, h: isBoss3 ? 214 : isBoss2 ? 196 : 180,
    hw: isBoss3 ? 132 : isBoss2 ? 126 : 116, hh: isBoss3 ? 132 : isBoss2 ? 126 : 116,
    hp, maxHp: hp, speed: isBoss3 ? 1.05 : isBoss2 ? 1.25 : 1.5, dir: 1,
    scoreVal: 500 + level * 100 + (isBoss3 ? 900 : isBoss2 ? 350 : 0),
    shootTimer: 0, shootInterval: isBoss3 ? 92 : isBoss2 ? 84 : 70,

// ===== ENEMIES =====
function spawnEnemy() {
  if (bossActive || bossDeath || clearPending || state !== 'play') return;
  const types   = ['heavy', 'basic', 'fast', 'bomber'];
  const weights = level < 3 ? [1, 9, 4, 1] : level < 6 ? [2, 8, 5, 2] : [2, 7, 5, 3];
  const total   = weights.reduce((a, b) => a + b, 0);
  let acc = 0, r = Math.random() * total, type = 'basic';
  for (let i = 0; i < types.length; i++) { acc += weights[i]; if (r < acc) { type = types[i]; break; } }

  const cfg = {
    heavy:  { imgKey: 'enemy0', w: 104, h: 104, hw: 64, hh: 64, hp: 8, speed: enemySpeed * 0.64, color: C.lavender, scoreVal: 55, canShoot: true,  shootProb: 0.0022, bulletR: 15, bulletSpeedMul: 0.58, dropBomb: false },
    basic:  { imgKey: 'enemy1', w: 78,  h: 78,  hw: 48, hh: 48, hp: 2, speed: enemySpeed,        color: C.pink,     scoreVal: 15, canShoot: true,  shootProb: 0.0017, bulletR: 8,  bulletSpeedMul: 0.82, dropBomb: false },
    fast:   { imgKey: 'enemy2', w: 60,  h: 60,  hw: 34, hh: 34, hp: 1, speed: enemySpeed * 1.78, color: C.peach,    scoreVal: 20, canShoot: false, shootProb: 0,      bulletR: 6,  bulletSpeedMul: 1,    dropBomb: false },
    bomber: { imgKey: 'enemy3', w: 78,  h: 78,  hw: 47, hh: 47, hp: 2, speed: enemySpeed * 0.92, color: C.yellow,   scoreVal: 35, canShoot: true,  shootProb: 0.0065, bulletR: 8,  bulletSpeedMul: 0.72, dropBomb: true },
  }[type];

  const pattern = type === 'fast' || Math.random() < 0.22 ? 'sine' : 'straight';
  const startX  = Math.random() * (W - cfg.w) + cfg.w / 2;
  const durabilityBonus = level < 3 ? 0 : level < 6 ? 2 : 3 + Math.floor((level - 6) / 2);
  const ngMul = 1 + (ng || 0) * 0.25;
  const hp = Math.round((cfg.hp + durabilityBonus + (type === 'heavy' ? Math.ceil(durabilityBonus * 0.5) : 0)) * ngMul);
  enemies.push({ x: startX, y: -cfg.h, type, ...cfg, hp, maxHp: hp, pattern, startX, sineBase: Math.random() * Math.PI * 2 });
}

// ===== POWERUP =====
function spawnPowerup(x, y, type) {
  const colors = { spread: C.lavender, rapid: C.yellow, shield: C.mint, bomb: C.pink, feather: C.white };
  powerups.push({ x, y, type, vy: 1.5, r: type === 'bomb' ? 14 : 13, color: colors[type] });
}

function trySpawnPowerup(x, y, forcedType = null) {
  if (forcedType) {
    spawnPowerup(x, y, forcedType);
    return;
  }
  if (Math.random() > Math.min(0.34, 0.18 + (runUpgrades?.luck || 0) * 0.045)) return;
  const types  = ['spread', 'rapid', 'shield'];
  const type   = types[Math.floor(Math.random() * types.length)];
  spawnPowerup(x, y, type);
}

// ===== PARTICLES =====
function spawnParticles(x, y, _color, count = 12) {

      color: PASTEL_COLS[Math.floor(Math.random() * PASTEL_COLS.length)],
      shape: Math.random() < 0.4 ? 'star' : 'circle',
    });

}

// ===== DRAW: 背景 =====
let bgCache = null;
let cloudCaches = [];

function drawBackground() {
  ctx.drawImage(bgCache, 0, 0);
}

function initBgCache() {
  bgCache = document.createElement('canvas');
  bgCache.width = W; bgCache.height = H;
  const bc = bgCache.getContext('2d');
  const grd = bc.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0,    C.bgTop);
  grd.addColorStop(0.45, C.bgMid);
  grd.addColorStop(1,    C.bgBot);
  bc.fillStyle = grd;
  bc.fillRect(0, 0, W, H);
  bc.globalAlpha = 0.32;
  bc.fillStyle = C.pink;
  bc.beginPath();
  for (let y = 28; y < H; y += 26) {
    for (let x = 18; x < W; x += 26) {
      if ((x + y) % 78 === 0) {
        bc.moveTo(x + 1.4, y);
        bc.arc(x, y, 1.4, 0, Math.PI * 2);
      }
    }
  }
  bc.fill();
  bc.globalAlpha = 1;
  const streaks = [
    { x: W - 105, y: 150, w: 92, color: C.yellow, rot: -0.7 },
    { x: W - 72, y: 520, w: 112, color: C.mint, rot: -0.35 },
    { x: 52, y: 610, w: 82, color: C.pink, rot: 0.28 },
  ];
  streaks.forEach(s => {
    bc.save();
    bc.translate(s.x, s.y);
    bc.rotate(s.rot);
    bc.fillStyle = s.color;
    bc.beginPath();
    bc.roundRect(-s.w / 2, -4, s.w, 8, 8);
    bc.fill();
    bc.restore();
  });
  bc.fillStyle = C.pink;
  bc.beginPath();
  bc.arc(-35, H - 70, 105, 0, Math.PI * 2);
  bc.arc(82, H - 20, 96, 0, Math.PI * 2);
  bc.fill();
  bc.fillStyle = C.outline;
  bc.beginPath();
  bc.moveTo(0, H - 22);
  bc.bezierCurveTo(120, H - 110, 215, H + 15, 340, H - 44);
  bc.bezierCurveTo(430, H - 86, 488, H - 18, W, H - 70);
  bc.lineTo(W, H);
  bc.lineTo(0, H);
  bc.closePath();
  bc.fill();
}

// ===== DRAW: 雲 =====
function drawCloud(x, y, scale, alpha) {
  ctx.save();
  ctx.translate(x, y);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#FFF8ED';
  [[0,0,22],[26,6,15],[-26,6,15],[13,-10,13],[-13,-10,13],[38,10,10],[-38,10,10]].forEach(([cx,cy,r]) => {
    ctx.beginPath(); ctx.arc(cx*scale, cy*scale, r*scale, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = alpha * 0.2;
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath(); ctx.ellipse(-10*scale, -8*scale, 25*scale, 10*scale, -0.18, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function initCloudCaches() {
  cloudCaches = clouds.map(c => {
    const sc = c.scale;
    const pad = 6;
    const cw = Math.ceil(96 * sc) + pad * 2;
    const ch = Math.ceil(43 * sc) + pad * 2;
    const ox = Math.ceil(48 * sc) + pad;
    const oy = Math.ceil(23 * sc) + pad;
    const cc = document.createElement('canvas');
    cc.width = cw; cc.height = ch;
    const ct = cc.getContext('2d');
    ct.fillStyle = '#FFF8ED';
    [[0,0,22],[26,6,15],[-26,6,15],[13,-10,13],[-13,-10,13],[38,10,10],[-38,10,10]].forEach(([cx,cy,r]) => {
      ct.beginPath(); ct.arc(ox + cx*sc, oy + cy*sc, r*sc, 0, Math.PI*2); ct.fill();
    });
    ct.globalAlpha = 0.2;
    ct.fillStyle = '#FFFFFF';
    ct.beginPath(); ct.ellipse(ox + (-10*sc), oy + (-8*sc), 25*sc, 10*sc, -0.18, 0, Math.PI*2); ct.fill();
    return { canvas: cc, ox, oy };
  });
}

// ===== DRAW: キラキラ星 =====
function drawSparkle(x, y, r, color, alpha, rot) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 4; i++) {
    const a1 = (i/4)*Math.PI*2, a2 = a1+Math.PI/4;
    ctx.lineTo(Math.cos(a1)*r, Math.sin(a1)*r);
    ctx.lineTo(Math.cos(a2)*r*0.32, Math.sin(a2)*r*0.32);
  }
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = alpha * 0.55;
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath(); ctx.arc(-r*0.2, -r*0.2, r*0.22, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

// ===== DRAW: パーティクル =====
function drawParticle(p) {
  ctx.save();
  ctx.globalAlpha = p.life;
  ctx.fillStyle = p.color;
  ctx.strokeStyle = C.outline; ctx.lineWidth = 1;
  if (p.shape === 'star') {
    ctx.translate(p.x, p.y); ctx.rotate(p.life * 3);
    ctx.beginPath();
    for (let i = 0; i < 4; i++) {
      const a1=(i/4)*Math.PI*2, a2=a1+Math.PI/4;
      ctx.lineTo(Math.cos(a1)*p.r, Math.sin(a1)*p.r);
      ctx.lineTo(Math.cos(a2)*p.r*0.35, Math.sin(a2)*p.r*0.35);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

// ===== DRAW: PLAYER =====
function drawPlayer() {
  const { x, y, w, h, invincible } = player;
  if (invincible > 0 && Math.floor(invincible / 8) % 2 !== 0) return;

  let imgKey = 'p1';
  if (invincible > 0)                imgKey = 'p2';
  else if (currentPower !== 'normal') imgKey = 'p3';

  ctx.save();
  ctx.translate(x, y);
  if (chargeFrames > 0 && state === 'play') {
    const ratio = Math.min(1, chargeFrames / CHARGE_MAX);
    const chargeLv = runUpgrades?.chargePath || 0;
    const stage = chargeLv > 0 && ratio >= 0.82 ? 3 : chargeLv > 0 && ratio >= 0.48 ? 2 : 1;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.22 + ratio * 0.4;
    for (let i = 0; i < stage; i++) {
      ctx.strokeStyle = stage >= 3 ? (i === 0 ? C.yellow : C.pink) : stage === 2 ? (i === 0 ? C.pink : C.mint) : C.pink;
      ctx.lineWidth = 2 + ratio * 2.4 - i * 0.25;
      ctx.beginPath();
      ctx.arc(0, 0, 25 + ratio * 17 + i * 9 + Math.sin(frameCount * (0.16 + i * 0.03)) * 2, 0, Math.PI * 2);
      ctx.stroke();
    }
    if (stage >= 2) {
      ctx.fillStyle = stage >= 3 ? 'rgba(255,212,90,0.62)' : 'rgba(239,91,143,0.52)';
      for (let i = 0; i < stage * 4; i++) {
        const a = i / (stage * 4) * Math.PI * 2 + frameCount * 0.06;
        const rr = 38 + ratio * 18;
        ctx.beginPath();
        ctx.ellipse(Math.cos(a) * rr, Math.sin(a) * rr, 3, 8, a, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }
  if (player.popTimer > 0) {
    const pop = player.popTimer / 24;
    const poyon = Math.sin((1 - pop) * Math.PI) * 0.18 + pop * 0.05;
    ctx.scale(1 + poyon, 1 + poyon * 0.72);
  }
  if (player.popRushTimer > 0) {
    const rush = player.popRushTimer / 210;
    ctx.save();
    ctx.globalAlpha = 0.18 + rush * 0.14;
    ctx.strokeStyle = rush > 0.7 ? C.yellow : C.pink;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, 34 + Math.sin(frameCount * 0.12) * 2, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
  if (invincible > 0) {
    ctx.translate((Math.random()-0.5)*7, (Math.random()-0.5)*7);
    ctx.scale(0.87, 0.87);
  }
  const img = imgs[imgKey];
  if (img) {
    const sx = img.width * 0.18;
    const sy = img.height * 0.2;
    const sw = img.width * 0.64;
    const sh = img.height * 0.66;
    drawImagePartOutlined(img, sx, sy, sw, sh, -w/2, -h/2, w, h, 2.3);
  } else {
    drawPlayerMascot(w, h);
  }
  ctx.restore();
}

function drawPopEffect(e) {
  const t = 1 - e.life / e.maxLife;
  const r = 18 + e.r * t;
  const alpha = Math.max(0, 1 - t);
  const level = e.level || 0;
  const colors = e.palette === 'charge'
    ? ['#FFC83D', '#EF5B8F', '#FFF8ED']
    : e.palette === 'parry'
    ? ['#FFF8ED', '#63C7BA', '#FFC83D']
    : e.palette === 'rush'
    ? ['#FFC83D', '#EF5B8F', '#9B86D9', '#FFF8ED']
    : level >= 2 ? ['#FFC83D', '#EF5B8F', '#9B86D9', '#63C7BA'] : ['#63C7BA', '#EF5B8F', '#FFC83D'];
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.globalCompositeOperation = 'lighter';
  colors.forEach((color, i) => {
    ctx.strokeStyle = color;
    ctx.globalAlpha = alpha * (0.76 - i * 0.1);
    ctx.lineWidth = 8 + level * 1.5 - i * 1.3;
    ctx.beginPath();
    ctx.arc(0, 0, r + i * (9 + level * 2) + Math.sin(frameCount * 0.18 + i) * (2 + level), 0, Math.PI * 2);
    ctx.stroke();
  });
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = alpha;
  const particleCount = e.palette === 'rush' ? 0 : 14 + level * 8;
  for (let i = 0; i < particleCount; i++) {
    const a = i / particleCount * Math.PI * 2 + t * (1.8 + level * 1.4);
    const rr = r * 0.62 + i % 2 * 14;
    ctx.fillStyle = colors[i % colors.length];
    ctx.beginPath();
    ctx.ellipse(Math.cos(a) * rr, Math.sin(a) * rr, 4.5 + level, 9 + level * 2, a, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawPlayerMascot(w, h) {
  ctx.save();
  ctx.strokeStyle = C.outline;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  ctx.fillStyle = '#FFFFFF';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.ellipse(0, 3, w * 0.34, h * 0.42, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();

  ctx.fillStyle = C.white;
  ctx.beginPath();
  ctx.ellipse(-w * 0.34, h * 0.04, w * 0.18, h * 0.09, -0.45, 0, Math.PI * 2);
  ctx.ellipse(w * 0.34, h * 0.04, w * 0.18, h * 0.09, 0.45, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();

  ctx.fillStyle = C.pink;
  [-10, 0, 10].forEach((dx, i) => {
    ctx.beginPath();
    ctx.ellipse(dx * 0.55, -h * 0.43 - i * 1.5, 6, 13, dx * 0.03, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
  });

  ctx.fillStyle = '#FFFFFF';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(-9, -h * 0.17, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(9, -h * 0.17, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.outline;
  ctx.beginPath(); ctx.arc(-8, -h * 0.16, 1.6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(8, -h * 0.16, 1.6, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = C.yellow;
  ctx.beginPath();
  ctx.moveTo(-5, -h * 0.08);
  ctx.lineTo(0, -h * 0.01);
  ctx.lineTo(5, -h * 0.08);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  ctx.fillStyle = '#F8D9CA';
  ctx.strokeStyle = C.outline;
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.ellipse(0, h * 0.12, w * 0.19, h * 0.18, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.white;
  ctx.beginPath(); ctx.ellipse(0, h * 0.12, w * 0.14, h * 0.13, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.pink;
  ctx.beginPath(); ctx.arc(0, h * 0.12, 11, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.yellow;
  ctx.beginPath(); ctx.arc(0, h * 0.12, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

  ctx.strokeStyle = '#E6B792';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-12, h * 0.41); ctx.lineTo(-20, h * 0.5); ctx.moveTo(-12, h * 0.41); ctx.lineTo(-5, h * 0.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(12, h * 0.41); ctx.lineTo(5, h * 0.5); ctx.moveTo(12, h * 0.41); ctx.lineTo(20, h * 0.5); ctx.stroke();
  ctx.restore();
}

// ===== DRAW: ENEMY =====
function drawEnemy(e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  const img = imgs[e.imgKey];
  if (img) {
    drawImageContainOutlined(img, -e.w/2, -e.h/2, e.w, e.h, 2.4);
  } else {
    ctx.fillStyle = e.color; ctx.strokeStyle = C.outline; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, 0, e.w*0.45, e.h*0.45, 0, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
  }
  if (e.maxHp > 1) {
    const bw = e.w * 0.85;
    ctx.fillStyle = '#EED8E8'; ctx.strokeStyle = C.outline; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(-bw/2, e.h/2+3, bw, 6, 3); ctx.fill(); ctx.stroke();
    ctx.fillStyle = C.mint;
    ctx.beginPath(); ctx.roundRect(-bw/2, e.h/2+3, bw*(e.hp/e.maxHp), 6, 3); ctx.fill();
  }
  ctx.restore();
}

// ===== DRAW: BOSS =====
function drawBoss(b) {
  let imgKey = b.stage === 3 ? (b.phase === 2 ? 'b3p2' : 'b3p1') : b.stage === 2 ? 'b2a' : 'b1';
  if (b.stage === 2) {
    if (b.beamPhase !== null || b.bossState === 'shooting') imgKey = 'b2special';
  } else if (b.stage < 2) {
    if (b.beamPhase !== null)            imgKey = 'bBeam';
    else if (b.bossState === 'damaged')  imgKey = 'b3';
    else if (b.bossState === 'shooting') imgKey = 'b2';
  }

  const isB3Special  = b.stage === 3 && b.beamPhase !== null;
  const isB3Shooting = b.stage === 3 && b.bossState === 'shooting';
  const vibAmt   = isB3Special ? 7 : isB3Shooting ? 4 : 0;
  const sizeBoost = isB3Special ? 1.12 : isB3Shooting ? 1.06 : 1.0;
  const pulse    = 1 + Math.sin(b.fc * 0.06) * 0.025;

  ctx.save();
  const vx = vibAmt > 0 ? (Math.random() - 0.5) * vibAmt : 0;
  const vy = vibAmt > 0 ? (Math.random() - 0.5) * vibAmt : 0;
  ctx.translate(b.x + vx, b.y + vy);
  if (b.stage === 3) {
    ctx.shadowColor = b.phase === 2 ? 'rgba(239,91,143,0.65)' : 'rgba(30,20,55,0.7)';
    ctx.shadowBlur  = (isB3Special ? 36 : isB3Shooting ? 26 : 18) + Math.sin(frameCount * 0.08) * 5;
  }
  ctx.scale(pulse * sizeBoost, pulse * sizeBoost);
  const img = imgs[imgKey];
  if (img) {
    drawImageCoverOutlined(img, -b.w/2, -b.h/2, b.w, b.h, 3);
  } else {
    ctx.fillStyle = C.white; ctx.strokeStyle = C.outline; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(0, 0, b.w*0.45, b.h*0.45, 0, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

function drawBossDeath() {
  if (!bossDeath) return;
  const t = 1 - bossDeath.life / bossDeath.maxLife;
  const fall = t * t * 155;
  const squash = Math.sin(frameCount * 0.18) * (0.035 + t * 0.07);
  const scaleX = 1 + Math.sin(t * Math.PI) * 0.08 - t * 0.08 + squash;
  const scaleY = 1 + Math.cos(frameCount * 0.16) * (0.03 + t * 0.06) - t * 0.2;
  const alpha = Math.max(0, 1 - Math.pow(Math.max(0, t - 0.62) / 0.38, 1.4));
  ctx.save();
  ctx.globalAlpha = alpha;
