<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tixiv Shooting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background:
        radial-gradient(circle at 15% 20%, rgba(239,91,143,0.13), transparent 24%),
        radial-gradient(circle at 86% 82%, rgba(99,199,186,0.18), transparent 26%),
        #FFF8ED;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      color: #08103A;
      overflow: hidden;
    }
    body.title-mode #hud,
    body.title-mode #hud2 {
      visibility: hidden;
    }
    body.boot-mode #hud,
    body.boot-mode #hud2,
    body.boot-mode #game-wrap {
      visibility: hidden;
    }
    #boot-screen {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 42px;
      background: #FFFFFF;
      color: #08103A;
    }
    #boot-screen.show { display: flex; }
    #boot-fade {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: #FFFFFF;
      opacity: 0;
    }
    #boot-screen.fade-to-title #boot-fade {
      animation: bootWhiteFade 1.15s ease-in-out forwards;
    }
    @keyframes bootWhiteFade {
      0%   { opacity: 0; }
      42%  { opacity: 1; }
      100% { opacity: 1; }
    }
    #screen-fade {
      position: fixed;
      inset: 0;
      z-index: 19;
      pointer-events: none;
      background: #FFFFFF;
      opacity: 0;
      display: none;
    }
    #screen-fade.title-fade-in {
      display: block;
      animation: titleWhiteReveal 1.15s ease-out forwards;
    }
    @keyframes titleWhiteReveal {
      0%   { opacity: 1; }
      38%  { opacity: 1; }
      100% { opacity: 0; }
    }
    #boot-logo {
      width: min(72vw, 680px);
      max-height: 330px;
      object-fit: contain;
      --boot-pop: 0;
      transform: scale(calc(1 + var(--boot-pop) * 0.2));
      transform-origin: center;
      filter:
        drop-shadow(0 10px 16px rgba(8,16,58,0.08))
        drop-shadow(0 0 calc(var(--boot-pop) * 22px) rgba(239,91,143,0.32));
      will-change: transform, filter;
    }
    #boot-logo.boot-pop-play {
      animation: bootLogoPoyon 1.05s cubic-bezier(.18, .95, .22, 1.18) both;
    }
    @keyframes bootLogoPoyon {
      0%   { transform: scale(1) rotate(0deg); }
      16%  { transform: scale(1.2, 0.86) rotate(-1.4deg); }
      34%  { transform: scale(0.88, 1.18) rotate(1.2deg); }
      52%  { transform: scale(1.09, 0.94) rotate(-0.7deg); }
      70%  { transform: scale(0.97, 1.04) rotate(0.4deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    #boot-button {
      border: 4px solid #08103A;
      border-radius: 999px;
      padding: 18px 44px;
      background: #FFFFFF;
      color: #08103A;
      box-shadow: 0 7px 0 #EF5B8F, 0 16px 24px rgba(8,16,58,0.12);
      font-family: 'Fredoka One', 'Arial Rounded MT Bold', cursive;
      font-size: 24px;
      letter-spacing: 5px;
      animation: bootPulse 1.5s ease-in-out infinite;
    }
    @keyframes bootPulse {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    #hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 560px;
      padding: 10px 10px 2px;
      font-size: 13px;
      letter-spacing: 1.4px;
      font-weight: bold;
      text-shadow: 0 1px 0 #FFFFFF;
    }
    #score-display { color: #08103A; }
    #level-display { color: #EF5B8F; }
    #life-display  { color: #EF5B8F; }
    #hi-display    { color: #08103A; }
    #hud2 {
      display: flex;
      justify-content: space-between;
      width: 560px;
      padding: 1px 10px 8px;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1.2px;
      text-shadow: 0 1px 0 #FFFFFF;
    }
    #power-display { color: #63C7BA; }
    #bomb-display  { color: #EF5B8F; }
    #combo-display { color: #FFC83D; }
    #boss-warning  { color: #EF5B8F; animation: blink 0.5s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    canvas {
      border: 4px solid #08103A;
      box-shadow: 0 8px 0 #EF5B8F, 0 18px 34px rgba(8,16,58,0.18);
      background: #FFF8ED;
      display: block;
      border-radius: 18px;
    }
    #game-wrap {
      position: relative;
      display: inline-block;
    }
    #overlay {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      pointer-events: none;
      border-radius: 18px;
      overflow: hidden;
    }
    #overlay.title-screen {
      background: #FFF8ED url("title/title_sanko.png") center / cover no-repeat;
      justify-content: flex-end;
      padding-bottom: 28px;
      --music-pulse: 0;
      --music-sway: 0;
      filter: saturate(calc(1 + var(--music-pulse) * 0.18)) brightness(calc(1 + var(--music-pulse) * 0.035));
    }
    #title-fx {
      position: absolute;
      inset: 0;
      display: none;
      pointer-events: none;
      overflow: hidden;
    }
    #overlay.title-screen #title-fx { display: block; }
    .title-spark {
      position: absolute;
      width: calc(8px + var(--music-pulse) * 9px);
      height: calc(8px + var(--music-pulse) * 9px);
      background: var(--c);
      clip-path: polygon(50% 0, 61% 34%, 100% 50%, 61% 66%, 50% 100%, 39% 66%, 0 50%, 39% 34%);
      opacity: calc(0.54 + var(--music-pulse) * 0.36);
      transform: translate(-50%, -50%) scale(calc(1 + var(--music-pulse) * 0.8)) rotate(calc(var(--r) + var(--music-sway) * 32deg));
      animation: titleTwinkle var(--d) ease-in-out infinite;
      filter: drop-shadow(0 0 calc(3px + var(--music-pulse) * 10px) rgba(255,255,255,0.8));
    }
    .title-comet {
      position: absolute;
      width: calc(72px + var(--music-pulse) * 42px);
      height: 9px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, var(--c) 32%, var(--c));
      opacity: calc(0.32 + var(--music-pulse) * 0.45);
      transform: translateX(-140px) rotate(var(--a));
      animation: titleComet var(--d) linear infinite;
      box-shadow: 0 0 calc(4px + var(--music-pulse) * 14px) var(--c);
    }
    .title-ring {
      position: absolute;
      left: 50%;
      top: 38%;
      width: calc(150px + var(--music-pulse) * 55px);
      height: calc(150px + var(--music-pulse) * 55px);
      border: 3px solid rgba(239,91,143,0.36);
      border-radius: 50%;
      opacity: calc(0.16 + var(--music-pulse) * 0.28);
      transform: translate(-50%, -50%) scale(calc(1 + var(--music-pulse) * 0.18));
      animation: titleRing 2.4s ease-out infinite;
    }
    @keyframes titleTwinkle {
      0%, 100% { margin-top: 0; }
      50% { margin-top: -12px; }
    }
    @keyframes titleComet {
      from { left: -24%; }
      to { left: 118%; }
    }
    @keyframes titleRing {
      from { opacity: 0.35; }
      to { opacity: 0; transform: translate(-50%, -50%) scale(1.45); }
    }
    #overlay.title-screen #overlay-box {
      background: transparent;
      border: 0;
      box-shadow: none;
      padding: 0;
      display: none;
    }
    #overlay.title-screen #overlay-title,
    #overlay.title-screen #overlay-sub,
    #overlay.title-screen #overlay-controls,
    #overlay.title-screen #title-logo {
      display: none;
    }
    #overlay.title-screen #overlay-hint {
      min-width: 250px;
      padding: 17px 38px;
      border: 4px solid #08103A;
      border-radius: 999px;
      background: #FFF8ED;
      color: #EF5B8F;
      box-shadow: 0 7px 0 #EF5B8F, 0 12px 18px rgba(8,16,58,0.12);
      font-family: 'Fredoka One', 'Arial Rounded MT Bold', cursive;
      font-size: 26px;
      letter-spacing: 10px;
      text-align: center;
    }
    #overlay.title-screen #overlay-hi {
      margin-top: 18px;
      color: #08103A;
      font-size: 13px;
      letter-spacing: 2px;
    }
    #title-ui {
      position: absolute;
      left: 50%;
      bottom: 86px;
      z-index: 2;
      display: none;
      transform: translateX(-50%);
      min-width: 430px;
      padding: 10px 18px 11px;
      border: 0;
      border-radius: 16px;
      background: rgba(255, 248, 237, 0.78);
      box-shadow: none;
      text-align: center;
      font-family: 'Courier New', monospace;
      color: #08103A;
      text-shadow: 0 1px 0 #FFFFFF, 0 0 7px rgba(255,255,255,0.92);
    }
    #overlay.title-screen #title-ui { display: block; }
    .title-start {
      font-family: 'Fredoka One', 'Arial Rounded MT Bold', cursive;
      font-size: 26px;
      letter-spacing: 5px;
      color: #EF5B8F;
      text-shadow: 0 2px 0 #FFFFFF;
      animation: titleStartPulse 1.45s ease-in-out infinite;
    }
    .title-controls {
      margin-top: 8px;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 0.6px;
      white-space: nowrap;
    }
    @keyframes titleStartPulse {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-2px) scale(1.04); }
    }
    #overlay-box {
      background: rgba(255, 248, 237, 0.94);
      border: 4px solid #08103A;
      border-radius: 22px;
      padding: 30px 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 7px 0 #EF5B8F, 0 14px 26px rgba(8,16,58,0.18);
    }
    #overlay.game-over-screen #overlay-box {
      background: transparent;
      border: 0;
      border-radius: 0;
      padding: 0;
      box-shadow: none;
    }
    #overlay-title {
      font-family: 'Fredoka One', 'Arial Rounded MT Bold', cursive;
      font-size: 52px;
      line-height: 1.1;
      letter-spacing: 2px;
      color: #08103A;
      text-shadow:
        -2px -2px 0 #2A2A2A,
         2px -2px 0 #2A2A2A,
        -2px  2px 0 #2A2A2A,
         2px  2px 0 #2A2A2A,
         5px  6px 0 rgba(239,91,143,0.9);
    }
    @keyframes floatTitle {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-7px); }
    }
    .float-anim { animation: floatTitle 2.6s ease-in-out infinite; }

    #overlay p        { font-size: 15px; color: #08103A; font-weight: bold; }
    #overlay-hint     { font-size: 20px; color: #EF5B8F; font-weight: bold; }
    #overlay-hi       { font-size: 15px; color: #63C7BA; font-weight: bold; }
    #overlay-controls { font-size: 11px; color: #08103A; font-weight: normal; }
    #upgrade-options {
      display: none;
      gap: 12px;
      margin-top: 10px;
      width: 430px;
      max-width: 90%;
      pointer-events: auto;
    }
    .upgrade-card {
      flex: 1;
      min-height: 128px;
      padding: 12px 10px;
      border: 3px solid #08103A;
      border-radius: 14px;
      background: #FFFDF6;
      color: #08103A;
      box-shadow: 0 5px 0 #EF5B8F;
      font-family: 'Courier New', monospace;
      cursor: pointer;
      text-align: center;
      pointer-events: auto;
    }
    .upgrade-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 0 #EF5B8F, 0 12px 18px rgba(8,16,58,0.12);
    }
    .upgrade-key {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      margin-bottom: 7px;
      border-radius: 50%;
      background: #08103A;
      color: #FFF8ED;
      font-weight: bold;
      font-size: 13px;
    }
    .upgrade-name {
      min-height: 34px;
      color: #EF5B8F;
      font-weight: bold;
      font-size: 14px;
      line-height: 1.18;
    }
    .upgrade-desc {
      margin-top: 8px;
      font-size: 11px;
      line-height: 1.35;
      color: #08103A;
    }

    /* タイトルロゴ：オーバーレイ内の絶対下部 */
    #title-logo {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 108px;
      opacity: 0.65;
      display: none;
    }

    #loading {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 18px;
      color: #EF5B8F;
      letter-spacing: 3px;
      font-weight: bold;
    }
  </style>
</head>
<body>
<div id="boot-screen" class="show">
  <img id="boot-logo" src="title2/logo.png" alt="TOUGA logo">
  <div id="boot-button">PRESS SPACE</div>
  <div id="boot-fade" aria-hidden="true"></div>
</div>
<div id="screen-fade" aria-hidden="true"></div>
<div id="hud">
  <span id="score-display">SCORE: 0</span>
  <span id="level-display">LEVEL: 1</span>
  <span id="life-display">LIFE: ❤❤❤</span>
  <span id="hi-display">HI: 0</span>
</div>
<div id="hud2">
  <span id="power-display">POWER: NORMAL</span>
  <span id="bomb-display">POP: 3</span>
  <span id="combo-display">COMBO: x1</span>
  <span id="boss-warning"></span>
</div>
<div id="game-wrap">
  <canvas id="canvas" width="560" height="700"></canvas>
  <div id="overlay">
    <div id="title-fx" aria-hidden="true">
      <span class="title-ring"></span>
      <span class="title-spark" style="left: 10%; top: 32%; --c:#EF5B8F; --r:12deg; --d:1.7s;"></span>
      <span class="title-spark" style="left: 17%; top: 55%; --c:#FFC83D; --r:34deg; --d:2.1s;"></span>
      <span class="title-spark" style="left: 26%; top: 41%; --c:#9B86D9; --r:2deg; --d:1.9s;"></span>
      <span class="title-spark" style="left: 72%; top: 56%; --c:#FFC83D; --r:48deg; --d:2.4s;"></span>
      <span class="title-spark" style="left: 84%; top: 46%; --c:#EF5B8F; --r:18deg; --d:1.8s;"></span>
      <span class="title-spark" style="left: 78%; top: 71%; --c:#63C7BA; --r:64deg; --d:2.3s;"></span>
      <span class="title-comet" style="top: 24%; --c:#FFC83D; --a:-36deg; --d:5.5s;"></span>
      <span class="title-comet" style="top: 62%; --c:#EF5B8F; --a:-17deg; --d:6.2s; animation-delay:-2.5s;"></span>
      <span class="title-comet" style="top: 75%; --c:#63C7BA; --a:-23deg; --d:7s; animation-delay:-4s;"></span>
    </div>
    <div id="title-ui" aria-label="title controls">
      <div class="title-start">PRESS SPACE</div>
      <div class="title-controls">
        ← → ↑ ↓ 移動　|　SPACE 射撃　|　X POP　|　P ポーズ
      </div>
    </div>
    <div id="overlay-box">
      <h1 id="overlay-title">Tixiv Shooting</h1>
      <p id="overlay-sub">SPACE キーで開始</p>
      <p id="overlay-hint"></p>
      <div id="upgrade-options"></div>
      <p id="overlay-hi"></p>
      <p id="overlay-controls">← → ↑ ↓ 移動 &nbsp;|&nbsp; SPACE 射撃 &nbsp;|&nbsp; X POP &nbsp;|&nbsp; P ポーズ</p>
    </div>
    <img id="title-logo" src="title/title_sanko.png" alt="logo">
  </div>
</div>
<div id="loading">NOW LOADING...</div>

<script>
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const scoreEl      = document.getElementById('score-display');
const levelEl      = document.getElementById('level-display');
const lifeEl       = document.getElementById('life-display');
const hiEl         = document.getElementById('hi-display');
const powerEl      = document.getElementById('power-display');
const bombEl       = document.getElementById('bomb-display');
const comboEl      = document.getElementById('combo-display');
const bossEl       = document.getElementById('boss-warning');
const overlay      = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlay-title');
const overlaySub   = document.getElementById('overlay-sub');
const overlayHint  = document.getElementById('overlay-hint');
const upgradeOptionsEl = document.getElementById('upgrade-options');
const overlayHi    = document.getElementById('overlay-hi');
const titleLogo    = document.getElementById('title-logo');
const loadingEl    = document.getElementById('loading');
const titleFx      = document.getElementById('title-fx');
const bootScreen   = document.getElementById('boot-screen');
const bootLogo     = document.getElementById('boot-logo');
const bootFade     = document.getElementById('boot-fade');
const screenFade   = document.getElementById('screen-fade');

// ===== カラーパレット =====
const C = {
  pink:     '#EF5B8F',
  blue:     '#69B7F3',
  yellow:   '#FFC83D',
  white:    '#FFF8ED',
  lavender: '#9B86D9',
  mint:     '#63C7BA',
  peach:    '#FFB36B',
  outline:  '#08103A',
  bgTop:    '#FFFDF6',
  bgMid:    '#FFF8ED',
  bgBot:    '#FFF1E1',
};
const PASTEL_COLS = [
  '#EF5B8F','#63C7BA','#FFC83D','#69B7F3','#9B86D9','#FFB36B','#FFF8ED'
];

// ===== BGM =====
const bgmAudio = {};
let currentBgmKey = null;
let bgmReady = false;
let titleAnalyser = null;
let titleAnalyserData = null;
let titleMediaSource = null;
let titlePulse = 0;
let titleBeatPhase = 0;
let titleFxFrame = 0;
let bootCallAudio = null;
let bootCallAnalyser = null;
let bootCallData = null;
let bootCallSource = null;
let bootCallPulse = 0;
let bootCallPlaying = false;
let bootIntroStarted = false;
let bootFadingToTitle = false;

function initBgm() {
  bootCallAudio     = new Audio('music/titelecall.m4a');
  bgmAudio.title    = new Audio('music/titlegamen.mp3');
  bgmAudio.battle   = new Audio('music/battle.mp3');
  bgmAudio.boss     = new Audio('music/boss1.mp3');
  bgmAudio.boss2    = new Audio('music/boss2.mp3');
  bgmAudio.gameover = new Audio('music/gameover.mp3');
  bgmAudio.title.loop    = true;
  bgmAudio.battle.loop   = true;
  bgmAudio.boss.loop     = true;
  bgmAudio.boss2.loop    = true;
  bgmAudio.gameover.loop = true;
  bgmAudio.title.volume    = 0.58;
  bgmAudio.battle.volume = 0.42;
  bgmAudio.boss.volume   = 0.5;
  bgmAudio.boss2.volume  = 0.52;
  bgmAudio.gameover.volume = 0.5;
  bootCallAudio.volume = 0.85;
  bootCallAudio.preload = 'auto';
  bootCallAudio.load();
  Object.values(bgmAudio).forEach(audio => {
    audio.preload = 'auto';
    audio.load();
  });
  bgmReady = true;
}

function setupBootCallAnalyser() {
  const ac = getAC();
  if (!ac || !bootCallAudio || bootCallAnalyser) return;
  try {
    bootCallSource = ac.createMediaElementSource(bootCallAudio);
    bootCallAnalyser = ac.createAnalyser();
    bootCallAnalyser.fftSize = 128;
    bootCallAnalyser.smoothingTimeConstant = 0.54;
    bootCallData = new Uint8Array(bootCallAnalyser.frequencyBinCount);
    bootCallSource.connect(bootCallAnalyser);
    bootCallAnalyser.connect(ac.destination);
  } catch(e) {
    bootCallAnalyser = null;
  }
}

function playBgm(key) {
  if (!bgmReady || !bgmAudio[key]) return;
  resumeAudio();
  const audio = bgmAudio[key];
  Object.entries(bgmAudio).forEach(([bgmKey, bgm]) => {
    if (bgmKey === key) return;
    bgm.pause();
    bgm.currentTime = 0;
  });
  if (currentBgmKey === key && !audio.paused) return;
  currentBgmKey = key;
  const playPromise = audio.play();
  if (playPromise && typeof playPromise.then === 'function') {
    playPromise.then(() => {
      if (key === 'title') setupTitleAnalyserWhenReady();
    }).catch(() => {
      if (currentBgmKey === key && audio.paused) currentBgmKey = null;
    });
  } else if (key === 'title') {
    setupTitleAnalyserWhenReady();
  }
}

function resumeAudio() {
  const ac = getAC();
  if (ac && ac.state === 'suspended') ac.resume();
}

function playTitleBgmFromGesture() {
  if (!bgmReady || state !== 'title') return;
  if (currentBgmKey !== 'title' || bgmAudio.title.paused) {
    playBgm('title');
  }
}

function ensureTitleBgmPlaying() {
  if (!bgmReady || state !== 'title') return;
  playBgm('title');
}

function setupTitleAnalyserWhenReady() {
  // Keep title BGM as a plain Audio element so browser playback stays reliable.
  // Title effects use a fallback pulse when analyser data is unavailable.
}

function setupTitleAnalyser() {
  const ac = getAC(); if (!ac || !bgmAudio.title || titleAnalyser) return;
  try {
    titleMediaSource = ac.createMediaElementSource(bgmAudio.title);
    titleAnalyser = ac.createAnalyser();
    titleAnalyser.fftSize = 128;
    titleAnalyser.smoothingTimeConstant = 0.72;
    titleAnalyserData = new Uint8Array(titleAnalyser.frequencyBinCount);
    titleMediaSource.connect(titleAnalyser);
    titleAnalyser.connect(ac.destination);
  } catch(e) {
    titleAnalyser = null;
  }
}

function updateTitleMusicFx() {
  if (state !== 'title') return;
  titleFxFrame++;
  let energy = 0;
  if (titleAnalyser && titleAnalyserData && currentBgmKey === 'title' && !bgmAudio.title.paused) {
    titleAnalyser.getByteFrequencyData(titleAnalyserData);
    const bins = Math.min(20, titleAnalyserData.length);
    for (let i = 0; i < bins; i++) energy += titleAnalyserData[i];
    energy = Math.min(1, energy / (bins * 180));
  } else {
    titleBeatPhase += 0.055;
    energy = 0.25 + Math.pow((Math.sin(titleBeatPhase) + 1) / 2, 5) * 0.5;
  }
  titlePulse += (energy - titlePulse) * 0.18;
  const sway = Math.sin(titleFxFrame * 0.035) * (0.35 + titlePulse);
  overlay.style.setProperty('--music-pulse', titlePulse.toFixed(3));
  overlay.style.setProperty('--music-sway', sway.toFixed(3));
}

function updateBootLogoFx() {
  if (!bootLogo) return;
  let energy = 0;
  if (bootCallPlaying && bootCallAnalyser && bootCallData) {
    bootCallAnalyser.getByteFrequencyData(bootCallData);
    const bins = Math.min(28, bootCallData.length);
    for (let i = 0; i < bins; i++) energy += bootCallData[i];
    energy = Math.min(1, energy / (bins * 150));
    energy = Math.pow(energy, 1.15);
  }
  bootCallPulse += (energy - bootCallPulse) * (energy > bootCallPulse ? 0.42 : 0.16);
  bootLogo.style.setProperty('--boot-pop', bootCallPulse.toFixed(3));
}

// ===== AUDIO (SE) =====
let audioCtx = null;
function getAC() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  return audioCtx;
}
function playSound(type) {
  const ac = getAC(); if (!ac) return;
  const osc = ac.createOscillator(), gain = ac.createGain();
  osc.connect(gain); gain.connect(ac.destination);
  const t = ac.currentTime;
  switch (type) {
    case 'shoot':
      osc.frequency.setValueAtTime(880, t);
      osc.frequency.exponentialRampToValueAtTime(440, t + 0.07);
      gain.gain.setValueAtTime(0.07, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
      osc.start(t); osc.stop(t + 0.07); break;
    case 'enemyShoot':
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(260, t);
      osc.frequency.exponentialRampToValueAtTime(130, t + 0.08);
      gain.gain.setValueAtTime(0.04, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
      osc.start(t); osc.stop(t + 0.08); break;
    case 'explosion':
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, t);
      osc.frequency.exponentialRampToValueAtTime(40, t + 0.25);
      gain.gain.setValueAtTime(0.12, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      osc.start(t); osc.stop(t + 0.25); break;
    case 'bigExplosion':
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(120, t);
      osc.frequency.exponentialRampToValueAtTime(25, t + 0.5);
      gain.gain.setValueAtTime(0.2, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
      osc.start(t); osc.stop(t + 0.5); break;
    case 'hit':
      osc.type = 'square';
      osc.frequency.setValueAtTime(120, t);
      osc.frequency.exponentialRampToValueAtTime(55, t + 0.25);
      gain.gain.setValueAtTime(0.1, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      osc.start(t); osc.stop(t + 0.25); break;
    case 'powerup':
      osc.frequency.setValueAtTime(440, t);
      osc.frequency.exponentialRampToValueAtTime(1320, t + 0.3);
      gain.gain.setValueAtTime(0.1, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      osc.start(t); osc.stop(t + 0.3); break;
    case 'enemyHit':
      [760, 1140].forEach((f, i) => {
        const o2 = ac.createOscillator(), g2 = ac.createGain();
        o2.type = 'triangle';
        o2.connect(g2); g2.connect(ac.destination);
        const ti = t + i * 0.035;
        o2.frequency.setValueAtTime(f, ti);
        o2.frequency.exponentialRampToValueAtTime(f * 1.35, ti + 0.08);
        g2.gain.setValueAtTime(0.055, ti);
        g2.gain.exponentialRampToValueAtTime(0.001, ti + 0.12);
        o2.start(ti); o2.stop(ti + 0.12);
      }); return;
    case 'start':
      [392, 523, 659, 880, 1175].forEach((f, i) => {
        const o2 = ac.createOscillator(), g2 = ac.createGain();
        o2.type = i % 2 ? 'triangle' : 'sawtooth';
        o2.connect(g2); g2.connect(ac.destination);
        const ti = t + i * 0.055;
        o2.frequency.setValueAtTime(f, ti);
        o2.frequency.exponentialRampToValueAtTime(f * 1.65, ti + 0.2);
        g2.gain.setValueAtTime(0.13, ti);
        g2.gain.exponentialRampToValueAtTime(0.001, ti + 0.28);
        o2.start(ti); o2.stop(ti + 0.28);
      });
      [1568, 2093, 2637].forEach((f, i) => {
        const o2 = ac.createOscillator(), g2 = ac.createGain();
        o2.type = 'sine';
        o2.connect(g2); g2.connect(ac.destination);
        const ti = t + 0.2 + i * 0.045;
        o2.frequency.setValueAtTime(f, ti);
        o2.frequency.exponentialRampToValueAtTime(f * 1.18, ti + 0.1);
        g2.gain.setValueAtTime(0.09, ti);
        g2.gain.exponentialRampToValueAtTime(0.001, ti + 0.16);
        o2.start(ti); o2.stop(ti + 0.16);
      }); return;
    case 'ui':
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(620, t);
      osc.frequency.exponentialRampToValueAtTime(1120, t + 0.08);
      gain.gain.setValueAtTime(0.08, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
      osc.start(t); osc.stop(t + 0.14); break;
    case 'pop':
      [260, 520, 780, 1040, 1560].forEach((f, i) => {
        const o2 = ac.createOscillator(), g2 = ac.createGain();
        o2.type = i < 2 ? 'triangle' : 'sine';
        o2.connect(g2); g2.connect(ac.destination);
        const ti = t + i * 0.028;
        o2.frequency.setValueAtTime(f, ti);
        o2.frequency.exponentialRampToValueAtTime(f * 1.7, ti + 0.2);
        g2.gain.setValueAtTime(0.11, ti);
        g2.gain.exponentialRampToValueAtTime(0.001, ti + 0.28);
        o2.start(ti); o2.stop(ti + 0.3);
      });
      [2093, 2637, 3136].forEach((f, i) => {
        const o2 = ac.createOscillator(), g2 = ac.createGain();
        o2.type = 'sine';
        o2.connect(g2); g2.connect(ac.destination);
        const ti = t + 0.13 + i * 0.045;
        o2.frequency.setValueAtTime(f, ti);
        g2.gain.setValueAtTime(0.075, ti);
        g2.gain.exponentialRampToValueAtTime(0.001, ti + 0.24);
        o2.start(ti); o2.stop(ti + 0.26);
      });
      return;
    case 'bootChime':
      [988, 1319, 1760, 2349].forEach((f, i) => {
        const o2 = ac.createOscillator(), g2 = ac.createGain();
        o2.type = i % 2 ? 'triangle' : 'sine';
        o2.connect(g2); g2.connect(ac.destination);
        const ti = t + i * 0.075;
        o2.frequency.setValueAtTime(f, ti);
        o2.frequency.exponentialRampToValueAtTime(f * 1.18, ti + 0.22);
        g2.gain.setValueAtTime(0.001, ti);
        g2.gain.linearRampToValueAtTime(0.105, ti + 0.018);
        g2.gain.exponentialRampToValueAtTime(0.001, ti + 0.34);
        o2.start(ti); o2.stop(ti + 0.36);
      });
      [2637, 3136, 3951].forEach((f, i) => {
        const o2 = ac.createOscillator(), g2 = ac.createGain();
        o2.type = 'sine';
        o2.connect(g2); g2.connect(ac.destination);
        const ti = t + 0.22 + i * 0.05;
        o2.frequency.setValueAtTime(f, ti);
        g2.gain.setValueAtTime(0.07, ti);
        g2.gain.exponentialRampToValueAtTime(0.001, ti + 0.22);
        o2.start(ti); o2.stop(ti + 0.24);
      });
      return;
    case 'beam':
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(120, t);
      osc.frequency.linearRampToValueAtTime(72, t + 1.8);
      gain.gain.setValueAtTime(0.11, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 1.8);
      osc.start(t); osc.stop(t + 1.8); break;
    case 'beamCharge': {
      const o2 = ac.createOscillator(), g2 = ac.createGain();
      o2.connect(g2); g2.connect(ac.destination);
      o2.type = 'triangle';
      o2.frequency.setValueAtTime(150, t);
      o2.frequency.exponentialRampToValueAtTime(420, t + 1.4);
      g2.gain.setValueAtTime(0.05, t);
      g2.gain.linearRampToValueAtTime(0.1, t + 1.4);
      o2.start(t); o2.stop(t + 1.4); break;
    }
    case 'levelup':
      [440, 550, 660, 880].forEach((f, i) => {
        const o2 = ac.createOscillator(), g2 = ac.createGain();
        o2.connect(g2); g2.connect(ac.destination);
        const ti = t + i * 0.12;
        o2.frequency.setValueAtTime(f, ti);
        g2.gain.setValueAtTime(0.08, ti);
        g2.gain.exponentialRampToValueAtTime(0.001, ti + 0.15);
        o2.start(ti); o2.stop(ti + 0.15);
      }); return;
    default: return;
  }
}

document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') {
    e.preventDefault();
    if (state === 'boot') startBootIntro();
    else if (state === 'title') startGame();
    else if (state === 'over') returnToTitle();
  }
  if (state === 'upgrade' && !e.repeat && ['Digit1', 'Digit2', 'Digit3', 'Numpad1', 'Numpad2', 'Numpad3'].includes(e.code)) {
    e.preventDefault();
    const idx = Number(e.code.slice(-1)) - 1;
    chooseUpgrade(idx);
  }
  if (state === 'play' && !e.repeat && (e.code === 'KeyP' || e.code === 'Escape')) {
    e.preventDefault();
    togglePause();
  }
  if (state === 'play' && !paused && !e.repeat && e.code === 'KeyX') {
    e.preventDefault();
    usePop();
  }
});
document.addEventListener('keyup', e => { delete keys[e.code]; });
document.addEventListener('pointerdown', () => {
  if (state === 'boot') startBootIntro();
  else playTitleBgmFromGesture();
});

  screenFade.addEventListener('animationend', () => {

function startBootIntro() {
  if (bootIntroStarted) return;
  bootIntroStarted = true;
  resumeAudio();
  playSound('bootChime');
  if (bootLogo) {
    bootLogo.classList.remove('boot-pop-play');
    void bootLogo.offsetWidth;
    bootLogo.classList.add('boot-pop-play');
  }
  setupBootCallAnalyser();
  if (!bootCallAudio) {
    window.setTimeout(startTitleFade, 950);
    return;
  }
  bootCallAudio.currentTime = 0;
  bootCallPlaying = true;
  const finish = () => {
    if (state !== 'boot') return;
    bootCallPlaying = false;
    bootCallAudio.removeEventListener('ended', finish);
    startTitleFade();
  };
  bootCallAudio.addEventListener('ended', finish);
  const playPromise = bootCallAudio.play();
  if (playPromise && typeof playPromise.then === 'function') {
    playPromise.catch(() => {
      bootCallPlaying = false;
      window.setTimeout(finish, 950);
    });
  }
  window.setTimeout(finish, 1500);
}

function startTitleFade() {
  if (state !== 'boot' || bootFadingToTitle) return;
  bootFadingToTitle = true;
  if (bootScreen) bootScreen.classList.add('fade-to-title');
  playBgm('title');
  window.setTimeout(() => enterTitle(true), 760);
